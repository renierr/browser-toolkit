<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
  <rect width="250" height="250" fill="#f5f5f4"/>
  
  <!-- Compass circle -->
  <circle cx="125" cy="125" r="80" fill="white" stroke="#444" stroke-width="3"/>
  <circle cx="125" cy="125" r="70" fill="none" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cardinal directions -->
  <text x="125" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF6B35">N</text>
  <text x="125" y="215" text-anchor="middle" font-size="14" fill="#666">S</text>
  <text x="205" y="130" text-anchor="middle" font-size="14" fill="#666">E</text>
  <text x="45" y="130" text-anchor="middle" font-size="14" fill="#666">W</text>
  
  <!-- Diagonal directions -->
  <text x="175" y="75" text-anchor="middle" font-size="10" fill="#999">NE</text>
  <text x="175" y="185" text-anchor="middle" font-size="10" fill="#999">SE</text>
  <text x="75" y="185" text-anchor="middle" font-size="10" fill="#999">SW</text>
  <text x="75" y="75" text-anchor="middle" font-size="10" fill="#999">NW</text>
  
  <!-- Direction lines -->
  <line x1="125" y1="55" x2="125" y2="195" stroke="#ddd" stroke-width="1"/>
  <line x1="45" y1="125" x2="205" y2="125" stroke="#ddd" stroke-width="1"/>
  <line x1="75" y1="75" x2="175" y2="185" stroke="#ddd" stroke-width="1"/>
  <line x1="175" y1="75" x2="75" y2="185" stroke="#ddd" stroke-width="1"/>
  
  <!-- North pointer (red) -->
  <polygon points="125,60 115,125 125,115 135,125" fill="#FF6B35"/>
  <polygon points="125,60 120,70 125,75 130,70" fill="#FF6B35"/>
  
  <!-- South pointer (gray) -->
  <polygon points="125,190 115,125 125,135 135,125" fill="#888"/>
  
  <!-- Center dot -->
  <circle cx="125" cy="125" r="5" fill="#444"/>
  
  <!-- Shadow stick method -->
  <text x="125" y="240" text-anchor="middle" font-size="10" fill="#666">Shadow Stick: Point shadow tip, wait 15min,</text>
  <text x="125" y="252" text-anchor="middle" font-size="10" fill="#666">mark new position - line = E-W</text>
</svg>