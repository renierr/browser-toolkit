<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#f5f5f4"/>
  
  <!-- Person outline (supine) -->
  <ellipse cx="150" cy="40" rx="25" ry="20" fill="#ddd" stroke="#666" stroke-width="2"/>
  <rect x="125" y="55" width="50" height="80" rx="10" fill="#ddd" stroke="#666" stroke-width="2"/>
  <line x1="100" y1="70" x2="60" y2="50" stroke="#666" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="70" x2="240" y2="50" stroke="#666" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="135" x2="100" y2="180" stroke="#666" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="135" x2="200" y2="180" stroke="#666" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Chest compression point -->
  <rect x="135" y="75" width="30" height="40" rx="3" fill="#FF6B35" opacity="0.3"/>
  <circle cx="150" cy="95" r="15" fill="none" stroke="#FF6B35" stroke-width="3"/>
  <text x="150" y="99" text-anchor="middle" font-size="10" fill="#FF6B35" font-weight="bold">X</text>
  
  <!-- Hands overlay -->
  <rect x="130" y="82" width="40" height="35" rx="5" fill="#e8a87c" stroke="#c9785a" stroke-width="2"/>
  <line x1="130" y1="95" x2="170" y2="95" stroke="#c9785a" stroke-width="2"/>
  <line x1="150" y1="82" x2="150" y2="117" stroke="#c9785a" stroke-width="2"/>
  
  <!-- Arrow showing downward pressure -->
  <path d="M150 135 L150 155" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <polygon points="145,150 150,160 155,150" fill="#FF6B35"/>
  
  <!-- Labels -->
  <text x="150" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Chest Compression Point</text>
  <text x="150" y="180" text-anchor="middle" font-size="10" fill="#666">2 inches deep, 100-120/min</text>
  
  <!-- Position notes -->
  <text x="30" y="100" font-size="9" fill="#666">Heel of hand</text>
  <text x="30" y="112" font-size="9" fill="#666">on center</text>
  <text x="30" y="124" font-size="9" fill="#666">of chest</text>
</svg>