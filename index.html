<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Tools</title>

  <script>
    // avoid short flash by checking it first in HTML
    (function () {
      const saved = localStorage.getItem('theme'); // values: 'dark'|'light'|null
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const useDark = saved === 'dark' || (saved === null && prefersDark);

      if (useDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    })();
  </script>
  <script type="module" src="./src/script.ts"></script>
  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/favicon-192.png" />
  <meta name="description" content="Collection of useful tools running only in Browser - with offline support" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
</head>

<body class="flex flex-col min-h-dvh bg-page text-page transition-colors">
  <!-- Global progress overlay -->
  <div id="ui-progress"
    class="fixed inset-0 flex items-center justify-center p-4"
    popover="manual" inert>
    <div class="relative w-full max-w-md rounded-2xl border border-card bg-card shadow-xl p-6">
      <button id="ui-progress-close" type="button"
        class="hidden absolute top-3 right-3 h-9 w-9 items-center justify-center rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 transition text-heading"
        aria-label="Close progress" title="Close">
        &#10005;
      </button>

      <div class="flex items-center gap-4">
        <svg class="h-6 w-6 animate-spin text-heading" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>

        <div class="flex-1 min-w-0">
          <div class="text-sm text-card-desc">Progress</div>
          <div id="ui-progress-text" class="wrap-break-word font-semibold text-heading">Working…</div>
        </div>
      </div>

      <!-- Optional content area (e.g. image preview) managed by showProgress -->
      <div id="ui-progress-content"
        class="mt-4 items-center justify-center mx-auto overflow-hidden rounded-lg"
        style="display:none; max-width:40dvw; max-height:50dvh">
      </div>
    </div>
  </div>

  <!-- Global message stack (toasts) -->
  <div id="ui-messages" class="toast z-[1000]" popover="manual" inert aria-live="polite" aria-relevant="additions"></div>

  <!-- Wake lock indicator (hidden by default) -->
  <button id="wake-lock-indicator" type="button"
    class="hidden fixed top-4 left-4.5 z-50 h-8 w-8 rounded-full bg-accent text-accent-content flex items-center justify-center shadow-md cursor-pointer"
    title="Wake lock active" aria-hidden="true" aria-label="Wake lock active">
    <svg id="wake-lock-icon-active" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true" focusable="false">
      <rect x="3" y="11" width="18" height="11" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0110 0v4"></path>
    </svg>
    <svg id="wake-lock-icon-disabled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="hidden h-4 w-4" aria-hidden="true" focusable="false">
      <rect x="3" y="11" width="18" height="11" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0110 0v4"></path>
      <path d="M4 20L20 4"></path>
    </svg>
    <span id="wake-lock-indicator-label" class="sr-only">Screen wake lock active</span>
  </button>

  <!-- App -->
  <div id="app" class="grow flex flex-col"></div>

  <!-- Scroll-to-top button (shown only after scrolling down) -->
  <button id="scroll-to-top" type="button"
    class="cursor-pointer fixed bottom-5 right-5 z-40 h-11 w-11 rounded-full border border-card bg-card text-heading shadow-lg transition-opacity duration-200 opacity-0 pointer-events-none hover:bg-base-100"
    aria-label="Scroll to top" title="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 mx-auto" aria-hidden="true" focusable="false">
      <path d="m18 15-6-6-6 6"></path>
    </svg>
  </button>

</body>

</html>
