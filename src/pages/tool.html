<main class="container mx-auto px-0 sm:px-4 py-4 sm:py-8 flex-1 min-h-0 flex flex-col items-start">
  <div class="flex items-center gap-4 mb-4 sm:mb-6 ms-1 md:ms-4">
    <button
      id="overview-btn"
      class="inline-flex items-center gap-0.5 text-link hover:text-link transition-colors font-medium cursor-pointer"
      title="Go to Overview"
    >
      <span data-lucide="layout-grid" class="w-4"></span> Overview
    </button>
    <span class="text-muted/30 hidden" id="nav-divider">|</span>
    <button
      id="back-btn"
      class="inline-flex items-center gap-0.5 text-link hover:text-link transition-colors font-medium cursor-pointer hidden"
      title="Go back"
    >
      <span data-lucide="arrow-left" class="w-4"></span> Back
    </button>
  </div>
  <div
    id="tool-content"
    class="flex flex-col flex-1 min-h-0 h-full prose w-full max-w-none prose-invert prose-a prose-headings"
  >
    <!-- Tool-HTML will be loaded here -->
