<main class="container mx-auto px-4 py-8">
  <p id="header-description" class="mb-2">
    Collection of useful tools ({{ toolCount }}) running only in Browser - with offline support
  </p>

  <div class="flex gap-2 mb-8">
    <div class="relative flex-1 min-w-0">
      <input
        type="text"
        id="search"
        placeholder="Search tools..."
        class="input input-bordered w-full pr-10"
        aria-label="Tool search"
      />
      <button
        id="clear-search"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-base-content/50 hover:text-base-content hidden"
        aria-label="Clear search"
        title="Clear search"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <button
      id="overview-settings-open"
      type="button"
      class="btn btn-square btn-ghost"
      aria-label="Open settings"
      title="View settings"
    >
      <i data-lucide="settings" class="w-6 h-6"></i>
    </button>
  </div>

  <include src="overview-settings-dialog.html" />

  <div id="tools-grid" class="flex flex-col gap-6">
    <!-- Tools will be placed here via JS -->
  </div>
</main>
