<main class="container mx-auto px-4 py-8">
  <p id="header-description" class="mb-2">
    Collection of useful tools ({{ toolCount }}) running only in Browser - with offline support
  </p>

  <div class="flex gap-2 mb-8">
    <div class="relative flex-1 min-w-0">
      <input
        type="text"
        id="search"
        placeholder="Search tools..."
        class="input input-bordered w-full pr-10"
        aria-label="Tool search"
      />
      <button
        id="clear-search"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-base-content/50 hover:text-base-content hidden"
        aria-label="Clear search"
        title="Clear search"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="dropdown dropdown-end">
      <label tabindex="0" class="btn btn-square btn-ghost" aria-label="Settings">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </label>
      <div
        tabindex="0"
        class="dropdown-content z-5 menu p-4 shadow bg-base-100 rounded-box w-64 border"
        id="overview-settings"
      >
        <h3 class="font-bold text-lg mb-2">View Settings</h3>
        <div class="form-control">
          <label class="label cursor-pointer justify-start gap-3">
            <input
              type="checkbox"
              class="toggle toggle-sm toggle-primary"
              data-setting="compactMode"
            />
            <span class="label-text">Compact Mode</span>
          </label>
        </div>
        <div class="form-control mt-2">
          <label class="label cursor-pointer justify-start gap-3 mb-2">
            <input
              type="checkbox"
              class="toggle toggle-sm toggle-primary"
              data-setting="flatList"
            />
            <span class="label-text">Flat list (paginate)</span>
          </label>

          <label class="label mt-2">
            <span class="label-text">Page size</span>
          </label>
          <select class="select select-sm w-full" data-setting="pageSize" aria-label="Page size">
            <option value="3">3</option>
            <option value="6">6</option>
            <option value="9">9</option>
            <option value="12">12</option>
            <option value="24">24</option>
            <option value="48">48</option>
            <option value="all">All</option>
          </select>

          <label class="label mt-3">
            <span class="label-text">Sort by</span>
          </label>
          <select
            class="select select-sm w-full mb-2"
            data-setting="sortBy"
            aria-label="Sort tools"
          >
            <option value="order">Order (default)</option>
            <option value="name">Name</option>
            <option value="recent">Recently used</option>
          </select>

          <div class="divider my-2"></div>
          <label class="label pb-1">
            <span class="label-text">PWA Theme Color</span>
          </label>
          <div class="flex gap-2 items-center mb-2">
            <input
              type="color"
              class="input input-sm p-0 h-8 w-12 cursor-pointer"
              data-setting="themeColor"
              title="Set browser top bar color"
            />
            <span class="text-xs text-base-content/60">Persistent for PWA</span>
          </div>

          <div class="divider my-2"></div>
          <button id="refresh-cached-files-btn" class="btn btn-sm btn-outline w-full" type="button">
            Force refresh PWA
          </button>
          <p class="mt-1 text-xs text-base-content/60">
            Clears all cached files including the application shell. Keeps localStorage and
            IndexedDB.
          </p>
        </div>
      </div>
    </div>
  </div>

  <div id="tools-grid" class="flex flex-col gap-6">
    <!-- Tools will be placed here via JS -->
  </div>
</main>
