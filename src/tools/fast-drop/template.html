<div class="tool-content p-2 sm:p-4 space-y-4 sm:space-y-6 max-w-4xl mx-auto">
  <include src="style.css" type="style" />
  <include src="@css/shared-patterns.css" type="style" />

  <div class="card bg-base-100 shadow-sm border border-base-300 overflow-hidden">
    <div class="card-body p-4 sm:p-6">
      <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4 sm:mb-6"
      >
        <div class="flex items-center gap-3">
          <div class="p-2 bg-primary/10 rounded-xl text-primary">
            <i data-lucide="zap" class="w-6 h-6"></i>
          </div>
          <div>
            <h2 class="font-bold text-lg leading-tight">Fast Drop & Share</h2>
            <p class="text-xs opacity-50">Cross-device file & clipboard sync via backend.</p>
          </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <button id="paste-btn" class="btn btn-secondary btn-sm flex-1 sm:flex-none">
            <i data-lucide="clipboard" class="w-4 h-4 mr-2"></i> Paste
          </button>
        </div>
      </div>

      <div
        id="dropzone"
        class="border-2 border-dashed border-primary/30 rounded-2xl p-6 sm:p-12 text-center cursor-pointer hover:bg-primary/5 transition-all group"
      >
        <div
          class="mb-3 sm:mb-4 text-primary opacity-50 group-hover:opacity-100 group-hover:scale-110 transition-all"
        >
          <i data-lucide="upload-cloud" class="w-12 h-12 sm:w-16 sm:h-16 mx-auto"></i>
        </div>
        <p class="font-bold text-base sm:text-lg">Click or drag & drop files here</p>
        <input type="file" id="file-input" class="hidden" multiple />
      </div>

      <!-- Settings -->
      <div
        class="mt-4 sm:mt-6 p-3 sm:p-4 bg-base-200 rounded-xl flex flex-wrap items-center gap-3 justify-between"
        id="drop-settings"
      >
        <div class="flex items-center gap-2">
          <label class="label cursor-pointer p-0 gap-2">
            <span class="label-text font-bold text-xs">Retention:</span>
            <select class="select select-xs sm:select-sm select-bordered" data-setting="retention">
              <option value="1">1 Hour</option>
              <option value="6">6 Hours</option>
              <option value="12">12 Hours</option>
              <option value="24" selected>24 Hours</option>
              <option value="168">7 Days</option>
              <option value="indefinite">Indefinite</option>
            </select>
          </label>
        </div>
        <div class="text-[9px] sm:text-[10px] opacity-40 uppercase font-bold tracking-wider">
          Auto-removal managed by server
        </div>
      </div>
    </div>
  </div>

  <!-- Dropped Files List -->
  <div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body p-4 sm:p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold uppercase opacity-50 text-xs sm:text-sm tracking-widest">
          Dropped Files
        </h3>
        <button id="refresh-btn" class="btn btn-ghost btn-xs">
          <i data-lucide="refresh-cw" class="w-3 h-3 mr-1"></i> Refresh
        </button>
      </div>

      <div id="files-list" class="space-y-3">
        <!-- Loading state -->
        <div id="list-loading" class="flex flex-col items-center py-8 sm:py-12 space-y-4">
          <span class="loading loading-spinner loading-lg text-primary"></span>
          <p class="text-xs sm:text-sm opacity-50 italic">Fetching files from server...</p>
        </div>

        <!-- Empty state -->
        <div
          id="list-empty"
          class="hidden flex flex-col items-center py-8 sm:py-12 space-y-3 opacity-30"
        >
          <i data-lucide="inbox" class="w-10 h-10 sm:w-12 sm:h-12"></i>
          <p class="text-xs sm:text-sm italic">No files dropped yet.</p>
        </div>

        <!-- Files will be injected here -->
        <div
          id="files-container"
          class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 hidden"
        ></div>
      </div>
    </div>
  </div>

  <include src="modal.html" />
</div>
