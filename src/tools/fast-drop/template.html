<div class="tool-content p-4 space-y-6 max-w-5xl mx-auto">
  <include src="style.css" type="style" />

  <div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body p-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div>
          <h2 class="card-title text-2xl font-bold">Fast Drop & Share</h2>
          <p class="text-sm opacity-60">
            Upload files or paste from clipboard to share across devices.
          </p>
        </div>

        <div class="flex items-center gap-2">
          <button id="paste-btn" class="btn btn-secondary">
            <i data-lucide="clipboard" class="w-4 h-4 mr-2"></i> Paste from Clipboard
          </button>
        </div>
      </div>

      <div
        id="dropzone"
        class="border-2 border-dashed border-primary/30 rounded-2xl p-12 text-center cursor-pointer hover:bg-primary/5 transition-all group"
      >
        <div
          class="mb-4 text-primary opacity-50 group-hover:opacity-100 group-hover:scale-110 transition-all"
        >
          <i data-lucide="upload-cloud" class="w-16 h-16 mx-auto"></i>
        </div>
        <p class="font-bold text-lg">Click or drag & drop files here</p>
        <input type="file" id="file-input" class="hidden" multiple />
      </div>

      <!-- Settings -->
      <div
        class="mt-6 p-4 bg-base-200 rounded-xl flex flex-wrap items-center gap-4 justify-between"
        id="drop-settings"
      >
        <div class="flex items-center gap-2">
          <label class="label cursor-pointer gap-2">
            <span class="label-text font-bold">Default Retention:</span>
            <select class="select select-sm select-bordered" data-setting="retention">
              <option value="1">1 Hour</option>
              <option value="6">6 Hours</option>
              <option value="12">12 Hours</option>
              <option value="24" selected>24 Hours</option>
              <option value="168">7 Days</option>
              <option value="indefinite">Indefinite</option>
            </select>
          </label>
        </div>
        <div class="text-[10px] opacity-40 uppercase font-bold tracking-wider">
          Auto-removal managed by server
        </div>
      </div>
    </div>
  </div>

  <!-- Dropped Files List -->
  <div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body p-4 sm:p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold uppercase opacity-50 text-sm tracking-widest">Dropped Files</h3>
        <button id="refresh-btn" class="btn btn-ghost btn-xs">
          <i data-lucide="refresh-cw" class="w-3 h-3 mr-1"></i> Refresh
        </button>
      </div>

      <div id="files-list" class="space-y-3">
        <!-- Loading state -->
        <div id="list-loading" class="flex flex-col items-center py-12 space-y-4">
          <span class="loading loading-spinner loading-lg text-primary"></span>
          <p class="text-sm opacity-50 italic">Fetching files from server...</p>
        </div>

        <!-- Empty state -->
        <div id="list-empty" class="hidden flex flex-col items-center py-12 space-y-3 opacity-30">
          <i data-lucide="inbox" class="w-12 h-12"></i>
          <p class="text-sm italic">No files dropped yet.</p>
        </div>

        <!-- Files will be injected here -->
        <div id="files-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
      </div>
    </div>
  </div>

  <include src="modal.html" />
</div>
