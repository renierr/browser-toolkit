<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="scan-text" class="w-6 h-6"></i>
      OCR Text Extractor
    </h2>
    <p class="text-sm opacity-70 mb-6">
      Upload an image to extract text using Tesseract.js. <br>
      Processing happens entirely in your browser.
    </p>

    <div id="dropzone"
         class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3">
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag images here</p>
        <p class="text-sm text-base-content/50">Supports PNG, JPEG, WebP, ...</p>
        <button id="paste-btn" class="btn btn-outline flex-1 sm:flex-none">
          <i data-lucide="clipboard" class="w-4 h-4 mr-2"></i>
          or click here to Paste from clipboard
        </button>
      </div>
      <input type="file" id="image-input" class="hidden" accept="image/*" />
    </div>

    <div id="status-container" class="hidden mt-4">
      <div class="flex items-center justify-between mb-2">
        <span id="status-text" class="text-sm font-medium">Initializing...</span>
        <span id="progress-percent" class="text-xs opacity-70">0%</span>
      </div>
      <progress id="ocr-progress" class="progress progress-primary w-full" value="0" max="100"></progress>
    </div>
  </div>

  <div id="result-container" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="card bg-base-100 shadow-xl border border-base-300">
      <div class="card-body">
        <h3 class="card-title text-sm">Preview</h3>
        <div class="bg-base-200 rounded-lg overflow-hidden flex items-center justify-center min-h-50">
          <img id="preview-img" class="max-w-full max-h-100 object-contain" alt="upload preview"/>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 shadow-xl border border-base-300">
      <div class="card-body">
        <div class="flex justify-between items-center mb-2">
          <label for="output-text" class="h3 card-title text-sm">Extracted Text</label>
          <button id="copy-btn" class="btn btn-ghost btn-xs gap-1">
            <i data-lucide="copy" class="w-3 h-3"></i>
            Copy
          </button>
        </div>
        <textarea id="output-text" class="textarea textarea-bordered h-87.5 w-full font-mono text-sm leading-relaxed"
                                                   placeholder="Text will appear here..."></textarea>
      </div>
    </div>
  </div>
</div>
