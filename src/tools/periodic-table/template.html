<div class="p-4 sm:p-6 max-w-7xl mx-auto">
  <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
    <h1 class="text-3xl font-bold text-primary">Periodic Table of Elements</h1>
    <div id="element-search-container" class="w-full sm:w-64">
      <input type="text" id="element-search" placeholder="Search elements..." class="input input-bordered w-full" />
    </div>
  </div>

  <div class="overflow-x-auto pb-4 custom-scrollbar">
    <div id="periodic-table-grid" class="grid gap-1 min-w-[1000px] lg:min-w-0" style="grid-template-columns: repeat(18, minmax(0, 1fr));">
      <!-- Elements will be injected here -->
    </div>
  </div>

  <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div id="legend" class="card bg-base-100 shadow-md p-4 flex flex-wrap gap-2 content-start">
      <div class="badge badge-lg gap-2 bg-blue-200 text-blue-900 border-none">Non-metal</div>
      <div class="badge badge-lg gap-2 bg-yellow-200 text-yellow-900 border-none">Noble Gas</div>
      <div class="badge badge-lg gap-2 bg-red-200 text-red-900 border-none">Alkali Metal</div>
      <div class="badge badge-lg gap-2 bg-orange-200 text-orange-900 border-none">Alkaline Earth</div>
      <div class="badge badge-lg gap-2 bg-purple-200 text-purple-900 border-none">Metalloid</div>
      <div class="badge badge-lg gap-2 bg-green-200 text-green-900 border-none">Halogen</div>
      <div class="badge badge-lg gap-2 bg-pink-200 text-pink-900 border-none">Transition Metal</div>
      <div class="badge badge-lg gap-2 bg-slate-200 text-slate-900 border-none">Post-transition</div>
      <div class="badge badge-lg gap-2 bg-indigo-200 text-indigo-900 border-none">Lanthanide</div>
      <div class="badge badge-lg gap-2 bg-cyan-200 text-cyan-900 border-none">Actinide</div>
    </div>

    <div id="selected-element-card" class="md:col-span-2 card bg-base-100 shadow-xl overflow-hidden hidden">
      <div class="flex flex-col md:flex-row">
        <div id="element-viz" class="w-full md:w-1/2 h-64 md:h-auto flex items-center justify-center bg-base-200 p-4 relative">
          <!-- Atomic visualization will be here -->
          <canvas id="atomic-canvas" class="max-w-full max-h-full"></canvas>
        </div>
        <div class="p-6 flex-1">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h2 id="detail-name" class="text-4xl font-black mb-1"></h2>
              <p id="detail-category" class="uppercase tracking-widest text-xs font-bold opacity-70"></p>
            </div>
            <div id="detail-symbol-box" class="w-16 h-16 flex flex-col items-center justify-center border-4 rounded-lg">
                <span id="detail-number" class="text-xs font-bold self-start pl-1"></span>
                <span id="detail-symbol" class="text-2xl font-black"></span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
              <p class="text-xs opacity-60">Atomic Mass</p>
              <p id="detail-mass" class="font-bold"></p>
            </div>
            <div>
              <p class="text-xs opacity-60">Electron Config</p>
              <p id="detail-config" class="font-mono text-sm"></p>
            </div>
            <div>
              <p class="text-xs opacity-60">Electronegativity</p>
              <p id="detail-electronegativity" class="font-bold"></p>
            </div>
            <div>
              <p class="text-xs opacity-60">Density</p>
              <p id="detail-density" class="font-bold"></p>
            </div>
          </div>

          <div class="mb-4">
             <p class="text-xs opacity-60 mb-1">Electron Shells</p>
             <div id="detail-shells" class="flex gap-1 flex-wrap"></div>
          </div>

          <div class="collapse collapse-plus bg-base-200">
            <input type="checkbox" />
            <div class="collapse-title font-medium text-sm">Common Isotopes</div>
            <div class="collapse-content overflow-x-auto">
              <table class="table table-xs w-full">
                <thead>
                  <tr>
                    <th>Isotope</th>
                    <th>Mass</th>
                    <th>Abundance</th>
                  </tr>
                </thead>
                <tbody id="isotopes-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="empty-selection" class="md:col-span-2 flex flex-col items-center justify-center p-12 text-center bg-base-200 rounded-xl border-2 border-dashed border-base-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 opacity-20 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.673.337a2 2 0 00-.81 1.106l-.312 1.248a1 1 0 01-1.273.733l-3.992-1.33a1 1 0 00-.899.11l-1.933 1.288a1 1 0 00-.348 1.17l.56 1.4a1 1 0 00.916.634h11.23a1 1 0 00.916-.634l.56-1.4a1 1 0 00-.348-1.17l-1.933-1.288a1 1 0 00-.899-.11l-3.992 1.33a1 1 0 01-1.273-.733l-.312-1.248a2 2 0 00-.81-1.106l-.673-.337a6 6 0 00-3.86-.517l-2.387.477a2 2 0 00-1.022.547" />
      </svg>
      <p class="text-lg opacity-60">Select an element to see details</p>
    </div>
  </div>
</div>

<style>
.element-card {
  aspect-ratio: 1/1;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.element-card:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

.element-card.active {
  box-shadow: 0 0 0 3px hsl(var(--p));
}

.custom-scrollbar::-webkit-scrollbar {
  height: 8px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: hsl(var(--b3));
  border-radius: 4px;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: hsl(var(--bc) / 0.2);
  border-radius: 4px;
}
</style>
