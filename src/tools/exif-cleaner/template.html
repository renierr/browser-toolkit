<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">EXIF Cleaner & Viewer</h2>
    <p class="text-base-content/70 mb-6">
      View and Remove metadata (EXIF) from your images.<br>
      The download will be converted to JPG format – independent of the input format.
    </p>

    <div id="dropzone"
         class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3">
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag images here</p>
        <p class="text-sm text-base-content/50">Supports PNG, JPEG, WebP, ...</p>
      </div>
      <input type="file" id="image-input" class="hidden" multiple />
    </div>

    <div id="result-container" class="hidden mt-8">
      <div class="divider">Selected Images</div>
      <div id="file-list" class="flex flex-col gap-2 mb-6 max-h-60 overflow-y-auto">
        <!-- File list will be inserted here -->
      </div>

      <div id="single-preview" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="flex flex-col gap-4 min-h-60 ">
          <div class="flex justify-center items-start">
            <img id="preview-img" class="max-w-full h-auto rounded-lg shadow-sm" src="" alt="Selected image preview">
            <video id="preview-video" class="hidden max-w-full h-auto rounded-lg shadow-sm" autoplay loop muted playsinline></video>
          </div>
          <button id="motion-image-button" class="hidden btn btn-sm btn-secondary w-full">
            Play Motion Photo Video
          </button>
          <div id="gps-container" class="hidden">
            <a id="gps-link" href="#" target="_blank" class="btn btn-sm btn-secondary w-full">
              <i data-lucide="map-pin" class="w-4 h-4 mr-2"></i>
              View on Google Maps
            </a>
          </div>
        </div>
        <div class="relative exif-table-wrapper">
          <div class="overflow-auto max-h-60 md:max-h-none md:absolute md:inset-0">
            <table class="table table-zebra table-compact w-full">
              <thead class="hidden md:table-header-group">
                <tr>
                  <th>Tag</th>
                  <th class="md:min-w-52">Value</th>
                </tr>
              </thead>
              <tbody id="exif-data" class="divide-y">
                <!-- EXIF data will be inserted here -->
              </tbody>
            </table>
          </div>
        </div>

        <div class="card-actions justify-end gap-2">
          <button id="download-selected" class="btn btn-outline btn-secondary hidden">
            <i data-lucide="download" class="w-4 h-4 mr-2"></i>
            Download Selected
          </button>
          <button id="download-clean" class="btn btn-primary">
            <i data-lucide="shield-check" class="w-4 h-4 mr-2"></i>
            <span id="download-text">Download Clean Images</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
