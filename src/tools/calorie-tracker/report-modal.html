<!-- PDF Report Generation Modal -->
<dialog id="report-modal" class="modal">
  <div class="modal-box border border-base-300 shadow-2xl max-w-lg w-full">
    <h3 class="font-extrabold text-xl flex items-center gap-2 mb-4">
      <i data-lucide="file-plus" class="w-6 h-6 text-primary"></i>
      <span>Generate PDF Report</span>
    </h3>

    <div class="space-y-4">
      <!-- Report Type Select -->
      <div class="form-control w-full">
        <label class="label font-bold text-xs opacity-75">Report Type</label>
        <select id="report-type-select" class="select select-bordered w-full select-sm">
          <option value="daily" selected>Daily Report (Single Day)</option>
          <option value="timeframe">Custom Timeframe Report</option>
        </select>
      </div>

      <!-- Single Day Date Picker -->
      <div id="report-daily-container" class="form-control w-full">
        <label class="label font-bold text-xs opacity-75">Select Date</label>
        <input id="report-single-date" type="date" class="input input-bordered input-sm w-full" />
      </div>

      <!-- Custom Timeframe Date Pickers -->
      <div id="report-timeframe-container" class="grid grid-cols-2 gap-4 hidden">
        <div class="form-control">
          <label class="label font-bold text-xs opacity-75">From Date</label>
          <input id="report-start-date" type="date" class="input input-bordered input-sm w-full" />
        </div>
        <div class="form-control">
          <label class="label font-bold text-xs opacity-75">To Date</label>
          <input id="report-end-date" type="date" class="input input-bordered input-sm w-full" />
        </div>
      </div>

      <!-- Report Custom Title -->
      <div class="form-control w-full">
        <label class="label font-bold text-xs opacity-75">Custom Report Title</label>
        <input
          id="report-title-input"
          type="text"
          class="input input-bordered input-sm w-full"
          placeholder="Nutritional Progress Report"
        />
      </div>

      <!-- Personal Summary/Comments -->
      <div class="form-control w-full">
        <label class="label font-bold text-xs opacity-75"
          >Personal Summary / Additional Notes</label
        >
        <textarea
          id="report-notes-input"
          class="textarea textarea-bordered textarea-sm w-full h-20"
          placeholder="Add any personal summary, goals, or comments for this report period..."
        ></textarea>
      </div>

      <!-- Include Images Checkbox -->
      <div class="form-control">
        <label class="label cursor-pointer justify-start gap-2.5">
          <input
            id="report-include-images-checkbox"
            type="checkbox"
            class="checkbox checkbox-primary checkbox-sm"
            checked
          />
          <span class="label-text font-semibold text-sm">Include Meal Photos in PDF</span>
        </label>
      </div>
    </div>

    <div class="modal-action flex justify-end gap-2 mt-6">
      <button id="report-modal-close" class="btn btn-ghost btn-sm">Cancel</button>
      <button id="report-modal-generate" class="btn btn-primary btn-sm flex items-center gap-1.5">
        <span id="report-generate-spinner" class="loading loading-spinner loading-xs hidden"></span>
        <i data-lucide="file-check" id="report-generate-icon" class="w-4 h-4"></i>
        <span id="report-generate-text">Generate PDF</span>
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
