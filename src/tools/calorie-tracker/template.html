<include src="style.css" type="style" />

<div class="container mx-auto p-4 max-w-6xl space-y-6">
  <!-- Top Action Bar -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-base-300 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight flex items-center gap-2">
        <i data-lucide="flame" class="w-8 h-8 text-orange-500 animate-pulse"></i>
        <span>Calorie Tracker</span>
      </h1>
      <p class="text-sm opacity-60 mt-1">AI-powered nutritional intelligence for your healthy lifestyle</p>
    </div>
    <div class="flex items-center gap-2 self-stretch md:self-auto justify-end">
      <button id="sync-btn" class="btn btn-ghost btn-sm border border-base-300 flex items-center gap-2">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        <span>Sync</span>
      </button>
      <button id="settings-toggle-btn" class="btn btn-ghost btn-sm border border-base-300 flex items-center gap-2">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span>Settings</span>
      </button>
    </div>
  </div>

  <!-- Settings Panel (Collapsible) -->
  <include src="settings.html" />

  <!-- Primary Dashboard Section -->
  <include src="dashboard.html" />

  <!-- Capture & Add Meal Row -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Camera upload and Capture Card -->
    <include src="capture.html" />

    <!-- AI Nutritional Estimate & Edit Panel -->
    <include src="estimate.html" />
  </div>

  <!-- Historic Logs Card -->
  <include src="history.html" />
</div>
