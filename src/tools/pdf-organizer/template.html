<div class="flex flex-col gap-6">
  <div id="pdf-dropzone"
       class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg h-32 cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3">
    <div class="flex flex-col items-center gap-2">
      <div class="text-base-content/30 text-4xl">
        <i data-lucide="upload"></i>
      </div>
      <p class="text-lg font-medium">Click or drop PDF here</p>
      <p class="text-sm text-base-content/60">Select a PDF to start organizing pages</p>
    </div>
    <input type="file" id="pdf-file" class="hidden" accept="application/pdf" />
  </div>

  <div id="organizer-actions"
       class="hidden flex flex-wrap items-center justify-between gap-4 bg-base-200 p-4 rounded-lg sticky top-0 z-20 shadow-sm">
    <div class="flex items-center gap-2 flex-wrap">
      <button id="select-all-btn" class="btn btn-sm btn-ghost">Select All</button>
      <button id="deselect-all-btn" class="btn btn-sm btn-ghost">Deselect All</button>
      <div class="divider divider-horizontal mx-0"></div>
      <button id="remove-selected-btn" class="btn btn-sm btn-error btn-outline" disabled title="Remove selected pages">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
      <button id="duplicate-selected-btn" class="btn btn-sm btn-outline" disabled title="Duplicate selected pages">
        <i data-lucide="copy" class="w-4 h-4"></i>
      </button>
      <button id="undo-btn" class="btn btn-sm btn-outline" disabled title="Undo last action">
        <i data-lucide="undo" class="w-4 h-4"></i>
      </button>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <span id="selection-count" class="text-sm font-medium opacity-70">0 pages selected</span>
      <button id="start-over-btn" class="btn btn-sm btn-ghost text-error">
        <i data-lucide="refresh-ccw" class="w-4 h-4 mr-1"></i> Start Over
      </button>
      <button id="open-viewer-btn" class="btn btn-sm btn-outline btn-secondary">
        <i data-lucide="eye" class="w-4 h-4 mr-1"></i> Open in Viewer
      </button>
      <button id="download-selected-btn" class="btn btn-sm btn-outline btn-primary" disabled>
        <i data-lucide="file-down" class="w-4 h-4 mr-1"></i> Download Selected
      </button>
      <button id="download-btn" class="btn btn-sm btn-primary">
        <i data-lucide="download" class="w-4 h-4 mr-1"></i> Download All
      </button>
    </div>
  </div>

  <div id="page-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
    <!-- Pages will be rendered here -->
  </div>
</div>
