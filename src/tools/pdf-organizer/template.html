<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">PDF Organizer</h2>
    <p class="text-base-content/70 mb-6">
      Merge, Reorder, delete, or duplicate pages in your PDF document.
    </p>

    <div
      id="pdf-dropzone"
      class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3"
    >
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag PDF here</p>
      </div>
      <input type="file" id="pdf-file" class="hidden" accept="application/pdf" multiple />
    </div>

    <div id="organizer-actions" class="hidden flex flex-col gap-4 mt-8">
      <h3 id="loaded-filename" class="text-lg font-semibold text-center"></h3>
      <div
        class="flex flex-wrap items-center justify-between gap-2 bg-base-200 p-3 rounded-lg sticky top-0 z-20 shadow-sm"
      >
        <div class="flex items-center gap-1 flex-wrap">
          <button id="add-file-btn" class="btn btn-xs sm:btn-sm btn-ghost">
            <i data-lucide="plus" class="w-4 h-4"></i> Add
          </button>
          <input type="file" id="add-pdf-file" class="hidden" accept="application/pdf" multiple />
          <div class="divider divider-horizontal mx-0"></div>
          <button id="select-all-btn" class="btn btn-xs sm:btn-sm btn-ghost">All</button>
          <button id="deselect-all-btn" class="btn btn-xs sm:btn-sm btn-ghost">None</button>
          <div class="divider divider-horizontal mx-0"></div>
          <button
            id="remove-selected-btn"
            class="btn btn-xs sm:btn-sm btn-error btn-outline"
            disabled
          >
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
          <button id="duplicate-selected-btn" class="btn btn-xs sm:btn-sm btn-outline" disabled>
            <i data-lucide="copy" class="w-4 h-4"></i>
          </button>
          <button id="undo-btn" class="btn btn-xs sm:btn-sm btn-outline" disabled>
            <i data-lucide="undo" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <span id="selection-count" class="text-xs font-medium opacity-70">0 selected</span>
          <button id="start-over-btn" class="btn btn-xs sm:btn-sm btn-ghost text-error">
            <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div
        id="page-list"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"
      >
        <!-- Pages will be rendered here -->
      </div>

      <div class="card-actions justify-end mt-6 gap-2">
        <button id="open-viewer-btn" class="btn btn-outline btn-secondary flex-1 sm:flex-none">
          <i data-lucide="share" class="w-4 h-4 mr-2"></i> Share
        </button>
        <button
          id="download-selected-btn"
          class="btn btn-outline btn-primary flex-1 sm:flex-none"
          disabled
        >
          <i data-lucide="file-down" class="w-4 h-4 mr-2"></i> Selected
        </button>
        <button id="download-btn" class="btn btn-primary flex-1 sm:flex-none">
          <i data-lucide="download" class="w-4 h-4 mr-2"></i> Download All
        </button>
      </div>
    </div>
  </div>
</div>
