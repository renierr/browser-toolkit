<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">Timer</h2>
    <p class="text-base-content/70 mb-6">Countdown timer with presets and browser notifications.</p>

    <div class="flex flex-col items-center gap-8">
      <div class="text-center">
        <div class="text-7xl font-mono tabular-nums font-bold" id="timer-display">00:00</div>
        <div class="mt-2 text-base-content/60" id="timer-status">Ready</div>
      </div>

      <div class="grid grid-cols-4 gap-2 w-full">
        <button class="btn btn-outline btn-sm preset-btn" data-seconds="60">1m</button>
        <button class="btn btn-outline btn-sm preset-btn" data-seconds="300">5m</button>
        <button class="btn btn-outline btn-sm preset-btn" data-seconds="600">10m</button>
        <button class="btn btn-outline btn-sm preset-btn" data-seconds="1500">25m</button>
      </div>

      <div class="flex flex-col gap-4 w-full">
        <div class="form-control">
          <label class="label">
            <span class="label-text font-semibold">Custom Minutes</span>
          </label>
          <div class="join">
            <input
              type="number"
              id="custom-minutes"
              placeholder="5"
              class="input input-bordered join-item w-full"
              min="1"
              max="1440"
            />
            <button id="set-custom" class="btn btn-secondary join-item">Set</button>
          </div>
        </div>

        <div class="card-actions justify-center gap-2">
          <button id="start-stop-btn" class="btn btn-primary flex-1">
            <i data-lucide="play" class="w-4 h-4 mr-2"></i>
            Start
          </button>
          <button id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
      </div>

      <div id="notification-status" class="text-xs text-base-content/50">
        Notifications: <span id="notif-permission">Checking...</span>
      </div>
    </div>
  </div>
</div>
