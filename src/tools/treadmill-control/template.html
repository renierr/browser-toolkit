<div class="flex flex-col gap-6 max-w-full mx-auto p-4">
  <!-- Status & Connection Card -->
  <div class="card bg-base-100 shadow-xl border border-base-300">
    <div class="card-body">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 class="card-title text-2xl flex items-center gap-2">
            <i data-lucide="activity" class="text-primary"></i>
            Treadmill Control
          </h2>
          <p class="text-base-content/70">Monitor and control your treadmill via Bluetooth FTMS.</p>
        </div>
        <div class="flex gap-2">
          <button id="connect-btn" class="btn btn-primary flex items-center gap-2">
            <i data-lucide="bluetooth"></i>
            Connect
          </button>
          <button id="disconnect-btn" class="btn btn-ghost btn-outline hidden">Disconnect</button>
        </div>
      </div>

      <div id="status-message" class="alert alert-info mt-4 hidden">
        <i data-lucide="info"></i>
        <span></span>
      </div>
    </div>
  </div>

  <!-- Dashboard Card -->
  <div id="dashboard" class="grid grid-cols-1 md:grid-cols-3 gap-6 opacity-50 pointer-events-none">
    <!-- Main Metric: Speed -->
    <div class="card bg-base-100 shadow-xl border border-base-300 md:col-span-2">
      <div class="card-body items-center text-center">
        <h3 class="text-xl font-semibold opacity-70 uppercase tracking-widest">Speed</h3>
        <div class="flex items-baseline gap-2">
          <span id="speed-display" class="text-8xl font-black text-primary tabular-nums">0.0</span>
          <span class="text-2xl font-bold opacity-50">km/h</span>
        </div>
        
        <div class="divider">Controls</div>
        
        <div class="flex flex-wrap justify-center gap-4">
          <button id="speed-down-btn" class="btn btn-circle btn-outline btn-lg" aria-label="Decrease Speed">
             <i data-lucide="minus"></i>
          </button>
          <div class="flex flex-col gap-2">
            <button id="start-btn" class="btn btn-success btn-wide gap-2">
              <i data-lucide="play" class="fill-current"></i> Start
            </button>
            <button id="stop-btn" class="btn btn-error btn-wide gap-2">
              <i data-lucide="square" class="fill-current"></i> Stop
            </button>
          </div>
          <button id="speed-up-btn" class="btn btn-circle btn-outline btn-lg" aria-label="Increase Speed">
            <i data-lucide="plus"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Secondary Metrics -->
    <div class="grid grid-cols-2 md:grid-cols-1 gap-4">
      <!-- Distance -->
      <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-4 items-center gap-1">
          <span class="text-xs font-bold opacity-50 uppercase">Distance</span>
          <span id="distance-display" class="text-3xl font-bold tabular-nums">0.00</span>
          <span class="text-xs font-semibold opacity-40">km</span>
        </div>
      </div>

      <!-- Time -->
      <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-4 items-center gap-1">
          <span class="text-xs font-bold opacity-50 uppercase">Time</span>
          <span id="time-display" class="text-3xl font-bold tabular-nums">00:00</span>
          <span class="text-xs font-semibold opacity-40">elapsed</span>
        </div>
      </div>

      <!-- Calories -->
      <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-4 items-center gap-1">
          <span class="text-xs font-bold opacity-50 uppercase">Calories</span>
          <span id="calories-display" class="text-3xl font-bold tabular-nums">0</span>
          <span class="text-xs font-semibold opacity-40">kcal</span>
        </div>
      </div>

            <!-- Incline -->
      <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-4 items-center gap-1">
          <span class="text-xs font-bold opacity-50 uppercase">Incline</span>
          <div class="flex items-center gap-4">
            <button id="incline-down-btn" class="btn btn-xs btn-circle btn-ghost border border-base-300" aria-label="Decrease Incline">
               <i data-lucide="chevron-down" class="size-3"></i>
            </button>
            <span id="incline-display" class="text-3xl font-bold tabular-nums">0.0</span>
            <button id="incline-up-btn" class="btn btn-xs btn-circle btn-ghost border border-base-300" aria-label="Increase Incline">
               <i data-lucide="chevron-up" class="size-3"></i>
            </button>
          </div>
          <span class="text-xs font-semibold opacity-40">%</span>
        </div>
      </div>

    </div>
  </div>
</div>
