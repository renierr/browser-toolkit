<dialog id="session-modal" class="modal">
  <div class="modal-box max-w-4xl">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    </form>
    <div class="flex items-center justify-between gap-4 mb-4">
      <div id="modal-title" class="font-bold text-lg text-primary">Session Details</div>
      <div id="session-select-container" class="hidden">
        <select
          id="session-select"
          aria-label="Sessions"
          class="select select-sm select-bordered w-full max-w-xs"
        >
          <!-- Sessions will be added here -->
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-base-200 p-3 rounded-lg">
        <div class="text-xs uppercase text-base-content/60">Duration</div>
        <div id="modal-duration" class="font-bold font-mono">--:--</div>
      </div>
      <div class="bg-base-200 p-3 rounded-lg">
        <div class="text-xs uppercase text-base-content/60">Data Points</div>
        <div id="modal-datapoints" class="font-bold">--</div>
      </div>
      <div class="bg-base-200 p-3 rounded-lg">
        <div class="text-xs uppercase text-base-content/60">Avg Speed</div>
        <div id="modal-avg-speed" class="font-bold">-- km/h</div>
      </div>
      <div class="bg-base-200 p-3 rounded-lg">
        <div class="text-xs uppercase text-base-content/60">Max Speed</div>
        <div id="modal-max-speed" class="font-bold">-- km/h</div>
      </div>
    </div>

    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <h4 class="font-semibold flex items-center gap-2">
          <i data-lucide="line-chart" class="w-4 h-4"></i>
          Speed Graph
        </h4>
        <div class="form-control">
          <label class="label cursor-pointer gap-2">
            <span class="label-text text-xs uppercase font-semibold text-base-content/60"
              >Show Data Table</span
            >
            <input type="checkbox" id="toggle-data" class="toggle toggle-primary toggle-sm" />
          </label>
        </div>
      </div>
      <div class="bg-base-200 rounded-lg p-2">
        <canvas id="session-graph" class="w-full h-48 sm:h-64"></canvas>
      </div>
    </div>

    <div id="modal-data-container" class="hidden mb-4">
      <h4 class="font-semibold mb-2 flex items-center gap-2">
        <i data-lucide="table" class="w-4 h-4"></i>
        Recorded Data Points
      </h4>
      <div class="bg-base-200 rounded-lg overflow-hidden border border-base-300">
        <div class="max-h-64 overflow-y-auto">
          <table class="table table-xs table-zebra w-full">
            <thead>
              <tr class="sticky top-0 bg-base-300 z-10">
                <th>#</th>
                <th>Time</th>
                <th>Speed</th>
                <th>Incline</th>
              </tr>
            </thead>
            <tbody id="modal-data-body">
              <!-- Data points will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn">Close</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
