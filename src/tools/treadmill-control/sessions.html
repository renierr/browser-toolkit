<div class="card bg-base-100 shadow-xl border border-base-300 max-w-6xl">
  <div class="card-body p-4 sm:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
      <h3 class="card-title text-xl">Recorded Sessions</h3>
      <div class="flex items-center gap-2">
        <input type="file" id="import-input" class="hidden" accept=".json" />
        <button id="view-json-btn" class="btn btn-outline btn-sm gap-2">
          <i data-lucide="upload"></i>
          View JSON
        </button>
        <button id="export-all-btn" class="btn btn-primary btn-sm gap-2">
          <i data-lucide="download"></i>
          Export All
        </button>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="table table-zebra w-full">
        <thead>
          <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Duration</th>
            <th>Avg Speed</th>
            <th>Max Speed</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="sessions-list">
          <!-- Sessions will be loaded here -->
          <tr id="no-sessions">
            <td colspan="6" class="text-center text-base-content/50 py-8">
              No sessions recorded yet.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
