<include src="@css/shared-patterns.css" type="style" />
<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">AI Background Remover</h2>
    <p class="text-base-content/70 mb-6">
      Remove backgrounds from multiple images locally using AI. All processing happens in your
      browser for maximum privacy.
    </p>

    <include src="options.html" />

    <!-- Dropzone -->
    <div
      id="dropzone"
      class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3 min-h-40 group hover:bg-base-300"
    >
      <div
        class="flex flex-col items-center gap-2 text-center transition-transform group-hover:scale-105"
      >
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag images here</p>
        <p class="text-sm text-base-content/50">Supports JPG, PNG, WebP, etc.</p>
        <button id="paste-btn" class="btn btn-outline flex-1 sm:flex-none">
          <i data-lucide="clipboard" class="w-4 h-4 mr-2"></i>
          or click here to Paste from clipboard
        </button>
      </div>
      <input type="file" id="image-input" class="hidden" accept="image/*" multiple />
    </div>

    <!-- Bulk Actions -->
    <div id="bulk-actions" class="hidden mt-8">
      <div class="divider">Selected Images & Processing</div>
      <div
        class="flex flex-wrap justify-between items-center bg-base-200/50 p-4 rounded-xl mb-6 gap-3"
      >
        <div class="flex items-center gap-3 text-sm font-medium">
          <span id="queue-status">0 images</span>
          <span id="queue-progress-badge" class="badge badge-sm badge-ghost hidden"></span>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="btn-clear" class="btn btn-ghost btn-xs sm:btn-sm gap-2">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            Clear All
          </button>
          <button id="btn-download-all" class="btn btn-primary btn-xs sm:btn-sm gap-2">
            <i data-lucide="download" class="w-4 h-4"></i>
            Download All (.zip)
          </button>
        </div>
      </div>

      <!-- Results Gallery -->
      <div id="results-gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Items will be injected here -->
      </div>
    </div>
  </div>
</div>

<include src="item-template.html" /> <include src="preview-modal.html" />
