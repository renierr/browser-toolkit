<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">Audio Recorder</h2>
    <p class="text-base-content/70 mb-6">
      Record voice/audio, visualize waveform, and save as WebM.
    </p>

    <!-- Visualizer Canvas -->
    <div
      class="w-full h-32 bg-base-200 rounded-xl overflow-hidden relative mb-6 border border-base-300"
    >
      <canvas id="visualizer-canvas" class="w-full h-full"></canvas>
      <div id="recording-indicator" class="absolute top-3 right-3 flex items-center gap-2 hidden">
        <span class="w-3 h-3 bg-error rounded-full animate-pulse"></span>
        <span class="text-xs font-bold text-error" id="recording-timer">00:00</span>
      </div>
    </div>

    <!-- Settings -->
    <details class="collapse collapse-arrow bg-base-200 border border-base-300 rounded-xl mb-6">
      <summary class="collapse-title text-sm font-semibold flex items-center gap-2 py-3 min-h-0">
        <i data-lucide="sliders" class="w-4 h-4"></i>
        Audio Settings
      </summary>
      <div class="collapse-content space-y-3">
        <div class="form-control">
          <label
            class="label cursor-pointer justify-between py-1 px-0 flex-wrap sm:flex-nowrap gap-2 sm:gap-4"
          >
            <span class="label-text flex flex-col pr-4">
              <span class="font-medium">Input Device</span>
              <span class="text-xs text-base-content/60">Choose microphone for recording</span>
            </span>
            <select
              id="settings-audio-device"
              data-setting="deviceId"
              class="select select-bordered select-sm w-full sm:w-48 max-w-full shrink-0"
            >
              <option value="">Default Microphone</option>
            </select>
          </label>
        </div>
        <div class="form-control">
          <label
            class="label cursor-pointer justify-between py-1 px-0 flex-wrap sm:flex-nowrap gap-2 sm:gap-4"
          >
            <span class="label-text flex flex-col pr-4">
              <span class="font-medium">Auto Gain Control</span>
              <span class="text-xs text-base-content/60"
                >Prevents clipping, can cause first-second overgain</span
              >
            </span>
            <input
              type="checkbox"
              id="settings-auto-gain"
              data-setting="autoGainControl"
              class="toggle toggle-primary shrink-0"
              checked
            />
          </label>
        </div>
        <div class="form-control">
          <label
            class="label cursor-pointer justify-between py-1 px-0 flex-wrap sm:flex-nowrap gap-2 sm:gap-4"
          >
            <span class="label-text flex flex-col pr-4">
              <span class="font-medium">Noise Suppression</span>
              <span class="text-xs text-base-content/60"
                >Filters out background hum and white noise</span
              >
            </span>
            <input
              type="checkbox"
              id="settings-noise-suppression"
              data-setting="noiseSuppression"
              class="toggle toggle-primary shrink-0"
              checked
            />
          </label>
        </div>
        <div class="form-control">
          <label
            class="label cursor-pointer justify-between py-1 px-0 flex-wrap sm:flex-nowrap gap-2 sm:gap-4"
          >
            <span class="label-text flex flex-col pr-4">
              <span class="font-medium">Echo Cancellation</span>
              <span class="text-xs text-base-content/60">Prevents feedback/echo from speakers</span>
            </span>
            <input
              type="checkbox"
              id="settings-echo-cancellation"
              data-setting="echoCancellation"
              class="toggle toggle-primary shrink-0"
              checked
            />
          </label>
        </div>
        <div class="form-control">
          <label
            class="label cursor-pointer justify-between py-1 px-0 flex-wrap sm:flex-nowrap gap-2 sm:gap-4"
          >
            <span class="label-text flex flex-col pr-4">
              <span class="font-medium">Recording Quality</span>
              <span class="text-xs text-base-content/60"
                >Higher bitrates improve audio fidelity</span
              >
            </span>
            <select
              id="settings-audio-quality"
              data-setting="audioQuality"
              class="select select-bordered select-sm w-full sm:w-48 max-w-full shrink-0"
            >
              <option value="96000">Standard (96 kbps)</option>
              <option value="128000">High (128 kbps)</option>
              <option value="256000" selected>High Fidelity (256 kbps)</option>
              <option value="320000">Ultra (320 kbps)</option>
            </select>
          </label>
        </div>
      </div>
    </details>

    <!-- Controls -->
    <div class="card-actions justify-center gap-2">
      <button id="btn-record" class="btn btn-error flex-1">
        <i data-lucide="mic" class="w-4 h-4 mr-2"></i>
        Start Recording
      </button>
      <button id="btn-stop-record" class="btn btn-outline flex-1 hidden">
        <i data-lucide="square" class="w-4 h-4 mr-2"></i>
        Stop
      </button>
    </div>

    <!-- Recordings List -->
    <div id="recordings-list" class="flex flex-col gap-2 mt-4 max-h-60 overflow-y-auto">
      <!-- Recordings will appear here -->
      <div class="text-center text-base-content/50 text-sm py-4" id="no-recordings-msg">
        No recordings yet.
      </div>
    </div>
  </div>
</div>
