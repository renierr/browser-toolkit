<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">Audio Recorder</h2>
    <p class="text-base-content/70 mb-6">
      Record voice/audio, visualize waveform, and save as WebM.
    </p>

    <!-- Visualizer Canvas -->
    <div
      class="w-full h-32 bg-base-200 rounded-xl overflow-hidden relative mb-6 border border-base-300"
    >
      <canvas id="visualizer-canvas" class="w-full h-full"></canvas>
      <div id="recording-indicator" class="absolute top-3 right-3 flex items-center gap-2 hidden">
        <span class="w-3 h-3 bg-error rounded-full animate-pulse"></span>
        <span class="text-xs font-bold text-error" id="recording-timer">00:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="card-actions justify-center gap-2">
      <button id="btn-record" class="btn btn-error flex-1">
        <i data-lucide="mic" class="w-4 h-4 mr-2"></i>
        Start Recording
      </button>
      <button id="btn-stop-record" class="btn btn-outline flex-1 hidden">
        <i data-lucide="square" class="w-4 h-4 mr-2"></i>
        Stop
      </button>
    </div>

    <!-- Recordings List -->
    <div id="recordings-list" class="flex flex-col gap-2 mt-4 max-h-60 overflow-y-auto">
      <!-- Recordings will appear here -->
      <div class="text-center text-base-content/50 text-sm py-4" id="no-recordings-msg">
        No recordings yet.
      </div>
    </div>
  </div>
</div>
