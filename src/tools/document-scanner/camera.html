<!-- Camera View Container -->
<div
  id="camera-view"
  class="hidden absolute z-50 inset-0 w-dvw h-dvh bg-black rounded-lg overflow-hidden flex items-center justify-center shadow-inner border border-base-300 transition-all duration-300"
>
  <video
    id="video"
    class="w-full h-full object-contain"
    autoplay
    playsinline
    style="will-change: transform; transform: translateZ(0)"
  ></video>
  <canvas id="camera-overlay" class="absolute inset-0 pointer-events-none"></canvas>

  <!-- Touch-to-focus indicator -->
  <div id="focus-ring" class="absolute pointer-events-none hidden z-20">
    <div
      class="w-16 h-16 rounded-full border-2 border-white/90 shadow-[0_0_10px_rgba(255,255,255,0.4)]"
      style="animation: focus-ring-anim 0.6s ease-out forwards"
    ></div>
  </div>

  <!-- Zoom level indicator -->
  <div
    id="zoom-indicator"
    class="absolute top-4 left-1/2 -translate-x-1/2 pointer-events-none hidden z-20 bg-black/60 backdrop-blur-sm text-white text-sm font-bold px-3 py-1 rounded-full transition-opacity duration-300"
  ></div>

  <!-- Guided Lines Overlay -->
  <div id="guided-lines" class="absolute inset-0 pointer-events-none opacity-40">
    <div class="absolute top-1/4 left-0 w-full border-t-2 border-dashed border-white/40"></div>
    <div class="absolute top-1/2 left-0 w-full border-t-2 border-dashed border-white/40"></div>
    <div class="absolute top-3/4 left-0 w-full border-t-2 border-dashed border-white/40"></div>
    <div class="absolute left-1/4 top-0 h-full border-l-2 border-dashed border-white/40"></div>
    <div class="absolute left-1/2 top-0 h-full border-l-2 border-dashed border-white/40"></div>
    <div class="absolute left-3/4 top-0 h-full border-l-2 border-dashed border-white/40"></div>
  </div>

  <!-- Level Indicator -->
  <div
    id="level-indicator"
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-opacity duration-300 opacity-0 z-10"
  >
    <div
      class="relative w-24 h-24 border-2 border-white/40 rounded-full flex items-center justify-center"
    >
      <div class="absolute inset-0 border-2 border-white/20 rounded-full scale-50"></div>
      <div class="absolute w-full h-0.5 bg-white/30"></div>
      <div class="absolute h-full w-0.5 bg-white/30"></div>
      <div
        id="level-dot"
        class="w-6 h-6 bg-success rounded-full transition-transform duration-75 shadow-lg border-2 border-white/60"
      ></div>
    </div>
  </div>

  <div
    id="camera-error"
    class="absolute inset-0 flex flex-col items-center justify-center bg-base-300 text-center p-4 hidden"
  >
    <i data-lucide="camera-off" class="w-12 h-12 mb-2 opacity-50"></i>
    <p class="font-bold">Camera access denied or unavailable</p>
    <p class="text-sm opacity-70">Please check permissions or use the upload option below.</p>
  </div>
</div>
