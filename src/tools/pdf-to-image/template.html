<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">Flatten PDF to Images</h2>
    <p class="text-base-content/70 mb-6">
      Convert each page of a PDF into an image and bundle them into a new flattened PDF.
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="form-control">
        <label class="label" for="opt-dpi"><span class="label-text font-semibold">DPI</span></label>
        <input
          type="number"
          id="opt-dpi"
          value="180"
          min="10"
          max="600"
          class="input input-bordered w-full"
        />
      </div>
      <div class="form-control">
        <label class="label" for="opt-format"
          ><span class="label-text font-semibold">Format</span></label
        >
        <select id="opt-format" class="select select-bordered w-full">
          <option value="pixmap" selected>Internal</option>
          <option value="jpeg">JPEG</option>
          <option value="png">PNG</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="opt-quality"
          ><span class="label-text font-semibold">Quality (JPEG)</span></label
        >
        <input
          type="number"
          id="opt-quality"
          value="95"
          min="1"
          max="100"
          class="input input-bordered w-full"
        />
      </div>
    </div>

    <div
      id="pdf-dropzone"
      class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3"
    >
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag PDF here</p>
      </div>
      <input type="file" id="pdf-file" class="hidden" accept="application/pdf" />
    </div>
  </div>
</div>
