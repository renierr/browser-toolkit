<style>

    .overtype-toolbar {
      position: sticky !important;
      top: 0;
    }
    .overtype-content .syntax-marker {
      opacity: 0.4;
      font-weight: normal;
    }
    .overtype-content .url-part {
      opacity: 0.4;
    }
    .overtype-content h1, .overtype-content h2, .overtype-content h3 {
      font-weight: bold;
      margin-top: 0.5em;
      margin-bottom: 0.2em;
    }
    .overtype-content h1 { font-size: 1.5em; }
    .overtype-content h2 { font-size: 1.25em; }
    .overtype-content h3 { font-size: 1.1em; }

    .overtype-content ul, .overtype-content ol {
      margin-left: 0;
      padding-left: 0;
      list-style: none;
    }
    .overtype-content .blockquote {
      display: block;
      border-left: 4px solid var(--color-base-300, #ccc);
      padding-left: 1em;
      margin: 0.5em 0;
      opacity: 0.8;
    }
    .overtype-content code {
      background-color: var(--color-base-200);
      padding: 0.1em 0.2em;
      border-radius: 0.2em;
      font-size: 0.9em;
    }
    .overtype-content .code-block {
      background-color: var(--color-base-200);
      padding: 1em;
      border-radius: 0.5em;
      margin: 1em 0;
      overflow-x: auto;
    }
    .overtype-content .code-fence {
      opacity: 0.3;
      font-size: 0.8em;
    }
    .overtype-content a {
      color: var(--color-primary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Expand/Collapse styles */
    .note-content-wrapper {
      position: relative;
    }
    .note-content-collapsed {
      max-height: 4.5rem; /* Approx 3 lines of text-base (1.5rem line-height) */
      overflow: hidden;
      mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    }
    .note-content-expanded {
      max-height: none;
      mask-image: none;
      -webkit-mask-image: none;
    }
  </style>

<div class="card bg-base-100 shadow-xl">
  <div class="card-body p-1 md:p-4">
    <h2 class="card-title text-2xl font-bold mb-4">Notes</h2>
    <p class="text-base-content/70 mb-6">Simple note taking - stored locally in your browser.</p>

    <div class="flex flex-col gap-4 pb-2 mb-4">
      <div class="form-control w-full">
        <div id="note-input" class="textarea textarea-bordered p-0 h-96 max-h-[50dvh] text-lg w-full"></div>
      </div>
      <div class="flex justify-end gap-2">
        <button id="cancel-edit-btn" class="btn btn-secondary hidden">Cancel</button>
        <button id="add-note-btn" class="btn btn-primary">Add Note</button>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 items-center justify-between mb-6">
      <div class="flex flex-wrap flex-1 gap-4 items-center">
        <div class="relative w-full md:w-72">
          <input id="search-input" type="text" placeholder="Search notes..." class="input input-bordered w-full pl-10" />
          <span class="absolute left-3 top-1/2 -translate-y-1/2 opacity-50">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
        </div>
        <div class="flex gap-2">
          <button id="import-btn" class="btn btn-outline btn-sm" title="Import JSON">
            <i data-lucide="file-up" class="w-4 h-4"></i>
            Import
          </button>
          <button id="export-all-btn" class="btn btn-outline btn-sm" title="Export all as JSON">
            <i data-lucide="file-output" class="w-4 h-4"></i>
            Export All
          </button>
          <input type="file" id="import-input" class="hidden" accept=".json" />
        </div>
      </div>
      <div class="text-sm opacity-70">
        Sorted by date (newest first)
      </div>
    </div>

    <div id="notes-container" class="grid gap-4">
      <!-- Notes will be rendered here -->
    </div>
  </div>
</div>
