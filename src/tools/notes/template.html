<include src="style.css" type="style" />

<div class="card bg-base-100 shadow-xl">
  <div class="card-body p-1 md:p-4">
    <h2 class="card-title text-2xl font-bold mb-4">Notes</h2>
    <p class="text-base-content/70 mb-6">Simple note taking - stored locally in your browser.</p>

    <div class="flex flex-col gap-4 pb-2 mb-4">
      <div class="form-control w-full">
        <div
          id="note-input"
          class="textarea textarea-bordered p-0 h-96 max-h-[50dvh] text-lg w-full"
        ></div>
      </div>
      <div class="flex justify-end gap-2 flex-wrap">
        <button id="import-md-btn" class="btn btn-outline btn-xs" title="Import from Markdown file">
          <i data-lucide="file-up" class="w-4 h-4"></i>
          Import MD
        </button>
        <button
          id="export-input-btn"
          class="btn btn-outline btn-xs"
          title="Export input as PDF"
          disabled
        >
          <i data-lucide="file-down" class="w-4 h-4"></i>
          Export PDF
        </button>
        <button id="cancel-edit-btn" class="btn btn-secondary btn-xs hidden">Cancel</button>
        <button id="add-note-btn" class="btn btn-primary btn-xs">Add Note</button>
        <input type="file" id="import-md-input" class="hidden" accept=".md,.markdown" />
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 items-center justify-between mb-6">
      <div class="flex flex-wrap flex-1 gap-4 items-center">
        <div class="relative w-full md:w-72">
          <input
            id="search-input"
            type="text"
            placeholder="Search notes..."
            class="input input-bordered w-full pl-10"
          />
          <span class="absolute left-3 top-1/2 -translate-y-1/2 opacity-50">
            <i data-lucide="search" class="w-4 h-4"></i>
          </span>
        </div>
        <div class="flex gap-2">
          <button id="import-btn" class="btn btn-outline btn-xs" title="Import JSON">
            <i data-lucide="file-up" class="w-4 h-4"></i>
            Import
          </button>
          <button id="export-all-btn" class="btn btn-outline btn-xs" title="Export all as JSON">
            <i data-lucide="file-output" class="w-4 h-4"></i>
            Export All
          </button>
          <button id="sync-btn" class="btn btn-outline btn-xs" title="Sync with server">
            <i data-lucide="refresh-cw" class="w-4 h-4 sync-icon"></i>
            Sync
          </button>
          <input type="file" id="import-input" class="hidden" accept=".json" />
        </div>
      </div>
      <div class="text-sm opacity-70">Sorted by date (newest first)</div>
    </div>

    <div id="notes-container" class="grid gap-4">
      <!-- Notes will be rendered here -->
    </div>
  </div>
</div>
