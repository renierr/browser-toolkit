<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="type" class="w-6 h-6 mr-2"></i>
      ASCII Art Generator
    </h2>
    <p class="text-base-content/70 mb-6">Convert text to ASCII art in multiple styles.</p>

    <div class="form-control w-full mb-4">
      <label class="label" for="input-text">
        <span class="label-text font-semibold">Your Text</span>
      </label>
      <input
        id="input-text"
        class="input input-bordered w-full"
        placeholder="Enter text to convert..."
        maxlength="50"
      />
    </div>

    <div class="form-control w-full mb-4">
      <label class="label" for="style-select">
        <span class="label-text font-semibold">Style</span>
      </label>
      <select id="style-select" class="select select-bordered w-full" data-setting="fontStyle">
        <optgroup label="Classic">
          <option value="block">Block</option>
          <option value="shadow">Shadow</option>
          <option value="small">Small</option>
          <option value="digital">Digital</option>
          <option value="slant">Slant</option>
        </optgroup>
        <optgroup label="3D & Depth">
          <option value="block-3d">3D Block</option>
          <option value="deep-3d">Deep 3D</option>
          <option value="bevel">Bevel</option>
        </optgroup>
        <optgroup label="Fancy">
          <option value="banner">Banner</option>
          <option value="bubble">Bubble</option>
          <option value="star">Star</option>
          <option value="neon">Neon Dots</option>
          <option value="box">Box</option>
        </optgroup>
      </select>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text font-semibold">ASCII Art Output</span>
      </label>
      <div
        id="output-container"
        class="w-full min-h-32 p-4 bg-base-200 rounded-lg border border-base-300 font-mono text-xs sm:text-sm whitespace-pre overflow-x-auto"
      >
        <span class="text-base-content/50 italic">Result will appear here...</span>
      </div>
    </div>

    <div class="card-actions justify-center mt-2 gap-2">
      <button id="btn-copy" class="btn btn-outline flex-1 sm:flex-none" disabled>
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="btn-download" class="btn btn-outline flex-1 sm:flex-none" disabled>
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download
      </button>
      <button id="btn-clear" class="btn btn-ghost flex-1 sm:flex-none">Clear</button>
    </div>

    <div id="status" class="mt-4 text-sm text-base-content/60 text-center"></div>
  </div>
</div>
