<div id="ascii-art-container" class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="type" class="w-6 h-6 mr-2"></i>
      ASCII Art Generator
    </h2>
    <p class="text-base-content/70 mb-6">Convert text to ASCII art in multiple styles.</p>

    <div class="form-control w-full mb-4">
      <label class="label" for="input-text">
        <span class="label-text font-semibold">Your Text</span>
      </label>
      <input
        id="input-text"
        class="input input-bordered w-full"
        placeholder="Enter text to convert..."
        maxlength="50"
        data-setting="inputText"
      />
    </div>

    <div class="form-control w-full mb-4">
      <label class="label" for="style-select">
        <span class="label-text font-semibold">Style</span>
      </label>
      <select id="style-select" class="select select-bordered w-full" data-setting="fontStyle">
        <option value="Standard">Loading fonts...</option>
      </select>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
      <div class="form-control w-full">
        <label class="label" for="horizontal-layout">
          <span class="label-text font-semibold">Horizontal Layout</span>
        </label>
        <select id="horizontal-layout" class="select select-bordered select-sm w-full" data-setting="horizontalLayout">
          <option value="default" selected>Default</option>
          <option value="full">Full</option>
          <option value="fitted">Fitted</option>
          <option value="controlled horizontal smushing">Controlled Smushing</option>
          <option value="universal horizontal smushing">Universal Smushing</option>
        </select>
      </div>

      <div class="form-control w-full">
        <label class="label" for="vertical-layout">
          <span class="label-text font-semibold">Vertical Layout</span>
        </label>
        <select id="vertical-layout" class="select select-bordered select-sm w-full" data-setting="verticalLayout">
          <option value="default" selected>Default</option>
          <option value="full">Full</option>
          <option value="fitted">Fitted</option>
          <option value="controlled vertical smushing">Controlled Smushing</option>
          <option value="universal vertical smushing">Universal Smushing</option>
        </select>
      </div>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text font-semibold">ASCII Art Output</span>
      </label>
      <pre
        id="output-container"
        class="w-full p-4 bg-base-200 rounded-lg border border-base-300 font-mono text-[10px] leading-none whitespace-pre overflow-x-auto"
      ><span class="text-base-content/50 italic text-sm">Result will appear here...</span></pre>
    </div>

    <div class="card-actions justify-center mt-2 gap-2">
      <button id="btn-copy" class="btn btn-outline flex-1 sm:flex-none" disabled>
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="btn-download" class="btn btn-outline flex-1 sm:flex-none" disabled>
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download
      </button>
      <button id="btn-preview-all" class="btn btn-primary flex-1 sm:flex-none">
        <i data-lucide="eye" class="w-4 h-4 mr-2"></i>
        Preview All
      </button>
      <button id="btn-clear" class="btn btn-ghost flex-1 sm:flex-none">Clear</button>
    </div>

    <div id="status" class="mt-4 text-sm text-base-content/60 text-center"></div>

    <div id="previews-container" class="mt-8 space-y-6 hidden">
      <div class="divider">All Font Previews</div>
      <div id="previews-list" class="space-y-6"></div>
    </div>
  </div>
</div>
