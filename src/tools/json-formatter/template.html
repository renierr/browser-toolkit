<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">JSON Formatter</h2>
    <p class="text-base-content/70 mb-6">Format, minify, and validate your JSON data.</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Input</span>
        </label>
        <textarea id="json-input" class="textarea textarea-bordered h-64 font-mono text-sm w-full"
                  placeholder='Paste your JSON here...' spellcheck="false"></textarea>
      </div>

      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Output</span>
        </label>
        <textarea id="json-output" class="textarea textarea-bordered h-64 font-mono text-sm bg-base-200 w-full" readonly
                  placeholder="Formatted output will appear here..." spellcheck="false"></textarea>
      </div>
    </div>

    <div class="card-actions justify-center mt-6 gap-2">
      <button id="btn-format" class="btn btn-primary flex-1 sm:flex-none">
        <i data-lucide="align-left" class="w-4 h-4 mr-2"></i>
        Format
      </button>
      <button id="btn-minify" class="btn btn-secondary flex-1 sm:flex-none">
        <i data-lucide="minimize" class="w-4 h-4 mr-2"></i>
        Minify
      </button>
      <button id="btn-copy" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="btn-clear" class="btn btn-secondary flex-1 sm:flex-none">Clear</button>
    </div>
  </div>
</div>
