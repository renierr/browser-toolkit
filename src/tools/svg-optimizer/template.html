<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">SVG Optimizer</h2>
    <p class="text-base-content/70 mb-6">
      Optimize and minify SVG files to reduce file size. Upload a file or paste SVG code.
    </p>

    <!-- Upload Section -->
    <div
      id="dropzone"
      class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3 min-h-40 group hover:bg-base-300"
    >
      <div
        class="flex flex-col items-center gap-2 text-center transition-transform group-hover:scale-105"
      >
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag SVG file(s) here</p>
        <p class="text-sm text-base-content/50">Supports .svg files</p>
      </div>
      <input type="file" id="file-input" class="hidden" accept=".svg,image/svg+xml" multiple />
    </div>

    {{ include "batch-results.html" }}

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Input Section -->
      <div class="form-control w-full">
        <label class="label" for="svg-input">
          <span class="label-text font-semibold">Input SVG</span>
          <span class="label-text-alt" id="input-stats">0 bytes</span>
        </label>
        <textarea
          id="svg-input"
          class="textarea textarea-bordered h-64 font-mono text-sm w-full"
          placeholder="Paste your SVG code here..."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Output Section -->
      <div class="form-control w-full">
        <label class="label" for="svg-output">
          <span class="label-text font-semibold">Optimized SVG</span>
          <span class="label-text-alt" id="output-stats">0 bytes</span>
        </label>
        <textarea
          id="svg-output"
          class="textarea textarea-bordered h-64 font-mono text-sm bg-base-200 w-full"
          readonly
          placeholder="Optimized output will appear here..."
          spellcheck="false"
        ></textarea>
      </div>
    </div>

    {{ include "options.html" }}

    <!-- Preview Section -->
    <div id="preview-section" class="hidden mt-6">
      <div class="divider">Preview</div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="flex flex-col items-center">
          <span class="text-sm font-semibold mb-2">Original</span>
          <div
            id="preview-original"
            class="border rounded-lg p-4 bg-base-200 w-full min-h-32 flex items-center justify-center overflow-hidden"
          ></div>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-sm font-semibold mb-2">Optimized</span>
          <div
            id="preview-optimized"
            class="border rounded-lg p-4 bg-base-200 w-full min-h-32 flex items-center justify-center overflow-hidden"
          ></div>
        </div>
      </div>
    </div>

    <!-- Savings Info -->
    <div id="savings-info" class="hidden mt-4">
      <div class="alert alert-success">
        <i data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="savings-text">Saved 0 bytes (0%)</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="card-actions justify-center mt-6 gap-2">
      <button id="btn-optimize" class="btn btn-primary flex-1 sm:flex-none">
        <i data-lucide="zap" class="w-4 h-4 mr-2"></i>
        Optimize
      </button>
      <button id="btn-copy" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="btn-download" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download
      </button>
      <button id="btn-clear" class="btn btn-ghost flex-1 sm:flex-none">Clear</button>
    </div>
  </div>
</div>
