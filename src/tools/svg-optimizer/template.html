<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">SVG Optimizer</h2>
    <p class="text-base-content/70 mb-6">Optimize and minify SVG files to reduce file size. Upload a file or paste SVG code.</p>

    <!-- Upload Section -->
    <div id="dropzone"
         class="flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 transition-colors p-4 mb-6">
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag SVG file here</p>
        <p class="text-sm text-base-content/50">Supports .svg files</p>
      </div>
      <input type="file" id="file-input" class="hidden" accept=".svg,image/svg+xml" />
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Input Section -->
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Input SVG</span>
          <span class="label-text-alt" id="input-stats">0 bytes</span>
        </label>
        <textarea id="svg-input" class="textarea textarea-bordered h-64 font-mono text-sm w-full"
                  placeholder="Paste your SVG code here..." spellcheck="false"></textarea>
      </div>

      <!-- Output Section -->
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Optimized SVG</span>
          <span class="label-text-alt" id="output-stats">0 bytes</span>
        </label>
        <textarea id="svg-output" class="textarea textarea-bordered h-64 font-mono text-sm bg-base-200 w-full" readonly
                  placeholder="Optimized output will appear here..." spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Options -->
    <div class="mt-4">
      <div class="collapse collapse-arrow bg-base-200 border">
        <input type="checkbox" id="options-toggle" checked />
        <div class="collapse-title font-semibold">Optimization Options</div>
        <div class="collapse-content">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-1">
            <!-- General Options -->
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="keep-xmlns" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Keep XML namespace</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-multipass" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Multipass optimization</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-pretty" class="checkbox checkbox-sm" data-option />
                <span class="label-text">Pretty output (formatted)</span>
              </label>
            </div>

            <!-- Cleanup Options -->
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeComments" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove comments</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeMetadata" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove metadata</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeTitle" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove title</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeDesc" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove description</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeEditorsNSData" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove editor data</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeEmptyAttrs" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove empty attributes</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeEmptyContainers" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove empty containers</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeEmptyText" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove empty text</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeHiddenElems" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove hidden elements</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeUselessDefs" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove unused defs</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeUselessStrokeAndFill" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove useless stroke/fill</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeDoctype" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove doctype</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeXMLProcInst" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Remove XML declaration</span>
              </label>
            </div>

            <!-- Optimization Options -->
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-cleanupIds" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Cleanup IDs</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-cleanupNumericValues" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Cleanup numeric values</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-convertColors" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Convert colors</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-convertPathData" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Optimize path data</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-convertShapeToPath" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Convert shapes to paths</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-convertTransform" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Optimize transforms</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-mergePaths" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Merge paths</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-minifyStyles" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Minify styles</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-inlineStyles" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Inline styles</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-collapseGroups" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Collapse groups</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-sortAttrs" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Sort attributes</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-sortDefsChildren" class="checkbox checkbox-sm" checked data-option />
                <span class="label-text">Sort defs children</span>
              </label>
            </div>

            <!-- Dimension Options -->
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeDimensions" class="checkbox checkbox-sm" data-option />
                <span class="label-text">Remove width/height</span>
              </label>
            </div>
            <div class="form-control">
              <label class="label cursor-pointer justify-start gap-3 py-1">
                <input type="checkbox" id="opt-removeViewBox" class="checkbox checkbox-sm" data-option />
                <span class="label-text">Remove viewBox</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Preview Section -->
    <div id="preview-section" class="hidden mt-6">
      <div class="divider">Preview</div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="flex flex-col items-center">
          <span class="text-sm font-semibold mb-2">Original</span>
          <div id="preview-original" class="border rounded-lg p-4 bg-base-200 w-full min-h-32 flex items-center justify-center overflow-hidden"></div>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-sm font-semibold mb-2">Optimized</span>
          <div id="preview-optimized" class="border rounded-lg p-4 bg-base-200 w-full min-h-32 flex items-center justify-center overflow-hidden"></div>
        </div>
      </div>
    </div>

    <!-- Savings Info -->
    <div id="savings-info" class="hidden mt-4">
      <div class="alert alert-success">
        <i data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="savings-text">Saved 0 bytes (0%)</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="card-actions justify-center mt-6 gap-2">
      <button id="btn-optimize" class="btn btn-primary flex-1 sm:flex-none">
        <i data-lucide="zap" class="w-4 h-4 mr-2"></i>
        Optimize
      </button>
      <button id="btn-copy" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="btn-download" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download
      </button>
      <button id="btn-clear" class="btn btn-ghost flex-1 sm:flex-none">Clear</button>
    </div>
  </div>
</div>
