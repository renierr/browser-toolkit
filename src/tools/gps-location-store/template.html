<div class="flex flex-col lg:flex-row gap-4 mb-6">
  <!-- Current Location Card -->
  <div class="card bg-base-100 border border-primary flex-1 shadow-lg shadow-primary/20">
    <div class="card-body p-4">
      <h3 class="card-title text-base flex items-center gap-2">
        <i data-lucide="crosshair" class="w-4 h-4"></i>
        Current Location
      </h3>
      <div id="current-location-display" class="text-sm space-y-1">
        <div class="opacity-50">Click "Get Location" to start</div>
      </div>
      <div class="mt-3">
        <button id="get-location-btn" class="btn btn-primary btn-sm">
          <i data-lucide="map-pin" class="w-4 h-4"></i>
          Get Location
        </button>
      </div>
    </div>
  </div>

  <!-- Last Saved Card -->
  <div class="card bg-base-100 border border-secondary flex-1 shadow-lg shadow-secondary/20">
    <div class="card-body p-4">
      <h3 class="card-title text-base flex items-center gap-2">
        <i data-lucide="star" class="w-4 h-4 text-secondary"></i>
        Last Saved
      </h3>
      <div id="last-saved-display" class="text-sm space-y-1">
        <div class="opacity-50">No saved locations</div>
      </div>
      <div id="last-saved-actions" class="mt-3 hidden">
        <button id="view-last-map-btn" class="btn btn-secondary btn-sm">
          <i data-lucide="map" class="w-4 h-4"></i>
          View on Map
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Save Location Form -->
<div class="card bg-base-100 border border-base-300 mb-6">
  <div class="card-body p-4">
    <h3 class="card-title text-base">Save Current Location</h3>
    <div class="form-control">
      <label class="label">
        <span class="label-text">Description (optional)</span>
      </label>
      <input
        id="location-description"
        type="text"
        placeholder="e.g., Home, Office, Favorite cafe..."
        class="input input-bordered w-full"
      />
    </div>
    <div class="mt-3">
      <button id="save-location-btn" class="btn btn-success" disabled>
        <i data-lucide="save" class="w-4 h-4"></i>
        Save Location
      </button>
    </div>
  </div>
</div>

<!-- History Section -->
<div class="flex justify-between items-center mb-3">
  <h3 class="text-lg font-semibold">History</h3>
  <button id="clear-all-btn" class="btn btn-error btn-outline btn-sm">
    <i data-lucide="trash-2" class="w-4 h-4"></i>
    Clear All
  </button>
</div>

<div id="history-container" class="space-y-2">
  <div class="text-center p-4 opacity-50 italic">No locations saved yet</div>
</div>

<!-- Map Modal -->
<dialog id="map-modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box p-0 max-h-[90dvh]">
    <div class="p-4 flex justify-between items-center border-b border-base-300">
      <h3 class="font-bold text-lg">Location Map</h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </form>
    </div>
    <div class="p-0">
      <iframe
        id="map-frame"
        class="w-full h-[60vh]"
        style="border: none"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
