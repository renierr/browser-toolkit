<dialog id="gallery-modal" class="modal">
  <div class="modal-box max-w-4xl">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    </form>
    <h3 class="font-bold text-lg mb-2">Saved drawings</h3>
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <p class="text-sm opacity-70">Manual versions from local IndexedDB store.</p>
      <div class="flex gap-2 flex-wrap items-center">
        <button
          id="export-gallery"
          type="button"
          class="btn btn-xs btn-outline"
          title="Export all drawings to JSON"
        >
          <i data-lucide="download" class="w-3 h-3 mr-1"></i>Export JSON
        </button>
        <button
          id="import-gallery"
          type="button"
          class="btn btn-xs btn-outline"
          title="Import drawings from JSON"
        >
          <i data-lucide="upload" class="w-3 h-3 mr-1"></i>Import JSON
        </button>
        <button
          id="sync-gallery"
          type="button"
          class="btn btn-xs btn-outline hidden"
          title="Sync with backend"
        >
          <i data-lucide="refresh-cw" class="w-3 h-3 mr-1"></i>Sync
        </button>
        <input type="file" id="import-gallery-file" class="hidden" accept=".json" />
      </div>
    </div>

    <div id="gallery-list" class="flex flex-col gap-4"></div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>

<template id="gallery-item-template">
  <article class="rounded-box border border-base-300 p-2 bg-base-100">
    <div class="checkerboard-bg rounded">
      <img class="gallery-thumb w-full h-28 object-contain rounded" alt="Preview" />
    </div>
    <div class="mt-2">
      <div class="gallery-name text-sm font-medium truncate"></div>
      <div class="gallery-meta text-xs opacity-70"></div>
    </div>
    <div class="mt-2 flex gap-1 justify-end">
      <button class="btn btn-xs btn-error delete-drawing" type="button">Delete</button>
      <button class="btn btn-xs btn-outline load-drawing" type="button">Load</button>
    </div>
  </article>
</template>
