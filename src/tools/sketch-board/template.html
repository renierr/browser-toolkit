<div
  class="fixed inset-0 w-dvw h-dvh max-w-dvw max-h-dvh overflow-hidden overscroll-none checkerboard-bg"
>
  <canvas id="sketch-canvas" class="absolute inset-0 w-full h-full"></canvas>

  <div class="sticky top-0 z-30 p-2 sm:p-3 pointer-events-none">
    <div
      class="pointer-events-auto inline-flex flex-wrap items-center gap-2 rounded-box border border-base-300 bg-base-100/90 px-2 py-2 shadow-lg backdrop-blur"
    >
      <button id="back-overview" class="btn btn-sm btn-outline" title="Back to overview">
        <i data-lucide="arrow-left" class="w-4 h-4"></i
        ><span id="overview-label" class="ml-1">Overview</span>
      </button>

      <div class="join toolbar-inner">
        <button id="mode-pan" class="btn btn-sm join-item" title="Scroll / Pan">
          <i data-lucide="hand" class="w-4 h-4"></i>
        </button>
        <button id="mode-draw" class="btn btn-sm join-item btn-primary" title="Draw">
          <i data-lucide="pen" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="draw-tools" class="dropdown dropdown-bottom dropdown-end toolbar-inner hidden">
        <label id="draw-tools-btn" tabindex="0" class="btn btn-sm gap-1">
          <span id="draw-tools-icon" class="w-4 h-4"></span>
          <span id="draw-tools-label" class="text-xs">Freehand</span>
          <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </label>
        <ul
          tabindex="0"
          class="dropdown-content menu z-50 mt-1 w-48 rounded-box border border-base-300 bg-base-100 p-2 shadow-xl"
        >
          <li>
            <button id="mode-freehand" class="btn btn-sm btn-ghost justify-between">
              Freehand
              <i data-lucide="pen-tool" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-line" class="btn btn-sm btn-ghost justify-between">
              Line
              <i data-lucide="slash" class="w-4 h-4"></i>
            </button>
          </li>
          <li class="menu-title px-2 py-1">
            <span class="text-xs opacity-70">Rectangle</span>
          </li>
          <li>
            <button id="mode-rect" class="btn btn-sm btn-ghost justify-between">
              Outline
              <i data-lucide="square" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-rect-filled" class="btn btn-sm btn-ghost justify-between">
              Filled
              <i data-lucide="square" class="w-4 h-4 fill-current"></i>
            </button>
          </li>
          <li class="menu-title px-2 py-1">
            <span class="text-xs opacity-70">Ellipse</span>
          </li>
          <li>
            <button id="mode-ellipse" class="btn btn-sm btn-ghost justify-between">
              Outline
              <i data-lucide="circle" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-ellipse-filled" class="btn btn-sm btn-ghost justify-between">
              Filled
              <i data-lucide="circle" class="w-4 h-4 fill-current"></i>
            </button>
          </li>
        </ul>
      </div>

      <div class="join toolbar-inner">
        <button id="zoom-out" class="btn btn-sm join-item" title="Zoom out">
          <i data-lucide="zoom-out" class="w-4 h-4"></i>
        </button>
        <button id="zoom-in" class="btn btn-sm join-item" title="Zoom in">
          <i data-lucide="zoom-in" class="w-4 h-4"></i>
        </button>
        <button id="zoom-reset" class="btn btn-sm join-item" title="Reset zoom">
          <i data-lucide="maximize-2" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="draw-options" class="h-7 w-px bg-base-300 toolbar-inner"></div>

      <label class="draw-opt toolbar-inner flex items-center gap-2 text-xs">
        <span>Color</span>
        <input
          id="stroke-color"
          type="color"
          class="h-8 w-10 rounded border border-base-300"
          data-setting="strokeColor"
        />
      </label>

      <details
        id="color-popup"
        class="draw-opt toolbar-inner dropdown dropdown-bottom dropdown-end"
      >
        <summary class="btn btn-sm btn-outline" title="Quick colors">
          <i data-lucide="palette" class="w-4 h-4"></i>
        </summary>
        <div
          class="dropdown-content z-40 mt-2 min-w-44 rounded-box border border-base-300 bg-base-100 p-3 shadow-xl"
        >
          <div class="grid grid-cols-5 gap-2 place-items-center">
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#111827"
              style="background-color: #111827"
              title="Ink black"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#f8fafc"
              style="background-color: #f8fafc"
              title="Paper white"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#2563eb"
              style="background-color: #2563eb"
              title="Blue"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#16a34a"
              style="background-color: #16a34a"
              title="Green"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#dc2626"
              style="background-color: #dc2626"
              title="Red"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#f59e0b"
              style="background-color: #f59e0b"
              title="Amber"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#7c3aed"
              style="background-color: #7c3aed"
              title="Violet"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#0891b2"
              style="background-color: #0891b2"
              title="Cyan"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#ec4899"
              style="background-color: #ec4899"
              title="Pink"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#92400e"
              style="background-color: #92400e"
              title="Brown"
            ></button>
          </div>
        </div>
      </details>

      <label class="draw-opt toolbar-inner flex items-center gap-2 text-xs min-w-44">
        <span>Width</span>
        <input
          id="stroke-width"
          type="range"
          min="1"
          max="24"
          value="3"
          class="range range-xs"
          data-setting="strokeWidth"
        />
      </label>

      <div id="draw-options-divider" class="h-7 w-px bg-base-300 toolbar-inner hidden"></div>

      <button id="clear-canvas" class="btn btn-sm btn-outline toolbar-inner" title="Clear canvas">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>

      <button id="undo-action" class="btn btn-sm btn-outline toolbar-inner" title="Undo" disabled>
        <i data-lucide="corner-left-up" class="w-4 h-4"></i>
      </button>

      <button id="redo-action" class="btn btn-sm btn-outline toolbar-inner" title="Redo" disabled>
        <i data-lucide="corner-right-up" class="w-4 h-4"></i>
      </button>

      <button id="save-drawing" class="btn btn-sm toolbar-inner" title="Save drawing">
        <i data-lucide="save" class="w-4 h-4 mr-1"></i>Save
      </button>

      <button id="open-gallery" class="btn btn-sm toolbar-inner" title="Show saved drawings">
        <i data-lucide="images" class="w-4 h-4 mr-1"></i>Gallery
      </button>

      <select
        id="export-format"
        class="select select-sm w-24 toolbar-inner"
        title="Export format"
        data-setting="exportFormat"
      >
        <option value="webp">WEBP</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
      </select>

      <button
        id="export-file"
        class="btn btn-sm btn-secondary toolbar-inner"
        title="Export to file"
      >
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>

      <button id="copy-image" class="btn btn-sm toolbar-inner" title="Copy as image">
        <i data-lucide="clipboard" class="w-4 h-4"></i>
      </button>

      <button
        id="collapse-toolbar"
        class="btn btn-sm btn-outline"
        title="Collapse toolbar"
        style="transition: transform 200ms ease"
      >
        <i data-lucide="chevron-left" class="w-4 h-4" style="transition: transform 200ms ease"></i>
      </button>
    </div>
  </div>

  <dialog id="gallery-modal" class="modal">
    <div class="modal-box max-w-4xl">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
      <h3 class="font-bold text-lg mb-2">Saved drawings</h3>
      <p class="text-sm opacity-70 mb-4">Manual versions from local IndexedDB store.</p>

      <div id="gallery-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <template id="gallery-item-template">
    <article class="rounded-box border border-base-300 p-2 bg-base-100">
      <div class="checkerboard-bg rounded">
        <img class="gallery-thumb w-full h-28 object-contain rounded" alt="Preview" />
      </div>
      <div class="mt-2">
        <div class="gallery-name text-sm font-medium truncate"></div>
        <div class="gallery-meta text-xs opacity-70"></div>
      </div>
      <div class="mt-2 flex gap-1 justify-end">
        <button class="btn btn-xs load-drawing" type="button">Load</button>
        <button class="btn btn-xs btn-outline delete-drawing" type="button">Delete</button>
      </div>
    </article>
  </template>
</div>
