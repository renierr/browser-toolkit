<div
  id="sketch-app-container"
  class="fixed inset-0 w-dvw h-dvh max-w-dvw max-h-dvh overflow-hidden overscroll-none checkerboard-bg"
>
  <canvas id="sketch-canvas" tabindex="0" class="absolute inset-0 w-full h-full"></canvas>

  <div
    id="zoom-toast"
    class="pointer-events-none fixed left-1/2 top-16 z-50 -translate-x-1/2 rounded-box bg-base-300/90 px-3 py-1 font-mono text-xs text-base-content opacity-0 shadow-lg backdrop-blur transition-opacity duration-300"
  >
    100%
  </div>

  <!-- Top tools (Navigation, Actions) -->
  <div
    class="absolute top-0 left-0 right-0 z-30 p-2 sm:p-3 pointer-events-none flex justify-between items-start gap-2 max-w-full"
  >
    <!-- Top Left -->
    <div
      class="pointer-events-auto flex items-center gap-1 sm:gap-2 rounded-box border border-base-300 bg-base-100/90 px-2 py-1.5 shadow-lg backdrop-blur shrink-0 max-w-full overflow-hidden"
    >
      <!-- Back to overview -->
      <button id="back-overview" class="btn btn-sm btn-ghost" title="Back to overview">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span id="overview-label" class="ml-1 hidden sm:inline">Overview</span>
      </button>

      <div class="w-px h-5 bg-base-300 mx-0.5 sm:mx-1 shrink-0"></div>

      <!-- Undo / Redo -->
      <button id="undo-action" class="btn btn-sm btn-ghost relative px-2" title="Undo" disabled>
        <i data-lucide="undo" class="w-4 h-4"></i>
        <span
          id="undo-badge"
          class="absolute top-0 right-0 text-[10px] font-mono leading-none opacity-70 p-0.5 hidden"
          >0</span
        >
      </button>

      <button id="redo-action" class="btn btn-sm btn-ghost relative px-2" title="Redo" disabled>
        <i data-lucide="redo" class="w-4 h-4"></i>
        <span
          id="redo-badge"
          class="absolute top-0 right-0 text-[10px] font-mono leading-none opacity-70 p-0.5 hidden"
          >0</span
        >
      </button>
    </div>

    <!-- Top Right: Zoom & More actions -->
    <div
      class="pointer-events-auto flex items-center gap-1 sm:gap-2 rounded-box border border-base-300 bg-base-100/90 px-1 py-1.5 shadow-lg backdrop-blur shrink-0"
    >
      <!-- Zoom controls joined -->
      <div class="join hidden sm:flex">
        <button id="zoom-out" class="btn btn-sm btn-ghost join-item px-2" title="Zoom out">
          <i data-lucide="zoom-out" class="w-4 h-4"></i>
        </button>
        <button id="zoom-reset" class="btn btn-sm btn-ghost join-item px-2" title="Reset zoom">
          <i data-lucide="maximize-2" class="w-4 h-4"></i>
        </button>
        <button id="zoom-in" class="btn btn-sm btn-ghost join-item px-2" title="Zoom in">
          <i data-lucide="zoom-in" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="w-px h-5 bg-base-300 mx-0.5 shrink-0 hidden sm:block"></div>

      <!-- More Actions Dropdown (Popover) -->
      <button
        id="more-actions-btn"
        class="btn btn-sm btn-ghost px-2"
        title="More actions"
        popovertarget="more-actions-menu"
        style="anchor-name: --more-actions-anchor"
      >
        <i data-lucide="more-vertical" class="w-4 h-4"></i>
      </button>

      <ul
        id="more-actions-menu"
        popover="auto"
        style="position-anchor: --more-actions-anchor; position-area: bottom span-left"
        class="dropdown menu z-50 mt-1 w-52 rounded-box border border-base-300 bg-base-100 p-2 shadow-xl"
      >
        <!-- Mobile zoom (visible only on small) -->
        <li class="sm:hidden mb-2">
          <div class="flex items-center justify-between pointer-events-none p-0 px-2 py-1">
            <span class="text-xs opacity-70">Zoom</span>
            <div class="join pointer-events-auto">
              <button id="zoom-out-mobile" class="btn btn-xs btn-ghost join-item">
                <i data-lucide="zoom-out" class="w-3 h-3"></i>
              </button>
              <button id="zoom-reset-mobile" class="btn btn-xs btn-ghost join-item">
                <i data-lucide="maximize-2" class="w-3 h-3"></i>
              </button>
              <button id="zoom-in-mobile" class="btn btn-xs btn-ghost join-item">
                <i data-lucide="zoom-in" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        </li>

        <li>
          <div class="flex items-center justify-between px-2 py-1 pointer-events-none">
            <span class="text-xs opacity-70">Background</span>
            <select
              id="canvas-bg"
              class="select select-xs w-24 pointer-events-auto font-normal"
              title="Canvas background"
            >
              <option value="checkerboard-bg">Transparent</option>
              <option value="solid-black-bg">Black</option>
              <option value="warm-white-bg">White</option>
            </select>
          </div>
        </li>
        <li>
          <button id="show-info" class="btn btn-sm btn-ghost justify-start">
            <i data-lucide="info" class="w-4 h-4 mr-2"></i>Information
          </button>
        </li>
        <li>
          <button id="save-drawing" class="btn btn-sm btn-ghost justify-start">
            <i data-lucide="save" class="w-4 h-4 mr-2"></i>Save
          </button>
        </li>
        <li>
          <button id="open-gallery" class="btn btn-sm btn-ghost justify-start">
            <i data-lucide="images" class="w-4 h-4 mr-2"></i>Gallery
          </button>
        </li>

        <li class="my-1 h-px bg-base-300 pointer-events-none"></li>

        <li>
          <div class="flex items-start flex-col gap-2 px-2 py-0 pointer-events-none">
            <span class="text-xs opacity-70">Export</span>
            <div class="flex justify-between w-full gap-1 pointer-events-auto">
              <select
                id="export-format"
                class="select select-xs w-auto"
                title="Export format"
                data-setting="exportFormat"
              >
                <option value="webp">WEBP</option>
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
              </select>
              <button id="export-file" class="btn btn-xs btn-secondary px-2" title="Export file">
                <i data-lucide="download" class="w-3 h-3"></i>
              </button>
            </div>
            <label
              class="flex self-center items-center gap-2 cursor-pointer pointer-events-auto group"
            >
              <input
                id="export-high-dpi"
                type="checkbox"
                class="checkbox checkbox-xs checkbox-primary"
                checked
              />
              <span class="text-[10px] opacity-70 group-hover:opacity-100 transition-opacity"
                >High Quality (DPI)</span
              >
            </label>
          </div>
        </li>

        <li class="my-1 h-px bg-base-300 pointer-events-none"></li>

        <li>
          <button id="share-drawing" class="btn btn-sm btn-ghost justify-start">
            <i data-lucide="share-2" class="w-4 h-4 mr-2"></i>Share
          </button>
        </li>
        <li>
          <button id="copy-image" class="btn btn-sm btn-ghost justify-start">
            <i data-lucide="clipboard" class="w-4 h-4 mr-2"></i>Copy Image
          </button>
        </li>

        <li class="my-1 h-px bg-base-300 pointer-events-none"></li>

        <li>
          <button id="clear-canvas" class="btn btn-sm btn-ghost text-error justify-start">
            <i data-lucide="trash" class="w-4 h-4 mr-2"></i>Clear Canvas
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Bottom tools (Drawing modes, properties) -->
  <div
    class="absolute bottom-4 left-0 right-0 z-30 p-2 sm:p-4 pointer-events-none flex justify-center items-end pb-[env(safe-area-inset-bottom)]"
  >
    <div
      class="pointer-events-auto flex flex-col sm:flex-row items-center gap-2 rounded-box border border-base-300 bg-base-100/90 p-2 shadow-lg backdrop-blur max-w-[calc(100vw-1rem)] overflow-visible"
    >
      <div
        class="flex items-center justify-start gap-2 max-w-full overflow-x-auto hide-scrollbar pb-1 sm:pb-0"
      >
        <!-- Modes -->
        <div class="join shrink-0">
          <button id="mode-pan" class="btn btn-sm join-item" title="Scroll / Pan">
            <i data-lucide="hand" class="w-4 h-4"></i>
          </button>
          <button id="mode-select" class="btn btn-sm join-item" title="Select / Move / Resize">
            <i data-lucide="mouse-pointer-2" class="w-4 h-4"></i>
          </button>
          <button id="mode-draw" class="btn btn-sm join-item btn-primary" title="Draw">
            <i data-lucide="pen" class="w-4 h-4"></i>
          </button>
        </div>

        <button
          id="draw-tools-btn"
          class="btn btn-sm gap-1 shrink-0 hidden"
          popovertarget="draw-tools"
          style="anchor-name: --draw-tools-anchor"
        >
          <span id="draw-tools-icon" class="w-4 h-4"></span>
          <span id="draw-tools-label" class="text-xs hidden sm:inline">Freehand</span>
          <i data-lucide="chevron-up" class="w-3 h-3"></i>
        </button>

        <ul
          id="draw-tools"
          popover="auto"
          style="position-anchor: --draw-tools-anchor; position-area: top"
          class="dropdown menu z-50 mb-2 w-52 rounded-box border border-base-300 bg-base-100 p-2 shadow-xl max-h-[80dvh] overflow-y-auto"
        >
          <li>
            <button id="mode-freehand" class="btn btn-sm btn-ghost justify-between">
              Freehand
              <i data-lucide="pen-tool" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="import-image" class="btn btn-sm btn-ghost justify-between">
              Import Image
              <i data-lucide="upload" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="paste-image" class="btn btn-sm btn-ghost justify-between">
              Paste Image
              <i data-lucide="clipboard" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-text" class="btn btn-sm btn-ghost justify-between">
              Text
              <i data-lucide="type" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-line" class="btn btn-sm btn-ghost justify-between">
              Line
              <i data-lucide="slash" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-arrow" class="btn btn-sm btn-ghost justify-between">
              Arrow
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
            </button>
          </li>
          <li class="menu-title px-2 py-1">
            <span class="text-xs opacity-70">Shapes</span>
          </li>
          <li>
            <button id="mode-rect" class="btn btn-sm btn-ghost justify-between">
              Rectangle
              <i data-lucide="square" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-ellipse" class="btn btn-sm btn-ghost justify-between">
              Ellipse
              <i data-lucide="circle" class="w-4 h-4"></i>
            </button>
          </li>
          <li>
            <button id="mode-triangle" class="btn btn-sm btn-ghost justify-between">
              Triangle
              <i data-lucide="triangle" class="w-4 h-4"></i>
            </button>
          </li>
        </ul>

        <div id="draw-options" class="w-px h-6 bg-base-300 shrink-0 mx-1"></div>

        <!-- Properties -->
        <label
          class="draw-opt tool-opt-color flex items-center gap-1 text-xs shrink-0 cursor-pointer"
        >
          <input
            id="stroke-color"
            type="color"
            class="h-8 w-8 rounded border border-base-300 cursor-pointer p-0"
            data-setting="strokeColor"
          />
        </label>

        <button
          id="color-popup-btn"
          class="draw-opt tool-opt-color btn btn-sm px-2 shrink-0"
          title="Quick colors"
          popovertarget="color-popup"
          style="anchor-name: --color-popup-anchor"
        >
          <i data-lucide="palette" class="w-4 h-4"></i>
        </button>

        <div
          id="color-popup"
          popover="auto"
          style="position-anchor: --color-popup-anchor; position-area: top"
          class="dropdown z-40 mb-2 min-w-44 rounded-box border border-base-300 bg-base-100 p-3 shadow-xl"
        >
          <div class="grid grid-cols-5 gap-2 place-items-center">
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#111827"
              style="background-color: #111827"
              title="Ink black"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#f8fafc"
              style="background-color: #f8fafc"
              title="Paper white"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#2563eb"
              style="background-color: #2563eb"
              title="Blue"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#16a34a"
              style="background-color: #16a34a"
              title="Green"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#dc2626"
              style="background-color: #dc2626"
              title="Red"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#f59e0b"
              style="background-color: #f59e0b"
              title="Amber"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#7c3aed"
              style="background-color: #7c3aed"
              title="Violet"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#0891b2"
              style="background-color: #0891b2"
              title="Cyan"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#ec4899"
              style="background-color: #ec4899"
              title="Pink"
            ></button>
            <button
              class="quick-color h-8 w-8 rounded border border-base-300"
              type="button"
              data-color="#92400e"
              style="background-color: #92400e"
              title="Brown"
            ></button>
          </div>
        </div>

        <label class="draw-opt flex items-center gap-2 text-xs shrink-0 w-24 sm:w-32 mx-1">
          <input
            id="stroke-width"
            type="range"
            min="1"
            max="24"
            value="3"
            class="range range-xs"
            data-setting="strokeWidth"
          />
        </label>
      </div>
      <!-- end row 1 inside bottom bar -->

      <!-- Per-tool options area (wraps with toolbar), shown below if active -->
      <div
        id="tool-options"
        class="flex flex-wrap items-center justify-center gap-1 sm:gap-2 shrink-0 hidden w-full sm:w-auto border-t sm:border-t-0 sm:border-l border-base-300 pt-1 sm:pt-0 sm:pl-2"
      >
        <!-- Shape filled toggle (rect/ellipse/triangle) -->
        <button
          id="filled-toggle"
          class="tool-opt-shape btn btn-sm btn-outline hidden"
          title="Toggle filled / outline"
        >
          <i data-lucide="paint-bucket" class="w-4 h-4"></i>
        </button>

        <!-- Text options -->
        <button
          id="edit-text"
          class="tool-opt-text btn btn-sm btn-outline hidden"
          title="Edit text"
        >
          <i data-lucide="edit-2" class="w-4 h-4"></i>
        </button>
        <select
          id="font-family"
          class="tool-opt-text select select-sm w-28 hidden font-normal"
          title="Font family"
        >
          <option value="sans-serif">Sans-serif</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
        </select>
        <input
          id="font-size"
          type="number"
          min="8"
          max="72"
          value="24"
          class="tool-opt-text input input-sm w-16 hidden"
          title="Font size"
        />
        <button id="font-bold" class="tool-opt-text btn btn-sm btn-outline hidden" title="Bold">
          <i data-lucide="bold" class="w-4 h-4"></i>
        </button>
        <button id="font-italic" class="tool-opt-text btn btn-sm btn-outline hidden" title="Italic">
          <i data-lucide="italic" class="w-4 h-4"></i>
        </button>

        <!-- Z-order buttons (select mode) -->
        <button
          id="element-to-front"
          class="btn btn-sm btn-outline hidden"
          title="Move element to front"
        >
          <i data-lucide="arrow-up" class="w-4 h-4"></i>
        </button>
        <button
          id="element-to-below"
          class="btn btn-sm btn-outline hidden"
          title="Move element to back"
        >
          <i data-lucide="arrow-down" class="w-4 h-4"></i>
        </button>

        <div class="divider divider-horizontal mx-0 hidden sm:flex"></div>

        <!-- Grouping buttons -->
        <button id="group-elements" class="btn btn-sm btn-outline hidden" title="Group elements">
          <i data-lucide="layers" class="w-4 h-4"></i>
        </button>
        <button id="ungroup-elements" class="btn btn-sm btn-outline hidden" title="Ungroup elements">
          <i data-lucide="layout-template" class="w-4 h-4"></i>
        </button>

        <!-- Image options -->
        <button
          id="resize-image-original"
          class="tool-opt-image btn btn-sm btn-outline hidden"
          title="Resize to original size"
        >
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>

        <!-- Delete selected element (any type in select mode) -->
        <button
          id="delete-element"
          class="btn btn-sm btn-outline btn-error hidden ml-auto sm:ml-0"
          title="Delete selected element"
        >
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <dialog id="gallery-modal" class="modal">
    <div class="modal-box max-w-4xl">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
      <h3 class="font-bold text-lg mb-2">Saved drawings</h3>
      <p class="text-sm opacity-70 mb-4">Manual versions from local IndexedDB store.</p>

      <div id="gallery-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <dialog id="info-modal" class="modal">
    <div class="modal-box max-w-sm">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
      <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
        <i data-lucide="info" class="w-5 h-5"></i> Drawing Information
      </h3>

      <div class="space-y-3 text-sm">
        <div class="flex justify-between border-b border-base-200 pb-2">
          <span class="opacity-70">Dimensions:</span>
          <span id="info-dimensions" class="font-mono">0 &times; 0 px</span>
        </div>
        <div class="flex justify-between border-b border-base-200 pb-2">
          <span class="opacity-70">Location:</span>
          <span id="info-location" class="font-mono text-xs">X0, Y0</span>
        </div>
        <div class="flex justify-between border-b border-base-200 pb-2">
          <span class="opacity-70">Total Elements:</span>
          <span id="info-elements" class="font-mono">0</span>
        </div>
        <div class="flex justify-between border-b border-base-200 pb-2">
          <span class="opacity-70">Background:</span>
          <span id="info-background" class="font-mono"></span>
        </div>
        <div>
          <span class="opacity-70 block mb-2">Colors Used:</span>
          <div id="info-colors" class="flex flex-wrap gap-1"></div>
        </div>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <template id="gallery-item-template">
    <article class="rounded-box border border-base-300 p-2 bg-base-100">
      <div class="checkerboard-bg rounded">
        <img class="gallery-thumb w-full h-28 object-contain rounded" alt="Preview" />
      </div>
      <div class="mt-2">
        <div class="gallery-name text-sm font-medium truncate"></div>
        <div class="gallery-meta text-xs opacity-70"></div>
      </div>
      <div class="mt-2 flex gap-1 justify-end">
        <button class="btn btn-xs btn-error delete-drawing" type="button">Delete</button>
        <button class="btn btn-xs btn-outline load-drawing" type="button">Load</button>
      </div>
    </article>
  </template>
</div>

<style>
  #sketch-canvas[data-cursor='pan'] {
    cursor:
      url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M18 11V6a2 2 0 00-2-2 2 2 0 00-2 2M14 10V4a2 2 0 00-2-2 2 2 0 00-2 2v6M10 10.5V6a2 2 0 00-2-2 2 2 0 00-2 2v8%22/><path d=%22M18 8a2 2 0 114 0v6a8 8 0 01-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 012.83-2.82L7 15%22/></svg>')
        12 12,
      grab;
  }
  #sketch-canvas[data-cursor='grabbing'] {
    cursor:
      url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M18 8a2 2 0 114 0v6a8 8 0 01-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 012.83-2.82L7 15%22/><path d=%22M10 12v2M14 12v2M18 11v2%22/></svg>')
        12 12,
      grabbing;
  }
  #sketch-canvas[data-cursor='crosshair'] {
    cursor:
      url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.5%22><path d=%22M5 12h14M12 5v14%22/></svg>')
        12 12,
      crosshair;
  }
  #sketch-canvas[data-cursor='pointer'] {
    cursor:
      url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%221.5%22><path d=%22M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z%22/></svg>')
        2 2,
      pointer;
  }
