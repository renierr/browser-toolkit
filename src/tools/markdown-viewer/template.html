<div id="tool-card" class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">Markdown Viewer</h2>
    <p class="text-base-content/70 mb-6">Render and view Markdown files with GFM support.</p>

    <div
      id="dropzone"
      class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3 min-h-40 group hover:bg-base-300"
    >
      <div
        class="flex flex-col items-center gap-2 text-center transition-transform group-hover:scale-105"
      >
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag Markdown file here</p>
        <p class="text-sm text-base-content/50">Supports .md and .markdown files</p>
      </div>
      <input
        type="file"
        id="file-input"
        class="hidden"
        accept=".md,.markdown,text/markdown,text/x-markdown"
      />
    </div>
  </div>
</div>

<div id="viewer" class="hidden flex-col flex-1 h-full overflow-hidden mt-4">
  <div
    id="toolbar"
    class="flex items-center justify-between gap-2 px-3 py-1.5 bg-base-100 border border-base-300 rounded-lg shrink-0"
  >
    <div class="flex items-center gap-2 min-w-0">
      <i data-lucide="file-text" class="w-4 h-4 shrink-0 text-base-content/50"></i>
      <span id="file-name" class="text-sm truncate max-w-48"></span>
    </div>
    <div class="flex items-center gap-1">
      <select
        id="content-theme"
        class="select select-xs"
        data-setting="content-theme"
        aria-label="Content theme"
        title="Content theme"
      >
        <option value="default">Default</option>
        <option value="contrast">Contrast</option>
        <option value="paper">Paper</option>
      </select>
      <button
        id="toggle-view"
        class="btn btn-xs btn-ghost gap-1"
        aria-label="Toggle between rendered and source view"
      >
        <i data-lucide="code" id="icon-code" class="w-3 h-3"></i>
        <i data-lucide="eye" id="icon-eye" class="w-3 h-3 hidden"></i>
        <span id="toggle-label" class="hidden sm:inline">Source</span>
      </button>
      <button id="export-pdf-btn" class="btn btn-xs btn-ghost gap-1" aria-label="Export as PDF">
        <i data-lucide="file-down" class="w-3 h-3"></i>
        <span class="hidden sm:inline">PDF</span>
      </button>
      <button id="new-file-btn" class="btn btn-xs btn-ghost gap-1" aria-label="Load new file">
        <i data-lucide="file-plus" class="w-3 h-3"></i>
        <span class="hidden sm:inline">New</span>
      </button>
    </div>
  </div>

  <div id="content-area" class="flex-1 overflow-y-auto mt-4">
    <div id="rendered-content" class="md-content p-4 sm:p-6 max-w-5xl mx-auto"></div>
    <div
      id="source-view"
      class="hidden p-4 sm:p-6 max-w-5xl mx-auto overtype-content text-base-content"
    ></div>
  </div>
</div>

<include src="@css/markdown-content.css" type="style" />
<include src="style.css" type="style" />
