<div
  class="flex flex-col h-full w-full max-w-lg landscape:max-w-3xl mx-auto bg-base-100 shadow-2xl rounded-3xl overflow-hidden border border-base-300 min-h-0"
>
  <!-- Calculator Display Area -->
  <div
    class="flex-none p-6 bg-base-200/50 flex flex-col justify-end items-end gap-1 min-h-40 select-all min-w-0 overflow-hidden relative group"
  >
    <div
      id="calc-last-op"
      class="text-sm text-base-content/60 font-mono h-6 transition-all duration-200 truncate w-full text-right"
    ></div>
    <div
      id="calc-display"
      class="text-5xl font-semibold text-base-content font-mono overflow-x-auto whitespace-nowrap w-full text-right py-2 scrollbar-hide focus:outline-none max-w-full"
      contenteditable="true"
      inputmode="decimal"
    >
      0
    </div>
    <!-- Scroll indicators -->
    <div
      id="calc-scroll-left"
      class="absolute left-0 bottom-0 top-12 w-8 bg-linear-to-r from-base-200 to-transparent pointer-events-none opacity-0 transition-opacity duration-200 flex items-center justify-start pl-1 cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-base-content/50"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </div>
    <div
      id="calc-scroll-right"
      class="absolute right-0 bottom-0 top-12 w-8 bg-linear-to-l from-base-200 to-transparent pointer-events-none opacity-0 transition-opacity duration-200 flex items-center justify-end pr-1 cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-base-content/50"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </div>
  </div>

  <!-- Mode Toggle and Tools Bar -->
  <div class="flex justify-between items-center px-6 py-2 bg-base-200/30 border-y border-base-300">
    <div class="flex gap-2">
      <button id="calc-toggle-sci" class="btn btn-ghost btn-sm gap-2 landscape:hidden">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-flask-conical"
        >
          <path d="M10 2v7.5" />
          <path d="M14 2v7.5" />
          <path
            d="M4.853 21h14.294a2 2 0 0 0 1.922-2.53l-3.32-11.41a2 2 0 0 0-1.922-1.44H8.172a2 2 0 0 0-1.922 1.44l-3.32 11.41A2 2 0 0 0 4.853 21Z"
          />
          <path d="M6 16h12" />
          <path d="M7 11.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5" />
        </svg>
        <span class="hidden sm:inline">Scientific</span>
      </button>
      <button popovertarget="calc-history-panel" class="btn btn-ghost btn-sm gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-history"
        >
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M12 7v5l4 2" />
        </svg>
        <span class="hidden sm:inline">History</span>
      </button>
    </div>
    <div class="flex gap-1">
      <button id="calc-copy" class="btn btn-ghost btn-circle btn-xs" title="Copy result">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-copy"
        >
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
      </button>
    </div>
    <div class="flex gap-1">
      <button class="btn btn-ghost btn-sm" id="calc-backspace" title="Backspace">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-delete"
        >
          <path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z" />
          <line x1="18" y1="9" x2="12" y2="15" />
          <line x1="12" y1="9" x2="18" y2="15" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Buttons Area -->
  <div class="flex flex-col landscape:flex-row grow overflow-hidden">
    {{ include "keyboard.html" }}
  </div>
</div>

{{ include "history.html" }}

<style>
  {{ include "style.css" }}
</style>
