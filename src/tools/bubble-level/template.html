<div id="bubble-level-tool" class="mx-auto w-full max-w-2xl">
  <div
    class="bubble-shell rounded-3xl border border-base-300/60 bg-base-100/90 p-4 shadow-2xl sm:p-6"
  >
    <div class="mb-4 flex items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-black tracking-tight sm:text-2xl">Bubble Level</h2>
        <p class="text-sm text-base-content/70">
          High-precision spirit level for flat and edge alignment.
        </p>
      </div>
      <div id="level-lock" class="badge badge-outline">Unstable</div>
    </div>

    <div
      id="status-banner"
      class="mb-4 rounded-xl border border-base-300 bg-base-200/70 px-3 py-2 text-sm text-base-content/80"
    >
      Initializing sensors...
    </div>

    <div class="mb-4 grid grid-cols-2 gap-2 sm:flex sm:flex-wrap">
      <button
        id="request-permission"
        class="btn btn-primary btn-sm col-span-2 sm:col-span-1 hidden"
      >
        Enable Motion Sensors
      </button>
      <button id="mode-2d" class="btn btn-sm btn-active">2-Axis</button>
      <button id="mode-1d" class="btn btn-sm">Beam</button>
      <button id="toggle-ruler" class="btn btn-sm btn-outline">Ruler</button>
      <button id="calibrate-ruler" class="btn btn-sm btn-outline hidden">Calibrate Ruler</button>
      <button id="rotation-lock-btn" class="btn btn-sm btn-outline">Lock Rotation</button>
      <button id="wake-lock-btn" class="btn btn-sm btn-outline">Acquire Wake Lock</button>
      <button id="calibrate-zero" class="btn btn-sm btn-outline">Set Zero</button>
      <button id="reset-calibration" class="btn btn-sm btn-ghost">Reset Zero</button>
    </div>

    <div id="ruler-overlay" class="ruler-overlay hidden"></div>

    <div class="mb-4">
      <label
        for="tolerance"
        class="mb-1 block text-xs font-semibold uppercase tracking-wide text-base-content/70"
        >Tolerance</label
      >
      <select id="tolerance" class="select select-bordered select-sm w-full sm:max-w-40">
        <option value="0.1">0.1 deg</option>
        <option value="0.2" selected>0.2 deg</option>
        <option value="0.5">0.5 deg</option>
        <option value="1.0">1.0 deg</option>
      </select>
    </div>

    <div id="view-2d" class="mb-5">
      <div class="vial rounded-3xl p-3 sm:p-4">
        <div class="vial-rings relative mx-auto aspect-square w-full max-w-[320px]">
          <div class="crosshair crosshair-x"></div>
          <div class="crosshair crosshair-y"></div>
          <div id="bubble-dot" class="bubble-dot"></div>
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
        </div>
      </div>
    </div>

    <div id="view-1d" class="mb-5 hidden">
      <div class="beam-vial rounded-2xl p-3 sm:p-4">
        <div class="beam-track">
          <div class="beam-center-zone"></div>
          <div id="beam-bubble" class="beam-bubble"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="stat-card rounded-xl p-3 text-center">
        <div class="text-xs uppercase tracking-wide text-base-content/60">Pitch</div>
        <div id="pitch-value" class="font-mono text-2xl font-bold tabular-nums">0.0 deg</div>
      </div>
      <div class="stat-card rounded-xl p-3 text-center">
        <div class="text-xs uppercase tracking-wide text-base-content/60">Roll</div>
        <div id="roll-value" class="font-mono text-2xl font-bold tabular-nums">0.0 deg</div>
      </div>
    </div>
  </div>
</div>

<!-- Ruler Calibration Modal -->
<dialog id="ruler-calibration-modal" class="modal">
  <div class="modal-box max-w-sm">
    <h3 class="text-lg font-bold text-primary">Ruler Calibration</h3>
    <p class="py-4 text-sm opacity-80">
      Hold a <b>physical ruler</b> against the screen edge. Adjust the scale until the markings
      match exactly.
    </p>

    <div class="mb-6 space-y-4">
      <div
        class="flex items-center justify-between text-xs font-black uppercase tracking-widest text-base-content/50"
      >
        <span>Fine Adjustment</span>
        <span id="ppi-display" class="text-primary">--- DPI</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="ppi-minus" class="btn btn-circle btn-primary btn-outline btn-sm shadow-sm">
          -
        </button>
        <input
          type="range"
          id="calibration-slider"
          min="1"
          max="10"
          step="0.01"
          value="3.78"
          class="range range-primary range-sm flex-1"
        />
        <button id="ppi-plus" class="btn btn-circle btn-primary btn-outline btn-sm shadow-sm">
          +
        </button>
      </div>

      <div class="rounded-lg bg-base-200/50 p-3 text-center">
        <div class="text-[10px] font-bold uppercase tracking-tighter opacity-40">Current Scale</div>
        <div id="real-size-display" class="font-mono text-xl font-black text-base-content/70">
          3.78 px/mm
        </div>
      </div>

      <input type="hidden" id="ppi-setting" data-setting="pxPerMm" value="3.78" />
    </div>

    <div class="modal-action">
      <button id="cancel-calibration" class="btn btn-ghost btn-sm">Cancel</button>
      <button id="save-calibration" class="btn btn-primary btn-sm px-6">Save</button>
    </div>
  </div>
</dialog>

<include src="style.css" type="style" />
