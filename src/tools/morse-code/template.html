<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="radio" class="w-6 h-6"></i>
      Morse Code
    </h2>
    <p class="text-base-content/70 mb-6">
      Convert text to Morse code and play it as sound and/or screen flash.
    </p>

    <div class="form-control w-full mb-6">
      <label class="label">
        <span class="label-text font-semibold">Your Text</span>
        <span class="label-text-alt">
           <button id="btn-import-audio" class="btn btn-xs btn-ghost">
             <i data-lucide="upload" class="w-3 h-3 mr-1"></i>
             Import Audio
           </button>
           <input type="file" id="audio-file-input" accept="audio/*" class="hidden" />
        </span>
      </label>
      <textarea
        id="input-text"
        class="textarea textarea-bordered h-32 font-mono text-sm w-full"
        placeholder="e.g. CQ CQ DE DL1ABC or SOS"
        autocapitalize="characters"
        spellcheck="false"
      ></textarea>
    </div>

    <!-- Settings -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-6 mb-6">
      <!-- Speed -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Speed</span>
          <span class="label-text-alt" id="wpm-display">17 WPM</span>
        </label>
        <input
          type="range"
          id="speed-slider"
          min="5" max="35" value="17"
          class="range range-primary range-sm"
          step="1"
        />
      </div>

      <!-- Volume -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Volume</span>
          <span class="label-text-alt" id="volume-display">90%</span>
        </label>
        <input
          type="range"
          id="volume-slider"
          min="0" max="100" value="90"
          class="range range-primary range-sm"
          step="5"
        />
      </div>

      <!-- Output Mode -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Output</span>
        </label>
        <select id="output-mode" class="select select-bordered select-sm w-full">
          <option value="both" selected>Sound + Flash</option>
          <option value="sound">Sound Only</option>
          <option value="flash">Flash Only</option>
        </select>
      </div>

      <!-- Export Format -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Export Format</span>
        </label>
        <select id="export-format" class="select select-bordered select-sm w-full">
          <option value="wav" selected>WAV (Fast)</option>
          <option value="webm">WebM (Small)</option>
        </select>
      </div>
    </div>

    <!-- Morse Output -->
    <div class="form-control w-full mb-6">
      <label class="label">
        <span class="label-text font-semibold">Morse Code</span>
      </label>
      <div id="output-morse" class="w-full textarea textarea-bordered h-24 font-mono text-lg break-all whitespace-pre-wrap leading-relaxed bg-base-200 p-3 overflow-auto">
        --- ... ---
      </div>
    </div>

    <!-- Flash Indicator -->
    <div class="form-control w-full mb-6">
      <label class="label">
        <span class="label-text font-semibold">Signal</span>
      </label>
      <div id="flash-indicator" class="h-32 rounded-lg bg-base-300 border-2 border-base-300 transition-colors duration-75 flex items-center justify-center">
        <span class="text-base-content/40 text-sm">Visual indicator</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="card-actions justify-center mt-6 gap-2">
      <button id="btn-play" class="btn btn-primary flex-1 sm:flex-none">
        <span class="loading loading-spinner hidden" id="spinner"></span>
        <i data-lucide="play" class="w-4 h-4 mr-2" id="play-icon"></i>
        Play
      </button>
      <button id="btn-stop" class="btn btn-outline btn-error hidden flex-1 sm:flex-none">
        <i data-lucide="square" class="w-4 h-4 mr-2"></i>
        Stop
      </button>
      <button id="btn-export-audio" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Export Audio
      </button>
    </div>

    <div id="status" class="mt-4 text-sm text-base-content/60 text-center">
      Ready
    </div>
  </div>
</div>
