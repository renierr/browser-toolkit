<style>
  /* Make dots & dashes more distinct */
  #output-morse .dot,
  #output-morse .dash {
    display: inline-block;
    min-width: 1.1ch;
    text-align: center;
    font-weight: bold;
  }

  /* Word separator styling */
  #output-morse .word-gap,
  #output-morse .char-gap {
    font-size: 0.9em;
    margin-left: 0.5rem;
    margin-right: 0.5rem;
    opacity: 0.7;
  }

  #flash-indicator {
    --lamp-off: #1e293b;        /* slate-900-ish */
    --lamp-on:  #fef08a;        /* warm yellow */
    --glow-color: #fbbf24;      /* amber-400 */
    --filament: #d97706;        /* amber-600 */

    width: 140px;
    height: 140px;
    position: relative;
    background: radial-gradient(circle at 30% 30%, #334155 0%, var(--lamp-off) 70%);
    border-radius: 50% 50% 40% 40% / 60% 60% 50% 50%;
    border: 3px solid #475569;
    box-shadow:
      inset 0 4px 12px rgba(0,0,0,0.7),
      0 0 30px rgba(0,0,0,0.6);
    overflow: hidden;
    transition: all 0.15s ease-out;
  }

  .flash-lamp.on {
    background: radial-gradient(circle at 30% 30%, #475569 0%, var(--lamp-off) 60%);
    box-shadow:
      inset 0 4px 12px rgba(0,0,0,0.5),
      0 0 60px var(--glow-color),
      0 0 120px var(--glow-color),
      0 0 200px rgba(251,191,36,0.5);
  }

  /* The glass bulb shine */
  .flash-lamp .bulb {
    position: absolute;
    inset: 12px;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.9) 0%, transparent 60%);
    border-radius: 50%;
    opacity: 0.15;
    pointer-events: none;
  }

  /* Filament (the glowing wire inside) */
  .flash-lamp .filament {
    position: absolute;
    inset: 35% 28% 35% 28%;
    background: var(--filament);
    border-radius: 40% 40% 10% 10%;
    box-shadow:
      inset 0 0 12px #fef08a,
      0 0 18px var(--filament);
    opacity: 0;
    transition: opacity 0.08s ease;
  }

  .flash-lamp.on .filament {
    opacity: 1;
  }

  /* Big outer glow halo */
  .flash-lamp .glow {
    position: absolute;
    inset: -40%;
    background: radial-gradient(circle, var(--glow-color) 10%, transparent 60%);
    opacity: 0;
    filter: blur(40px);
    transition: opacity 0.12s ease;
  }

  .flash-lamp.on .glow {
    opacity: 0.7;
    animation: glow-pulse 2.4s infinite ease-in-out;
  }

  /* Animations */
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.6; transform: scale(1.05); }
    50%      { opacity: 0.95; transform: scale(1.18); }
  }
</style>

<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="radio" class="w-6 h-6"></i>
      Morse Code
    </h2>
    <p class="text-base-content/70 mb-6">
      Convert text to Morse code and play it as sound and/or screen flash.
    </p>

    <div class="form-control w-full mb-6">
      <label class="label">
        <span class="label-text font-semibold">Your Text</span>
        <span class="label-text-alt">
           <button id="btn-import-audio" class="btn btn-xs btn-ghost">
             <i data-lucide="upload" class="w-3 h-3 mr-1"></i>
             Import Audio
           </button>
           <input type="file" id="audio-file-input" accept="audio/*" class="hidden" />
        </span>
      </label>
      <textarea
        id="input-text"
        class="textarea textarea-bordered h-32 font-mono text-sm w-full"
        placeholder="e.g. CQ CQ DE DL1ABC or SOS"
        autocapitalize="characters"
        spellcheck="false"
      ></textarea>
    </div>

    <!-- Settings -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6 mb-6">
      <!-- Speed -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Speed</span>
          <span class="label-text-alt" id="wpm-display">17 WPM</span>
        </label>
        <input
          type="range"
          id="speed-slider"
          min="5" max="35" value="17"
          class="range range-primary range-sm"
          step="1"
        />
      </div>

      <!-- Word Gap -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Word Gap</span>
          <span class="label-text-alt" id="word-gap-display">10 units</span>
        </label>
        <input
          type="range"
          id="word-gap-slider"
          min="3" max="50" value="10"
          class="range range-primary range-sm"
          step="1"
        />
      </div>

      <!-- Volume -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Volume</span>
          <span class="label-text-alt" id="volume-display">90%</span>
        </label>
        <input
          type="range"
          id="volume-slider"
          min="0" max="100" value="90"
          class="range range-primary range-sm"
          step="5"
        />
      </div>

      <!-- Output Mode -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Output</span>
        </label>
        <select id="output-mode" class="select select-bordered select-sm w-full">
          <option value="both" selected>Sound + Flash</option>
          <option value="sound">Sound Only</option>
          <option value="flash">Flash Only</option>
        </select>
      </div>

      <!-- Export Format -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Export Format</span>
        </label>
        <select id="export-format" class="select select-bordered select-sm w-full">
          <option value="wav" selected>WAV (Fast)</option>
          <option value="webm">WebM (Small)</option>
        </select>
      </div>
    </div>

    <!-- Morse Output -->
    <div class="flex flex-col md:flex-row md:items-start gap-6">
      <div id="flash-indicator" class="flash-lamp mx-auto md:mx-0 shrink-0">
        <div class="bulb"></div>
        <div class="filament"></div>
        <div class="glow"></div>
      </div>

      <div class="form-control flex-1 w-full mb-6">
        <label class="label">
          <span class="label-text font-semibold">Morse Code</span>
        </label>
        <div id="output-morse" class="w-full h-32 font-mono text-2xl tracking-wider leading-relaxed p-6 bg-base-200 text-primary rounded-xl border border-base-300 shadow-lg whitespace-pre-wrap break-all overflow-auto transition-all duration-300">
        </div>
      </div>
    </div>


    <!-- Actions -->
    <div class="card-actions justify-center mt-6 gap-2">
      <button id="btn-play" class="btn btn-primary flex-1 sm:flex-none">
        <span class="loading loading-spinner hidden" id="spinner"></span>
        <i data-lucide="play" class="w-4 h-4 mr-2" id="play-icon"></i>
        Play
      </button>
      <button id="btn-stop" class="btn btn-outline btn-error hidden flex-1 sm:flex-none">
        <i data-lucide="square" class="w-4 h-4 mr-2"></i>
        Stop
      </button>
      <button id="btn-export-audio" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Export Audio
      </button>
    </div>

    <div id="status" class="mt-4 text-sm text-base-content/60 text-center">
    </div>
  </div>
</div>
