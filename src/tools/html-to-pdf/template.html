<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">HTML to PDF</h2>
    <p class="text-base-content/70 mb-6">
      Create a PDF from HTML content with custom styling and page settings.
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <button id="load-content" class="btn btn-secondary">
        <i data-lucide="file-code" class="w-4 h-4 mr-2"></i>
        Load HTML
      </button>
      <button id="save-content" class="btn btn-outline">
        <i data-lucide="save" class="w-4 h-4 mr-2"></i>
        Save HTML
      </button>
    </div>

    <div>
      <div
        id="editor"
        class="bg-white border-2 border-base-300 rounded-lg overflow-hidden mb-6 min-h-60"
        style="height: 400px; max-height: 50vh; display: flex; flex-direction: column"
      ></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Font Family</span></label>
        <select id="font-family" class="select select-bordered w-full" data-setting="fontFamily">
          <option value="helvetica" selected>Helvetica</option>
          <option value="dejavusans">DejaVu Sans (embedded)</option>
          <option value="times">Times New Roman</option>
          <option value="courier">Courier</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Font Size</span></label>
        <input
          type="number"
          id="font-size"
          value="12"
          class="input input-bordered w-full"
          data-setting="fontSize"
        />
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Page Size</span></label>
        <select id="page-size" class="select select-bordered w-full" data-setting="pageSize">
          <optgroup label="ISO A Series">
            <option value="A4" selected>A4</option>
            <option value="A3">A3</option>
            <option value="A5">A5</option>
          </optgroup>
          <optgroup label="North American">
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
          </optgroup>
          <option value="Custom">Custom</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Orientation</span></label>
        <select
          id="page-orientation"
          class="select select-bordered w-full"
          data-setting="orientation"
        >
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
    </div>

    <div id="custom-size-container" class="hidden grid grid-cols-2 gap-4 mb-8">
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Width (pt)</span></label>
        <input
          type="number"
          id="custom-width"
          value="595"
          min="1"
          class="input input-bordered w-full"
          data-setting="customWidth"
        />
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Height (pt)</span></label>
        <input
          type="number"
          id="custom-height"
          value="842"
          min="1"
          class="input input-bordered w-full"
          data-setting="customHeight"
        />
      </div>
    </div>

    <div class="card-actions flex-col gap-4">
      <div class="w-full">
        <button id="advanced-pdf" class="btn btn-primary w-full">
          <i data-lucide="file-text" class="w-4 h-4 mr-2"></i>
          Generate PDF
        </button>
        <p class="text-xs text-base-content/50 mt-1 ml-1">Optimized file size and structure.</p>
      </div>

      <div class="w-full">
        <button id="print-to-pdf" class="btn btn-outline w-full">
          <i data-lucide="printer" class="w-4 h-4 mr-2"></i>
          Browser Print
        </button>
        <p class="text-xs text-base-content/50 mt-1 ml-1">
          Uses browser engine for best formatting.
        </p>
      </div>
    </div>
  </div>
</div>
