<include src="html-editor.css" type="style" />
<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">HTML to PDF</h2>
    <div id="editor-host" class="border rounded-lg overflow-hidden mb-6 shadow-xl"></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
      <div class="form-control">
        <label class="label" for="font-family"
          ><span class="label-text font-semibold">Font Family</span></label
        >
        <select id="font-family" class="select select-bordered w-full" data-setting="fontFamily">
          <option value="sans-serif" selected>Sans-serif (default)</option>
          <option value="NotoSans, sans-serif">NotoSans</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="font-size"
          ><span class="label-text font-semibold">Font Size</span></label
        >
        <input
          type="number"
          id="font-size"
          value="12"
          min="6"
          max="72"
          class="input input-bordered w-full"
          data-setting="fontSize"
        />
      </div>
      <div class="form-control">
        <label class="label" for="page-size"
          ><span class="label-text font-semibold">Page Size</span></label
        >
        <select id="page-size" class="select select-bordered w-full" data-setting="pageSize">
          <optgroup label="ISO A Series">
            <option value="A4" selected>A4</option>
            <option value="A3">A3</option>
            <option value="A5">A5</option>
          </optgroup>
          <optgroup label="North American">
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
          </optgroup>
          <option value="Custom">Custom</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="page-orientation"
          ><span class="label-text font-semibold">Orientation</span></label
        >
        <select
          id="page-orientation"
          class="select select-bordered w-full"
          data-setting="orientation"
        >
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="margin-size"
          ><span class="label-text font-semibold">Margin (pt)</span></label
        >
        <input
          type="number"
          id="margin-size"
          value="20"
          min="0"
          max="100"
          class="input input-bordered w-full"
          data-setting="pageMargin"
        />
      </div>
    </div>
    <div id="custom-size-container" class="hidden grid grid-cols-2 gap-4 mb-8">
      <div class="form-control">
        <label class="label" for="custom-width"
          ><span class="label-text font-semibold">Width (pt)</span></label
        >
        <input
          type="number"
          id="custom-width"
          value="595"
          min="1"
          class="input input-bordered w-full"
          data-setting="customWidth"
        />
      </div>
      <div class="form-control">
        <label class="label" for="custom-height"
          ><span class="label-text font-semibold">Height (pt)</span></label
        >
        <input
          type="number"
          id="custom-height"
          value="842"
          min="1"
          class="input input-bordered w-full"
          data-setting="customHeight"
        />
      </div>
    </div>
    <div class="card-actions justify-end gap-4">
      <button id="load-content" class="btn btn-secondary">
        <i data-lucide="file-code" class="w-4 h-4 mr-2"></i>
        Load HTML
      </button>
      <button id="save-content" class="btn btn-outline">
        <i data-lucide="save" class="w-4 h-4 mr-2"></i>
        Save HTML
      </button>
      <button id="generate-pdf" class="btn btn-primary">
        <i data-lucide="file-text" class="w-4 h-4 mr-2"></i>
        Generate PDF
      </button>
    </div>
  </div>
</div>
<input type="file" id="file-input" accept=".html,.htm,.txt" class="hidden" />
