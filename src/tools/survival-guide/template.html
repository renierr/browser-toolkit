<div class="flex flex-col h-full">
  <!-- Search Bar -->
  <div class="p-4 border-b border-base-300 bg-base-200/50">
    <div class="relative">
      <input
        type="text"
        id="sg-search"
        placeholder="Search guides..."
        class="input input-bordered w-full pl-10"
      />
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-base-content/50"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <button
        id="sg-clear-search"
        class="absolute right-3 top-1/2 -translate-y-1/2 btn btn-ghost btn-xs btn-circle hidden"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Category Tabs -->
  <div
    id="sg-categories"
    class="flex gap-1 p-2 border-b border-base-300 overflow-x-auto scrollbar-hide bg-base-200/30"
  >
    <button class="btn btn-sm btn-ghost sg-category-btn sg-category-active" data-category="all">
      All
    </button>
  </div>

  <!-- Content Area -->
  <div class="flex-1 overflow-hidden flex">
    <!-- Guide List -->
    <div
      id="sg-guide-list"
      class="w-full md:w-1/2 lg:w-1/3 border-r border-base-300 overflow-y-auto p-3 space-y-2"
    >
      <div class="text-center text-base-content/50 py-10">Loading guides...</div>
    </div>

    <!-- Guide Detail -->
    <div id="sg-guide-detail" class="hidden md:flex flex-1 overflow-y-auto">
      <div class="p-6 w-full">
        <div
          id="sg-detail-empty"
          class="flex flex-col items-center justify-center h-full text-base-content/40"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-16 h-16 mb-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
          <p>Select a guide to view</p>
        </div>
        <div id="sg-detail-content" class="hidden">
          <button id="sg-back-btn" class="btn btn-ghost btn-sm mb-4 md:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 mr-1"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
            Back
          </button>
          <div id="sg-guide-title" class="text-2xl font-bold mb-2"></div>
          <div id="sg-guide-tags" class="flex flex-wrap gap-1 mb-4"></div>
          <div id="sg-guide-images" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4"></div>
          <div id="sg-guide-body" class="prose prose-sm sm:prose max-w-none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .scrollbar-hide::-webkit-scrollbar {
    display: none;
  }
  .scrollbar-hide {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .sg-guide-card {
    cursor: pointer;
    transition:
      background-color 0.2s,
      border-color 0.2s;
    border: 1px solid transparent;
    border-radius: 0.5rem;
    padding: 0.75rem;
  }
  .sg-guide-card:hover {
    background-color: var(--color-base-200);
    border-color: var(--color-base-300);
  }
  .sg-guide-card.sg-active {
    background-color: color-mix(in srgb, var(--color-primary) 10%, transparent);
    border-color: color-mix(in srgb, var(--color-primary) 30%, transparent);
  }
  .sg-category-btn {
    white-space: nowrap;
  }
  #sg-guide-body h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
  }
  #sg-guide-body h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-top: 1.25rem;
    margin-bottom: 0.5rem;
  }
  #sg-guide-body h3 {
    font-size: 1.125rem;
    font-weight: 600;
    margin-top: 1rem;
    margin-bottom: 0.5rem;
  }
  #sg-guide-body p {
    margin-bottom: 0.75rem;
    line-height: 1.625;
  }
  #sg-guide-body ul,
  #sg-guide-body ol {
    margin-bottom: 0.75rem;
    padding-left: 1.5rem;
  }
  #sg-guide-body ul {
    list-style-type: disc;
  }
  #sg-guide-body ol {
    list-style-type: decimal;
  }
  #sg-guide-body li {
    margin-bottom: 0.25rem;
  }
  #sg-guide-body code {
    background-color: var(--color-base-300);
    padding: 0.125rem 0.375rem;
    border-radius: 0.25rem;
    font-size: 0.875rem;
    font-family: monospace;
  }
  #sg-guide-body pre {
    background-color: var(--color-base-300);
    padding: 0.75rem;
    border-radius: 0.5rem;
    overflow-x: auto;
    margin-bottom: 0.75rem;
  }
  #sg-guide-body pre code {
    background-color: transparent;
    padding: 0;
  }
  #sg-guide-body strong {
    font-weight: 700;
  }
  #sg-guide-body em {
    font-style: italic;
  }
  #sg-guide-body blockquote {
    border-left: 4px solid var(--color-primary);
    padding-left: 1rem;
    font-style: italic;
    margin: 0.75rem 0;
  }
  #sg-guide-body table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 0.75rem;
  }
  #sg-guide-body th,
  #sg-guide-body td {
    border: 1px solid var(--color-base-300);
    padding: 0.5rem 0.75rem;
  }
  #sg-guide-body th {
    background-color: var(--color-base-200);
    font-weight: 600;
  }
  #sg-guide-body hr {
    margin: 1.5rem 0;
    border-color: var(--color-base-300);
  }
  #sg-guide-body a {
    color: var(--color-primary);
    text-decoration: underline;
  }
  #sg-guide-body img {
    max-width: 100%;
    height: auto;
    border-radius: 0.5rem;
    margin: 0.75rem 0;
  }
</style>
