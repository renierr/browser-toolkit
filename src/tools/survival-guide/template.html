<div class="flex flex-col h-full">
  <!-- Search Bar -->
  <div class="p-4 border-b border-base-300 bg-base-200/50">
    <div class="flex flex-wrap gap-2">
      <div class="relative flex-1">
        <input
          type="text"
          id="sg-search"
          placeholder="Search guides..."
          class="input input-bordered w-full pl-10 min-w-36"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-base-content/50"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <button
          id="sg-clear-search"
          class="absolute right-3 top-1/2 -translate-y-1/2 btn btn-ghost btn-xs btn-circle hidden"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <select id="sg-language" class="select select-bordered select-sm w-auto"></select>
    </div>
  </div>

  <!-- Category Tabs -->
  <div
    id="sg-categories"
    class="flex gap-1 p-2 border-b border-base-300 overflow-x-auto scrollbar-hide bg-base-200/30"
  >
    <button class="btn btn-sm btn-ghost sg-category-btn sg-category-active" data-category="all">
      All
    </button>
  </div>

  <!-- Content Area -->
  <div class="flex-1 overflow-hidden flex">
    <!-- Guide List -->
    <div
      id="sg-guide-list"
      class="w-full md:w-1/2 lg:w-1/3 border-r border-base-300 overflow-y-auto p-3 space-y-2 max-h-[calc(100dvh-17rem)]"
    >
      <div class="text-center text-base-content/50 py-10">Loading guides...</div>
    </div>

    <!-- Guide Detail -->
    <div id="sg-guide-detail" class="hidden md:flex flex-1 overflow-y-auto">
      <div class="p-6 w-full">
        <div
          id="sg-detail-empty"
          class="flex flex-col items-center justify-center h-full text-base-content/40"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-16 h-16 mb-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
          <p>Select a guide to view</p>
        </div>
        <div id="sg-detail-content" class="hidden">
          <button id="sg-back-btn" class="btn btn-ghost btn-sm mb-4 md:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 mr-1"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
            Back
          </button>
          <div id="sg-guide-title" class="text-2xl font-bold mb-2"></div>
          <div id="sg-guide-tags" class="flex flex-wrap gap-1 mb-4"></div>
          <div id="sg-guide-images" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4"></div>
          <div id="sg-guide-body" class="prose prose-sm sm:prose max-w-none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<include src="style.css" type="style" />
