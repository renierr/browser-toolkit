<div class="flex flex-col h-[100dvh] gap-1.5 overflow-hidden select-none">
  <!-- Top Bar: Actions + Module Info + Transport -->
  <div id="top-bar" class="flex-shrink-0 flex flex-col gap-1.5">
    <div class="flex flex-wrap items-center gap-1.5 p-1.5 bg-base-200 rounded-lg">
      <button id="btn-new" class="btn btn-xs btn-outline">
        <i data-lucide="file-plus" class="w-3.5 h-3.5 mr-1"></i> New
      </button>
      <button id="btn-load-mod" class="btn btn-xs btn-outline">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 mr-1"></i> Load
      </button>
      <button id="btn-export-mod" class="btn btn-xs btn-outline" disabled>
        <i data-lucide="download" class="w-3.5 h-3.5 mr-1"></i> Export
      </button>
      <input type="file" id="file-load-mod" class="hidden" accept=".mod,.xm,.it" />

      <div class="divider divider-horizontal mx-0.5"></div>

      <div class="flex items-center gap-2 text-xs">
        <span id="mod-format" class="badge badge-xs badge-primary">-</span>
        <span id="mod-title" class="font-semibold truncate max-w-32">-</span>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <span><span class="opacity-60">Ch:</span> <span id="mod-channels">-</span></span>
        <span><span class="opacity-60">Pat:</span> <span id="mod-patterns">-</span></span>
        <span><span class="opacity-60">Ins:</span> <span id="mod-instruments">-</span></span>
      </div>

      <div class="divider divider-horizontal mx-0.5"></div>

      <!-- Transport -->
      <button id="btn-play" class="btn btn-xs btn-primary" disabled>
        <i data-lucide="play" class="w-3.5 h-3.5"></i>
      </button>
      <button id="btn-stop" class="btn btn-xs btn-ghost" disabled>
        <i data-lucide="square" class="w-3.5 h-3.5"></i>
      </button>
      <button id="btn-loop" class="btn btn-xs btn-active btn-outline" disabled>
        <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
      </button>

      <div class="divider divider-horizontal mx-0.5"></div>

      <div class="flex items-center gap-1.5 text-xs">
        <span class="font-semibold">BPM</span>
        <input
          type="range"
          id="bpm-slider"
          min="32"
          max="255"
          value="125"
          class="range range-xs range-primary w-16"
        />
        <span id="bpm-display" class="w-7 text-center font-mono">125</span>
      </div>
      <div class="flex items-center gap-1.5 text-xs">
        <span class="font-semibold">SPD</span>
        <input
          type="range"
          id="speed-slider"
          min="1"
          max="32"
          value="6"
          class="range range-xs range-primary w-12"
        />
        <span id="speed-display" class="w-5 text-center font-mono">6</span>
      </div>
      <div class="flex items-center gap-1.5 text-xs">
        <span class="font-semibold">Pos</span>
        <span id="position-display" class="font-mono">00:00</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex flex-1 min-h-0 gap-1.5 overflow-hidden">
    <!-- Left: Pattern Order -->
    <div class="flex-shrink-0 w-14 flex flex-col bg-base-200 rounded-lg overflow-hidden">
      <div class="text-[10px] font-bold text-center py-1 bg-base-300">ORDER</div>
      <div id="pattern-order" class="flex-1 overflow-y-auto p-0.5 space-y-px"></div>
      <div class="flex gap-px p-0.5 border-t border-base-300">
        <button id="btn-add-pattern" class="btn btn-xs btn-outline flex-1 py-0 h-auto text-xs">
          +
        </button>
        <button id="btn-remove-pattern" class="btn btn-xs btn-outline flex-1 py-0 h-auto text-xs">
          -
        </button>
      </div>
    </div>

    <!-- Center: Tracker Grid -->
    <div class="flex-1 min-w-0 flex flex-col bg-base-200 rounded-lg overflow-hidden">
      <div id="tracker-viewport" class="flex-1 overflow-auto">
        <div id="tracker-container" class="relative">
          <table id="tracker-table" class="w-full border-collapse tracker-table">
            <thead id="tracker-header" class="sticky top-0 z-20"></thead>
            <tbody id="tracker-grid"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="flex-shrink-0 w-48 flex flex-col gap-1.5 overflow-y-auto">
      <!-- Instrument List -->
      <div class="p-1.5 bg-base-200 rounded-lg">
        <div class="text-[10px] font-bold mb-1 flex items-center justify-between">
          <span>INSTRUMENTS</span>
          <span id="inst-count" class="opacity-50 text-[9px]"></span>
        </div>
        <div id="instrument-list" class="space-y-px max-h-36 overflow-y-auto text-xs"></div>
      </div>

      <!-- Note Input -->
      <div class="p-1.5 bg-base-200 rounded-lg">
        <div class="text-[10px] font-bold mb-1">NOTE INPUT</div>

        <!-- Piano Keys -->
        <div id="piano-keys" class="flex gap-px mb-2 h-16"></div>

        <!-- Note Buttons Grid -->
        <div class="grid grid-cols-6 gap-0.5 mb-1">
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="C">
            C
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="C#">
            C#
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="D">
            D
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="D#">
            D#
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="E">
            E
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="F">
            F
          </button>
        </div>
        <div class="grid grid-cols-6 gap-0.5 mb-1">
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="F#">
            F#
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="G">
            G
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="G#">
            G#
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="A">
            A
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="A#">
            A#
          </button>
          <button class="note-btn btn btn-xs btn-ghost py-0 h-6 text-[10px]" data-note="B">
            B
          </button>
        </div>

        <!-- Octave -->
        <div class="mt-1.5">
          <div class="text-[10px] font-bold mb-0.5">OCTAVE</div>
          <div class="flex gap-0.5">
            <button
              class="octave-btn btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]"
              data-octave="1"
            >
              1
            </button>
            <button
              class="octave-btn btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]"
              data-octave="2"
            >
              2
            </button>
            <button
              class="octave-btn btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]"
              data-octave="3"
            >
              3
            </button>
            <button
              class="octave-btn btn btn-xs btn-active btn-outline flex-1 py-0 h-6 text-[10px]"
              data-octave="4"
            >
              4
            </button>
            <button
              class="octave-btn btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]"
              data-octave="5"
            >
              5
            </button>
            <button
              class="octave-btn btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]"
              data-octave="6"
            >
              6
            </button>
          </div>
        </div>

        <!-- Volume -->
        <div class="mt-1.5">
          <div class="text-[10px] font-bold mb-0.5">VOLUME</div>
          <div class="flex items-center gap-1.5">
            <input
              type="range"
              id="volume-slider"
              min="0"
              max="64"
              value="64"
              class="range range-xs range-primary flex-1"
            />
            <span id="volume-display" class="text-[10px] w-5 text-right font-mono">64</span>
          </div>
        </div>

        <!-- Instrument Preview -->
        <button
          id="btn-preview-inst"
          class="btn btn-xs btn-outline w-full mt-1.5 py-0 h-7 text-[10px]"
        >
          <i data-lucide="play" class="w-3 h-3 mr-1"></i> Preview
        </button>

        <!-- Cell Operations -->
        <div class="flex gap-0.5 mt-1.5">
          <button id="btn-clear-cell" class="btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]">
            Clear
          </button>
          <button id="btn-copy-cell" class="btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]">
            Copy
          </button>
          <button id="btn-paste-cell" class="btn btn-xs btn-outline flex-1 py-0 h-6 text-[10px]">
            Paste
          </button>
        </div>
      </div>

      <!-- Effect Input -->
      <div class="p-1.5 bg-base-200 rounded-lg">
        <div class="text-[10px] font-bold mb-1">EFFECT</div>
        <div class="flex gap-1">
          <input
            id="effect-input"
            type="text"
            maxlength="2"
            placeholder="0"
            class="input input-bordered input-xs w-10 text-center font-mono text-xs"
          />
          <input
            id="effect-param-input"
            type="text"
            maxlength="2"
            placeholder="00"
            class="input input-bordered input-xs w-14 text-center font-mono text-xs"
          />
          <button id="btn-apply-effect" class="btn btn-xs btn-outline px-2 py-0 h-6 text-[10px]">
            Set
          </button>
        </div>
        <div class="mt-1 text-[9px] opacity-60">
          0=Arp 1=Up 2=Down 3=Porta 4=Vibr 5=T.Porta+Vol 6=Vibr+Vol 7=Tremolo 8=Pan 9=Offset
          A=VolSlide B=Jump C=Volume D=Break E=Extd F=Speed
        </div>
      </div>
    </div>
  </div>
</div>

<include src="style.css" type="style" />
