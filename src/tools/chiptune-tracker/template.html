<div class="flex flex-col h-full gap-2">
  <!-- Project Actions -->
  <div class="flex flex-wrap gap-2 p-2 bg-base-200 rounded-lg">
    <button id="btn-export-wav" class="btn btn-sm btn-outline">
      <i data-lucide="download" class="w-4 h-4 mr-1"></i> Export WAV
    </button>
    <button id="btn-save-project" class="btn btn-sm btn-outline">
      <i data-lucide="save" class="w-4 h-4 mr-1"></i> Save
    </button>
    <button id="btn-load-project" class="btn btn-sm btn-outline">
      <i data-lucide="folder-open" class="w-4 h-4 mr-1"></i> Load
    </button>
    <button id="btn-load-mod" class="btn btn-sm btn-outline">
      <i data-lucide="file-music" class="w-4 h-4 mr-1"></i> Load MOD
    </button>
    <input type="file" id="file-load" class="hidden" accept=".json" />
    <input type="file" id="file-load-mod" class="hidden" accept=".mod" />
  </div>

  <!-- MOD Info Panel -->
  <div
    id="mod-info"
    class="hidden flex flex-wrap gap-2 sm:gap-4 p-2 bg-base-300 rounded-lg text-xs"
  >
    <div class="flex items-center gap-1">
      <i data-lucide="music" class="w-3 h-3"></i>
      <span id="mod-title" class="font-semibold">-</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="opacity-70">Ch:</span>
      <span id="mod-channels">-</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="opacity-70">Samples:</span>
      <span id="mod-samples">-</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="opacity-70">Patterns:</span>
      <span id="mod-patterns">-</span>
    </div>
  </div>

  <!-- Transport Controls -->
  <div class="flex flex-wrap items-center gap-2 sm:gap-3 p-2 bg-base-200 rounded-lg">
    <button id="btn-play" class="btn btn-sm btn-primary">
      <i data-lucide="play" class="w-4 h-4"></i>
    </button>
    <button id="btn-stop" class="btn btn-sm btn-ghost">
      <i data-lucide="square" class="w-4 h-4"></i>
    </button>
    <button id="btn-loop" class="btn btn-sm btn-outline">
      <i data-lucide="repeat" class="w-4 h-4"></i>
    </button>

    <div class="divider divider-horizontal mx-1"></div>

    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold">BPM:</span>
      <input
        type="range"
        id="bpm-slider"
        min="60"
        max="200"
        value="120"
        class="range range-xs range-primary w-24"
      />
      <span id="bpm-display" class="text-sm w-8">120</span>
    </div>

    <div class="divider divider-horizontal mx-1"></div>

    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold">Pos:</span>
      <span id="position-display" class="font-mono text-sm">Pat: 00 Row: 00</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex flex-col sm:flex-row flex-1 gap-2 overflow-hidden">
    <!-- Pattern List -->
    <div class="w-full sm:w-16 flex flex-col sm:content-start">
      <div
        class="text-xs font-semibold text-center p-1 bg-base-200 rounded-t sm:rounded-tl sm:rounded-tr sm:w-full"
      >
        Order
      </div>
      <div
        id="pattern-order"
        class="flex-1 overflow-y-auto bg-base-200 rounded-b flex flex-row md:flex-col sm:w-full max-h-24 sm:max-h-none"
      >
        <!-- Pattern buttons will be inserted here -->
      </div>
      <div class="flex gap-1 mt-1 sm:mt-0 sm:w-full sm:justify-center">
        <button id="btn-add-pattern" class="btn btn-xs btn-outline flex-1 sm:flex-none">+</button>
        <button id="btn-remove-pattern" class="btn btn-xs btn-outline flex-1 sm:flex-none">
          -
        </button>
      </div>
    </div>

    <!-- Tracker Grid -->
    <div class="flex-1 overflow-auto bg-base-200 rounded-lg">
      <table class="table table-xs font-mono">
        <thead id="tracker-header">
          <!-- Channel headers will be inserted here -->
        </thead>
        <tbody id="tracker-grid">
          <!-- Grid rows will be inserted here -->
        </tbody>
      </table>
    </div>

    <!-- Instrument Panel -->
    <div class="w-full sm:w-56 flex flex-col gap-2">
      <!-- Note buttons -->
      <div class="p-2 bg-base-200 rounded-lg">
        <div class="text-xs font-semibold mb-1">Notes</div>
        <div class="grid grid-cols-4 gap-1">
          <button class="note-btn btn btn-xs btn-ghost" data-note="C">C</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="C#">C#</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="D">D</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="D#">D#</button>
        </div>
        <div class="grid grid-cols-4 gap-1 mt-1">
          <button class="note-btn btn btn-xs btn-ghost" data-note="E">E</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="F">F</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="F#">F#</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="G">G</button>
        </div>
        <div class="grid grid-cols-4 gap-1 mt-1">
          <button class="note-btn btn btn-xs btn-ghost" data-note="G#">G#</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="A">A</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="A#">A#</button>
          <button class="note-btn btn btn-xs btn-ghost" data-note="B">B</button>
        </div>

        <!-- Octave selector -->
        <div class="mt-2">
          <div class="text-xs font-semibold mb-1">Octave</div>
          <div class="flex flex-wrap gap-1 justify-start">
            <button class="octave-btn btn btn-xs btn-outline" data-octave="1">1</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="2">2</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="3">3</button>
            <button class="octave-btn btn btn-xs btn-outline btn-active" data-octave="4">4</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="5">5</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="6">6</button>
          </div>
        </div>
      </div>

      <!-- Instrument controls -->
      <div class="p-2 bg-base-200 rounded-lg">
        <h3 class="font-semibold text-sm mb-2">Instrument</h3>
        <div class="flex flex-wrap gap-1 mb-2" id="instrument-tabs">
          <!-- Instrument buttons -->
        </div>

        <div class="space-y-2">
          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Waveform</span>
            </label>
            <select id="inst-waveform" class="select select-xs select-bordered">
              <option value="square">Square</option>
              <option value="sawtooth">Sawtooth</option>
              <option value="triangle">Triangle</option>
              <option value="pulse">Pulse</option>
              <option value="noise">Noise</option>
            </select>
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Attack</span>
              <span class="label-text-alt" id="atk-display">0.01</span>
            </label>
            <input
              type="range"
              id="inst-atk"
              min="0"
              max="1"
              step="0.01"
              value="0.01"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Decay</span>
              <span class="label-text-alt" id="dec-display">0.1</span>
            </label>
            <input
              type="range"
              id="inst-dec"
              min="0"
              max="1"
              step="0.01"
              value="0.1"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Sustain</span>
              <span class="label-text-alt" id="sus-display">0.7</span>
            </label>
            <input
              type="range"
              id="inst-sus"
              min="0"
              max="1"
              step="0.01"
              value="0.7"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Release</span>
              <span class="label-text-alt" id="rel-display">0.2</span>
            </label>
            <input
              type="range"
              id="inst-rel"
              min="0"
              max="2"
              step="0.01"
              value="0.2"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Duty/Pulse Width</span>
              <span class="label-text-alt" id="duty-display">50%</span>
            </label>
            <input
              type="range"
              id="inst-duty"
              min="5"
              max="95"
              step="5"
              value="50"
              class="range range-xs"
            />
          </div>

          <!-- Volume slider -->
          <div class="mt-2">
            <div class="text-xs font-semibold mb-1">Volume</div>
            <div class="flex items-center gap-2">
              <input
                type="range"
                id="volume-slider"
                min="0"
                max="64"
                value="64"
                class="range range-xs range-primary flex-1"
              />
              <span id="volume-display" class="text-xs w-6 text-right">64</span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="mt-3">
          <div class="flex gap-1">
            <button id="btn-clear-cell" class="btn btn-xs btn-outline flex-1">Clear</button>
            <button id="btn-copy-cell" class="btn btn-xs btn-outline flex-1">Copy</button>
            <button id="btn-paste-cell" class="btn btn-xs btn-outline flex-1">Paste</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .tracker-cell {
    padding: 0.125rem 0.25rem;
    font-size: 0.75rem;
    text-align: center;
    cursor: pointer;
    transition:
      background-color 0.15s,
      color 0.15s;
  }
  .tracker-cell:hover {
    background-color: color-mix(in srgb, var(--color-primary) 20%, transparent);
  }
  .tracker-cell.selected {
    background-color: var(--color-primary);
    color: var(--color-primary-content);
  }
  .tracker-cell.note-cell {
    font-family: monospace;
  }
  .tracker-cell.empty {
    color: color-mix(in srgb, var(--color-base-content) 30%, transparent);
  }
  #tracker-grid tr:hover .tracker-cell {
    background-color: var(--color-base-300);
  }
  #tracker-grid tr:hover .tracker-cell.selected {
    background-color: var(--color-primary);
    color: var(--color-primary-content);
  }
  #tracker-grid tr.active-row .tracker-cell:not(.row-num) {
    background-color: color-mix(in srgb, var(--color-primary) 20%, transparent);
  }
  #tracker-grid tr.active-row .tracker-cell.selected:not(.row-num) {
    background-color: var(--color-primary);
    color: var(--color-primary-content);
  }
</style>
