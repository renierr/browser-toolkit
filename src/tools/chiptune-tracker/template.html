<div class="flex flex-col h-full gap-2">
  <!-- Transport Controls -->
  <div class="flex items-center gap-3 p-2 bg-base-200 rounded-lg">
    <button id="btn-play" class="btn btn-sm btn-primary">
      <i data-lucide="play" class="w-4 h-4"></i>
    </button>
    <button id="btn-stop" class="btn btn-sm btn-outline">
      <i data-lucide="square" class="w-4 h-4"></i>
    </button>
    <button id="btn-loop" class="btn btn-sm btn-outline">
      <i data-lucide="repeat" class="w-4 h-4"></i>
    </button>

    <div class="divider divider-horizontal mx-1"></div>

    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold">BPM:</span>
      <input
        type="range"
        id="bpm-slider"
        min="60"
        max="200"
        value="120"
        class="range range-xs range-primary w-24"
      />
      <span id="bpm-display" class="text-sm w-8">120</span>
    </div>

    <div class="divider divider-horizontal mx-1"></div>

    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold">Pos:</span>
      <span id="position-display" class="font-mono text-sm">Pat: 00 Row: 00</span>
    </div>

    <div class="flex-1"></div>

    <button id="btn-export-wav" class="btn btn-sm btn-outline">
      <i data-lucide="download" class="w-4 h-4 mr-1"></i> Export WAV
    </button>
    <button id="btn-save-project" class="btn btn-sm btn-outline">
      <i data-lucide="save" class="w-4 h-4 mr-1"></i> Save
    </button>
    <button id="btn-load-project" class="btn btn-sm btn-outline">
      <i data-lucide="folder-open" class="w-4 h-4 mr-1"></i> Load
    </button>
    <input type="file" id="file-load" class="hidden" accept=".json" />
  </div>

  <!-- Main Content -->
  <div class="flex flex-1 gap-2 overflow-hidden">
    <!-- Pattern List -->
    <div class="w-20 flex flex-col">
      <div class="text-xs font-semibold text-center p-1 bg-base-200 rounded-t">Order</div>
      <div id="pattern-order" class="flex-1 overflow-y-auto bg-base-200 rounded-b">
        <!-- Pattern buttons will be inserted here -->
      </div>
      <div class="flex gap-1 mt-1">
        <button id="btn-add-pattern" class="btn btn-xs btn-outline flex-1">+</button>
        <button id="btn-remove-pattern" class="btn btn-xs btn-outline flex-1">-</button>
      </div>
    </div>

    <!-- Tracker Grid -->
    <div class="flex-1 overflow-auto bg-base-200 rounded-lg">
      <table class="table table-xs font-mono">
        <thead>
          <tr class="text-xs">
            <th class="w-8 text-center">Row</th>
            <th class="w-20 text-center">Ch1</th>
            <th class="w-16 text-center">Ins1</th>
            <th class="w-16 text-center">Vol1</th>
            <th class="w-20 text-center">Ch2</th>
            <th class="w-16 text-center">Ins2</th>
            <th class="w-16 text-center">Vol2</th>
            <th class="w-20 text-center">Ch3</th>
            <th class="w-16 text-center">Ins3</th>
            <th class="w-16 text-center">Vol3</th>
            <th class="w-20 text-center">Ch4</th>
            <th class="w-16 text-center">Ins4</th>
            <th class="w-16 text-center">Vol4</th>
          </tr>
        </thead>
        <tbody id="tracker-grid">
          <!-- Grid rows will be inserted here -->
        </tbody>
      </table>
    </div>

    <!-- Instrument Panel -->
    <div class="w-56 flex flex-col gap-2">
      <div class="p-2 bg-base-200 rounded-lg">
        <h3 class="font-semibold text-sm mb-2">Instrument</h3>
        <div class="flex gap-1 mb-2" id="instrument-tabs">
          <!-- Instrument buttons -->
        </div>

        <div class="space-y-2">
          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Waveform</span>
            </label>
            <select id="inst-waveform" class="select select-xs select-bordered">
              <option value="square">Square</option>
              <option value="sawtooth">Sawtooth</option>
              <option value="triangle">Triangle</option>
              <option value="pulse">Pulse</option>
              <option value="noise">Noise</option>
            </select>
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Attack</span>
              <span class="label-text-alt" id="atk-display">0.01</span>
            </label>
            <input
              type="range"
              id="inst-atk"
              min="0"
              max="1"
              step="0.01"
              value="0.01"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Decay</span>
              <span class="label-text-alt" id="dec-display">0.1</span>
            </label>
            <input
              type="range"
              id="inst-dec"
              min="0"
              max="1"
              step="0.01"
              value="0.1"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Sustain</span>
              <span class="label-text-alt" id="sus-display">0.7</span>
            </label>
            <input
              type="range"
              id="inst-sus"
              min="0"
              max="1"
              step="0.01"
              value="0.7"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Release</span>
              <span class="label-text-alt" id="rel-display">0.2</span>
            </label>
            <input
              type="range"
              id="inst-rel"
              min="0"
              max="2"
              step="0.01"
              value="0.2"
              class="range range-xs"
            />
          </div>

          <div class="form-control">
            <label class="label py-1">
              <span class="label-text text-xs">Duty/Pulse Width</span>
              <span class="label-text-alt" id="duty-display">50%</span>
            </label>
            <input
              type="range"
              id="inst-duty"
              min="5"
              max="95"
              step="5"
              value="50"
              class="range range-xs"
            />
          </div>
        </div>
      </div>

      <!-- Note Reference -->
      <div class="p-2 bg-base-200 rounded-lg flex-1">
        <h3 class="font-semibold text-sm mb-2">Notes</h3>
        <div class="text-xs font-mono space-y-1">
          <div class="grid grid-cols-4 gap-1">
            <button class="note-btn btn btn-xs btn-ghost" data-note="C">C</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="C#">C#</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="D">D</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="D#">D#</button>
          </div>
          <div class="grid grid-cols-4 gap-1">
            <button class="note-btn btn btn-xs btn-ghost" data-note="E">E</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="F">F</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="F#">F#</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="G">G</button>
          </div>
          <div class="grid grid-cols-4 gap-1">
            <button class="note-btn btn btn-xs btn-ghost" data-note="G#">G#</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="A">A</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="A#">A#</button>
            <button class="note-btn btn btn-xs btn-ghost" data-note="B">B</button>
          </div>
          <div class="divider my-1">Octave</div>
          <div class="flex gap-1 justify-center">
            <button class="octave-btn btn btn-xs btn-outline" data-octave="2">2</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="3">3</button>
            <button class="octave-btn btn btn-xs btn-outline btn-active" data-octave="4">4</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="5">5</button>
            <button class="octave-btn btn btn-xs btn-outline" data-octave="6">6</button>
          </div>
          <div class="divider my-1">Actions</div>
          <button id="btn-clear-cell" class="btn btn-xs btn-outline w-full">Clear Cell</button>
          <button id="btn-copy-cell" class="btn btn-xs btn-outline w-full">Copy</button>
          <button id="btn-paste-cell" class="btn btn-xs btn-outline w-full">Paste</button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .tracker-cell {
    @apply px-1 py-0.5 text-xs text-center cursor-pointer hover:bg-primary/20 transition-colors;
  }
  .tracker-cell.selected {
    @apply bg-primary text-primary-content;
  }
  .tracker-cell.note-cell {
    @apply font-mono;
  }
  .tracker-cell.empty {
    @apply text-base-content/30;
  }
  #tracker-grid tr:hover .tracker-cell {
    @apply bg-base-300;
  }
  #tracker-grid tr.active-row .tracker-cell:not(.row-num) {
    @apply bg-primary/30;
  }
</style>
