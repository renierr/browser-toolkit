<!--suppress CssUnusedSymbol -->
<style>
  @font-face {
    font-family: 'AmericanSignLanguage';
    src: url('./fonts/AmericanSignLenguage.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  .output-section {
    padding: 1rem;
  }

  .output-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--bc);
    opacity: 0.5;
    margin-bottom: 0.75rem;
  }

  .output-divider {
    height: 1px;
    background-color: var(--b3);
    margin: 0 1rem;
  }

  .output-inline {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .word-space {
    width: 1.5rem;
    height: 2rem;
    border-bottom: 2px dashed var(--b3);
    margin: 0 0.25rem;
  }

  .char-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.125rem;
    padding: 0.375rem;
    border-radius: var(--rounded-btn, 0.5rem);
    background-color: var(--b2);
    min-width: 2.5rem;
  }
  .char-row:hover {
    background-color: var(--b3);
  }
  .char-row .char-letter {
    font-size: 0.625rem;
    font-weight: bold;
    color: var(--bc);
    opacity: 0.6;
  }
  .char-row .char-braille {
    font-size: 1.5rem;
    font-family: monospace;
    color: var(--p);
    line-height: 1;
  }
  .char-row .char-asl {
    font-family: 'AmericanSignLanguage', sans-serif;
    font-size: var(--asl-size, 10rem);
    color: var(--p);
    line-height: 1;
  }

  .mode-btn.active {
    background-color: oklch(var(--p));
    color: oklch(var(--pc));
  }

  .decoded-text {
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: 0.25em;
    color: var(--p);
    padding: 0.5rem 1rem;
    background-color: var(--b2);
    border-radius: var(--rounded-btn, 0.5rem);
  }

  #output-content {
    border: 1px solid var(--b3);
    border-radius: var(--rounded-box, 0.5rem);
    overflow: hidden;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem;
    color: var(--bc);
    opacity: 0.5;
  }
</style>

<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="hand" class="w-6 h-6"></i>
      Braille & Sign Language
    </h2>
    <p class="text-base-content/70 mb-6">
      Visual reference tool translating typed words into Braille patterns and ASL alphabet
      illustrations.
    </p>

    <!-- Settings -->
    <div class="flex items-center justify-between gap-4 mb-6">
      <div class="form-control flex-row items-center gap-3">
        <label class="label py-0">
          <span class="label-text text-sm">ASL Size</span>
        </label>
        <input
          type="range"
          id="asl-size"
          class="range range-primary range-xs w-32"
          min="2"
          max="10"
          value="10"
          step="1"
        />
        <span id="asl-size-value" class="text-sm font-mono w-12">10rem</span>
      </div>
      <div class="form-control flex-row items-center gap-3">
        <span class="label-text text-sm">Decode Mode</span>
        <input type="checkbox" id="mode-decode" class="toggle toggle-primary" />
      </div>
    </div>

    <!-- Input -->
    <div class="form-control w-full mb-6">
      <label class="label mb-2" for="input-text">
        <span class="label-text font-semibold">Your Text</span>
        <button id="btn-clear" class="btn btn-xs btn-ghost">
          <i data-lucide="x" class="w-3 h-3"></i>
          Clear
        </button>
      </label>
      <input
        type="text"
        id="input-text"
        class="input input-bordered w-full"
        placeholder="Type text to translate..."
        autocomplete="off"
      />
    </div>

    <!-- Output -->
    <div id="output-container">
      <div class="label mb-3">
        <span class="label-text font-semibold">Translation</span>
        <button id="btn-copy-braille" class="btn btn-xs btn-ghost hidden">
          <i data-lucide="copy" class="w-3 h-3 mr-1"></i>
          Copy Braille
        </button>
      </div>
      <div id="output-content">
        <div class="empty-state">
          <p>Type text above to see translation</p>
        </div>
      </div>
    </div>

    <div id="status" class="mt-4 text-sm text-base-content/60 text-center"></div>
  </div>
</div>
