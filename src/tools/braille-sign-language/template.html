<!--suppress CssUnusedSymbol -->
{{ style "style.css" }}

<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="hand" class="w-6 h-6"></i>
      Braille & Sign Language
    </h2>
    <p class="text-base-content/70 mb-6">
      Visual reference tool translating typed words into Braille patterns and ASL alphabet
      illustrations.
    </p>

    <!-- Settings -->
    <div class="flex items-center justify-between gap-4 mb-6">
      <div class="form-control flex-row items-center gap-3">
        <label class="label py-0">
          <span class="label-text text-sm">ASL Size</span>
        </label>
        <input
          type="range"
          id="asl-size"
          class="range range-primary range-xs w-32"
          min="2"
          max="10"
          value="10"
          step="1"
        />
        <span id="asl-size-value" class="text-sm font-mono w-12">10rem</span>
      </div>
      <div class="form-control flex-row items-center gap-3">
        <span class="label-text text-sm">Decode Mode</span>
        <input type="checkbox" id="mode-decode" class="toggle toggle-primary" />
      </div>
    </div>

    <!-- Input -->
    <div class="form-control w-full mb-6">
      <label class="label mb-2" for="input-text">
        <span class="label-text font-semibold">Your Text</span>
        <button id="btn-clear" class="btn btn-xs btn-ghost">
          <i data-lucide="x" class="w-3 h-3"></i>
          Clear
        </button>
      </label>
      <input
        type="text"
        id="input-text"
        class="input input-bordered w-full"
        placeholder="Type text to translate..."
        autocomplete="off"
      />
    </div>

    <!-- Output -->
    <div id="output-container">
      <div class="label mb-3">
        <span class="label-text font-semibold">Translation</span>
        <button id="btn-copy-braille" class="btn btn-xs btn-ghost hidden">
          <i data-lucide="copy" class="w-3 h-3 mr-1"></i>
          Copy Braille
        </button>
      </div>
      <div id="output-content">
        <div class="empty-state">
          <p>Type text above to see translation</p>
        </div>
      </div>
    </div>

    <div id="status" class="mt-4 text-sm text-base-content/60 text-center"></div>
  </div>
</div>
