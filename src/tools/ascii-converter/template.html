<div id="ascii-converter-container" class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">
      <i data-lucide="image" class="w-6 h-6"></i>
      ASCII Art Generator
    </h2>
    <p class="text-base-content/70 mb-6">
      Convert images into text symbols. Dark pixels map to characters like @ or #, bright pixels map
      to . or spaces.
    </p>

    <div
      id="dropzone"
      class="mt-2 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3 min-h-40 group hover:bg-base-300"
    >
      <div
        class="flex flex-col items-center gap-2 text-center transition-transform group-hover:scale-105"
      >
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag an image here</p>
        <p class="text-sm text-base-content/50">Supports JPG, PNG, WebP</p>
        <button id="paste-btn" class="btn btn-outline flex-1 sm:flex-none">
          <i data-lucide="clipboard" class="w-4 h-4 mr-2"></i>
          or click here to Paste from clipboard
        </button>
      </div>
      <input type="file" id="image-input" class="hidden" accept="image/*" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-6">
      <label class="form-control w-full" for="ascii-width">
        <span class="label-text font-semibold mb-1">Output Width</span>
        <input
          id="ascii-width"
          data-setting="width"
          type="number"
          min="20"
          max="300"
          value="120"
          class="input input-bordered input-sm w-full"
        />
      </label>

      <label class="form-control w-full" for="charset-preset">
        <span class="label-text font-semibold mb-1">Style Preset</span>
        <select
          id="charset-preset"
          data-setting="preset"
          class="select select-bordered select-sm w-full"
        >
          <option value="photo-soft" selected>Photo Soft</option>
          <option value="photo-detailed">Photo Detailed</option>
          <option value="terminal-classic">Terminal Classic</option>
          <option value="binary-bold">Binary Bold</option>
          <option value="blueprint">Blueprint</option>
          <option value="outline">Outline</option>
          <option value="minimal">Minimal</option>
          <option value="dots">Dots</option>
        </select>
      </label>

      <label class="form-control w-full" for="custom-charset">
        <span class="label-text font-semibold mb-1">Custom Charset</span>
        <input
          id="custom-charset"
          data-setting="customCharset"
          type="text"
          class="input input-bordered input-sm w-full font-mono"
          placeholder="Override preset"
        />
      </label>

      <label class="label cursor-pointer justify-start gap-3 pt-7" for="invert-map">
        <input id="invert-map" data-setting="invert" type="checkbox" class="checkbox checkbox-sm" />
        <span class="label-text">Invert mapping</span>
      </label>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mt-4">
      <label class="form-control w-full" for="gamma-range">
        <span class="label-text text-xs">Gamma: <span id="gamma-value">1.00</span></span>
        <input
          id="gamma-range"
          data-setting="gamma"
          type="range"
          min="0.5"
          max="2"
          step="0.05"
          value="1"
          class="range range-sm"
        />
      </label>

      <label class="form-control w-full" for="contrast-range">
        <span class="label-text text-xs">Contrast: <span id="contrast-value">1.10</span></span>
        <input
          id="contrast-range"
          data-setting="contrast"
          type="range"
          min="0.5"
          max="2"
          step="0.05"
          value="1.1"
          class="range range-sm"
        />
      </label>

      <label class="form-control w-full" for="brightness-range">
        <span class="label-text text-xs">Brightness: <span id="brightness-value">0.00</span></span>
        <input
          id="brightness-range"
          data-setting="brightness"
          type="range"
          min="-0.4"
          max="0.4"
          step="0.01"
          value="0"
          class="range range-sm"
        />
      </label>

      <label class="form-control w-full" for="edge-range">
        <span class="label-text text-xs">Edge boost: <span id="edge-value">0.00</span></span>
        <input
          id="edge-range"
          data-setting="edgeWeight"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0"
          class="range range-sm"
        />
      </label>

      <label class="form-control w-full" for="aspect-range">
        <span class="label-text text-xs">Font aspect: <span id="aspect-value">0.52</span></span>
        <input
          id="aspect-range"
          data-setting="fontAspect"
          type="range"
          min="0.4"
          max="0.7"
          step="0.01"
          value="0.52"
          class="range range-sm"
        />
      </label>
    </div>

    <div class="flex flex-wrap gap-4 mt-2">
      <label class="label cursor-pointer gap-2" for="auto-contrast">
        <input
          id="auto-contrast"
          data-setting="autoContrast"
          type="checkbox"
          class="checkbox checkbox-xs"
          checked
        />
        <span class="label-text text-sm">Auto contrast</span>
      </label>
      <label class="label cursor-pointer gap-2" for="dither-map">
        <input
          id="dither-map"
          data-setting="dithering"
          type="checkbox"
          class="checkbox checkbox-xs"
        />
        <span class="label-text text-sm">Dithering</span>
      </label>
      <button id="reset-options-btn" class="btn btn-ghost btn-xs ml-auto" type="button">
        Reset defaults
      </button>
    </div>

    <div class="mt-4 text-sm text-base-content/60" id="status">
      Upload or paste an image to begin.
    </div>

    <div class="form-control w-full mt-4">
      <label class="label" for="ascii-output">
        <span class="label-text font-semibold">ASCII Output</span>
      </label>
      <pre
        id="ascii-output"
        class="w-full p-4 bg-base-200 rounded-lg border border-base-300 font-mono text-[10px] leading-none whitespace-pre overflow-x-auto min-h-64"
      ></pre>
    </div>

    <div class="card-actions justify-center mt-4 gap-2">
      <button id="copy-btn" class="btn btn-outline flex-1 sm:flex-none" disabled>
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="download-btn" class="btn btn-outline flex-1 sm:flex-none" disabled>
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download .txt
      </button>
    </div>
  </div>
</div>
