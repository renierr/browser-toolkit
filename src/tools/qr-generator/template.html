<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">QR Code Generator</h2>
    <p class="text-base-content/70 mb-6">Enter text or a URL to generate a QR code.</p>

    <div class="form-control w-full mb-4">
      <label class="label" for="qr-content">
        <span class="label-text font-semibold">Content</span>
      </label>
      <textarea
        id="qr-content"
        class="textarea textarea-bordered h-24 w-full"
        placeholder="https://example.com"
      ></textarea>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="form-control w-full">
        <label class="label" for="qr-size">
          <span class="label-text font-semibold">Size (px)</span>
        </label>
        <input
          id="qr-size"
          data-setting="qr-size"
          type="number"
          value="300"
          min="100"
          max="1000"
          step="10"
          class="input input-bordered w-full"
        />
      </div>
      <div class="form-control w-full">
        <label class="label" for="qr-margin">
          <span class="label-text font-semibold">Margin</span>
        </label>
        <input
          id="qr-margin"
          data-setting="qr-margin"
          type="number"
          value="4"
          min="0"
          max="10"
          class="input input-bordered w-full"
        />
      </div>
      <div class="form-control w-full">
        <label class="label" for="qr-color-dark">
          <span class="label-text font-semibold">Dark Color</span>
        </label>
        <input
          id="qr-color-dark"
          data-setting="qr-color-dark"
          type="color"
          value="#000000"
          class="input input-bordered w-full h-12 p-1"
        />
      </div>
      <div class="form-control w-full">
        <label class="label" for="qr-color-light">
          <span class="label-text font-semibold">Light Color</span>
        </label>
        <input
          id="qr-color-light"
          data-setting="qr-color-light"
          type="color"
          value="#ffffff"
          class="input input-bordered w-full h-12 p-1"
        />
      </div>
    </div>

    <div class="card-actions justify-end mt-6 gap-2">
      <button id="copy-qr" class="btn btn-outline hidden">
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy to Clipboard
      </button>
      <button id="share-qr" class="btn btn-outline hidden">
        <i data-lucide="share2" class="w-4 h-4 mr-2"></i>
        Share
      </button>
      <button id="download-qr" class="btn btn-primary hidden">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download PNG
      </button>
    </div>
  </div>
</div>
<div id="qr-output-container" class="mt-8 flex justify-center bg-base-200 p-4 rounded-lg hidden">
  <canvas id="qr-canvas-output" class="max-w-full h-auto"></canvas>
</div>
