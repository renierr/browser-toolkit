<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">PDF Image Extractor</h2>
    <p class="text-base-content/70 mb-6">Extract all embedded images from one or more PDF files.</p>

    <div id="pdf-dropzone"
         class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3">
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag PDF(s) here</p>
      </div>
      <input type="file" id="pdf-file" class="hidden" accept="application/pdf" multiple />
    </div>

    <div id="image-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-8">
      <!-- Extracted images will be added here -->
    </div>

    <div id="actions" class="card-actions justify-end mt-6 hidden">
      <button id="clear-btn" class="btn btn-secondary">Clear All</button>
      <button id="download-all-btn" class="btn btn-primary">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Download All (0)
      </button>
    </div>
  </div>
</div>
