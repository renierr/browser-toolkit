<div id="pdf-metadata-card" class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">PDF Metadata Viewer</h2>
    <p class="text-base-content/70 mb-6">
      Upload a PDF to see its internal metadata and properties.
    </p>

    <div
      id="pdf-dropzone"
      class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3 min-h-40 group hover:bg-base-300"
    >
      <div
        class="flex flex-col items-center gap-2 text-center transition-transform group-hover:scale-105"
      >
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag PDF here</p>
      </div>
      <input type="file" id="pdf-file" class="hidden" accept="application/pdf" />
    </div>

    <div id="metadata-results" class="hidden mt-8 space-y-6">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-semibold">Metadata Results</h3>
        <button id="reset-btn" class="btn btn-ghost btn-sm">
          <i data-lucide="refresh-cw" class="w-4 h-4 mr-2"></i>
          Start Over
        </button>
      </div>

      <div
        id="thumbnail-container"
        class="hidden flex flex-wrap justify-center gap-4 p-6 bg-base-200 rounded-xl border border-base-300"
      >
        <span
          class="w-full text-center text-xs font-bold uppercase tracking-wider mb-2 text-base-content/70"
          >Document Thumbnail</span
        >
        <!-- Thumbnail will be inserted here -->
      </div>

      <div class="overflow-x-auto">
        <table class="table table-zebra w-full border">
          <thead>
            <tr>
              <th class="w-1/3">Property</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="metadata-table-body">
            <!-- Rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
