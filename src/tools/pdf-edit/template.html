<div id="pdf-edit-tool-card" class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">PDF Editor</h2>
    <p class="text-base-content/70 mb-6">Select or drag and drop a PDF file to edit.</p>

    <div id="pdf-dropzone"
         class="mt-4 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer bg-base-200 dark:bg-gray-800 dark:border-gray-600 transition-colors p-3">
      <div class="flex flex-col items-center gap-2">
        <div class="text-base-content/30 text-4xl">
          <i data-lucide="upload-cloud"></i>
        </div>
        <p class="text-lg font-medium">Click or drag PDF here</p>
      </div>
      <input type="file" id="pdf-file" class="hidden" accept="application/pdf" />
    </div>
  </div>
</div>

<div id="pdf-viewer-container" class="hidden w-full flex-1 min-h-0 h-full mt-4">
  <!--suppress HtmlUnknownTarget -->
  <iframe id="pdf-viewer-iframe" src="./pdfjs/web/viewer.html" class="flex-1 w-full h-0 min-h-0" style="border:0;"></iframe>
</div>

<style>
  #pdf-viewer-container:not(.hidden) {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
  }
  #pdf-viewer-container:not(.hidden) #pdf-viewer-iframe {
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
  }
</style>
