<div class="flex flex-col h-full max-h-[calc(100vh-8rem)]">

  <div id="upload-container" class="flex flex-col items-center justify-center flex-1 p-8 border-2 border-dashed rounded-xl border-base-300 bg-base-100 hover:border-primary transition-colors cursor-pointer select-none">
    <div class="text-center pointer-events-none">
      <div class="bg-base-200 p-4 rounded-full inline-block mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
      </div>
      <h3 class="text-xl font-bold">Bild hier ablegen</h3>
      <p class="text-base-content/60 mt-2">oder tippen zum Auswählen</p>
    </div>
    <input type="file" id="file-input" accept="image/*" class="hidden" />
  </div>

  <div id="editor-container" class="hidden flex-col h-full gap-4 relative">

    <div class="navbar bg-base-200 rounded-box shadow-sm z-20 p-2 min-h-0">
      <div class="flex-1 overflow-x-auto no-scrollbar gap-2 items-center">

        <button class="btn btn-sm join-item" id="btn-tool-crop" data-tool="crop" title="Zuschneiden Modus">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
          Crop
        </button>

        <div class="divider divider-horizontal mx-1"></div>

        <div class="join">
          <button class="btn btn-sm join-item btn-active" data-tool="pixelate">Pixel</button>
          <button class="btn btn-sm join-item" data-tool="blur">Blur</button>
          <button class="btn btn-sm join-item" data-tool="fill">Solid</button>
        </div>

        <div class="divider divider-horizontal mx-1"></div>

        <button class="btn btn-sm btn-ghost" id="btn-undo" disabled title="Undo">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
      </div>

      <div class="flex-none gap-2">
        <button class="btn btn-sm btn-ghost text-error" id="btn-reset">Reset</button>
        <button class="btn btn-sm btn-primary" id="btn-download">Save</button>
      </div>
    </div>

    <div class="relative flex-1 bg-base-200/50 rounded-xl overflow-hidden flex items-center justify-center border border-base-300 shadow-inner select-none" id="canvas-wrapper">
      <canvas id="editor-canvas" class="shadow-lg touch-none max-w-full max-h-full cursor-crosshair"></canvas>

      <div id="crop-actions" class="absolute bottom-4 z-30 hidden gap-2">
        <button id="btn-cancel-crop" class="btn btn-circle btn-sm btn-error text-white shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button id="btn-apply-crop" class="btn btn-md btn-success text-white shadow-lg gap-2 px-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Apply Crop
        </button>
      </div>
    </div>

    <div class="text-center text-xs text-base-content/50 pb-2" id="hint-text">
      Wähle ein Werkzeug und ziehe auf dem Bild.
    </div>
  </div>
</div>
