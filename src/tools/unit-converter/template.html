<div id="unit-converter" class="min-h-screen bg-base-100 p-2 sm:p-4">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-base-content flex items-center gap-2">
        <i data-lucide="ruler" class="w-6 h-6"></i>
        Unit Converter Pro
      </h1>
      <div class="flex gap-2">
        <button
          id="uc-calc-toggle"
          class="btn btn-sm btn-ghost lg:hidden"
          aria-label="Toggle calculator"
        >
          <i data-lucide="calculator" class="w-4 h-4"></i>
        </button>
        <button id="uc-history-toggle" class="btn btn-sm btn-ghost" aria-label="Toggle history">
          <i data-lucide="history" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Converter Panel -->
      <div id="uc-converter-panel" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <!-- Category Tabs -->
          <div class="relative">
            <div
              id="uc-category-scroll"
              class="flex gap-1 overflow-x-auto pb-2 scrollbar-hide"
              role="tablist"
            >
              <!-- Categories injected here -->
            </div>
          </div>

          <!-- From/To Section -->
          <div class="space-y-3 mt-2">
            <!-- From -->
            <div class="form-control">
              <label class="label py-1">
                <span class="label-text text-xs font-semibold uppercase tracking-wide">From</span>
              </label>
              <div class="flex gap-2">
                <div class="dropdown dropdown-end flex-1">
                  <label
                    tabindex="0"
                    class="btn btn-outline w-full justify-between text-left"
                    id="uc-from-unit-btn"
                  >
                    <span id="uc-from-unit-label" class="truncate">Select unit</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 ml-2 shrink-0"></i>
                  </label>
                  <div
                    tabindex="0"
                    class="dropdown-content z-30 mt-1 w-72 shadow-lg rounded-box bg-base-100 border border-base-300"
                  >
                    <div class="p-2">
                      <input
                        type="text"
                        id="uc-from-search"
                        placeholder="Search units..."
                        class="input input-bordered input-sm w-full mb-2"
                      />
                      <div id="uc-from-unit-list" class="max-h-60 overflow-y-auto space-y-0.5">
                        <!-- Units injected here -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Swap Button -->
            <div class="flex justify-center">
              <button
                id="uc-swap"
                class="btn btn-circle btn-sm btn-primary"
                aria-label="Swap units"
              >
                <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- To -->
            <div class="form-control">
              <label class="label py-1">
                <span class="label-text text-xs font-semibold uppercase tracking-wide">To</span>
              </label>
              <div class="flex gap-2">
                <div class="dropdown dropdown-end flex-1">
                  <label
                    tabindex="0"
                    class="btn btn-outline w-full justify-between text-left"
                    id="uc-to-unit-btn"
                  >
                    <span id="uc-to-unit-label" class="truncate">Select unit</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 ml-2 shrink-0"></i>
                  </label>
                  <div
                    tabindex="0"
                    class="dropdown-content z-30 mt-1 w-72 shadow-lg rounded-box bg-base-100 border border-base-300"
                  >
                    <div class="p-2">
                      <input
                        type="text"
                        id="uc-to-search"
                        placeholder="Search units..."
                        class="input input-bordered input-sm w-full mb-2"
                      />
                      <div id="uc-to-unit-list" class="max-h-60 overflow-y-auto space-y-0.5">
                        <!-- Units injected here -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Input Field -->
            <div class="form-control">
              <label class="label py-1">
                <span class="label-text text-xs font-semibold uppercase tracking-wide">Value</span>
              </label>
              <input
                type="text"
                id="uc-input"
                inputmode="decimal"
                placeholder="Enter value"
                class="input input-bordered input-lg w-full font-mono text-lg"
                aria-label="Conversion input value"
              />
            </div>

            <!-- Result -->
            <div class="card bg-base-100 border border-base-300">
              <div class="card-body p-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs text-base-content/60">Result</span>
                  <button
                    id="uc-favorite"
                    class="btn btn-ghost btn-xs btn-circle"
                    aria-label="Toggle favorite"
                  >
                    <i data-lucide="star" class="w-4 h-4 uc-fav-icon"></i>
                  </button>
                </div>
                <div
                  id="uc-result"
                  class="text-2xl font-mono font-bold text-primary truncate min-h-8"
                >
                  —
                </div>
                <div
                  id="uc-formula"
                  class="text-xs text-base-content/50 font-mono truncate min-h-4"
                >
                  Enter a value to convert
                </div>
                <div
                  id="uc-volatility-warning"
                  class="alert alert-warning py-2 px-3 mt-2 text-xs hidden"
                  role="status"
                  aria-live="polite"
                >
                  <i data-lucide="triangle-alert" class="w-3.5 h-3.5"></i>
                  <span id="uc-volatility-warning-text"></span>
                </div>
                <div id="uc-currency-live-controls" class="mt-2 hidden">
                  <div class="flex items-center gap-2">
                    <button
                      id="uc-currency-refresh"
                      class="btn btn-xs btn-outline gap-1"
                      type="button"
                    >
                      <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                      Refresh rates
                    </button>
                    <button id="uc-currency-rates-open" class="btn btn-xs btn-ghost" type="button">
                      View loaded rates
                    </button>
                    <span id="uc-currency-updated" class="text-xs text-base-content/60"></span>
                  </div>
                </div>
                <div class="flex gap-2 mt-2">
                  <button id="uc-copy-result" class="btn btn-ghost btn-xs gap-1">
                    <i data-lucide="copy" class="w-3 h-3"></i>
                    Copy
                  </button>
                  <button id="uc-use-calc" class="btn btn-ghost btn-xs gap-1 hidden">
                    <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    Use calculator result
                  </button>
                </div>
              </div>
            </div>

            <!-- Batch Conversion Table -->
            <div class="collapse collapse-arrow bg-base-100 border border-base-300">
              <input type="checkbox" />
              <div class="collapse-title text-sm font-medium">Batch Conversion Table</div>
              <div class="collapse-content">
                <div id="uc-batch-table" class="overflow-x-auto">
                  <table class="table table-xs w-full">
                    <thead>
                      <tr>
                        <th>Unit</th>
                        <th class="text-right">Value</th>
                      </tr>
                    </thead>
                    <tbody id="uc-batch-body">
                      <!-- Batch rows injected here -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Calculator Panel -->
      <div
        id="uc-calc-panel"
        class="card bg-base-200 shadow-sm hidden lg:block rounded-3xl border border-base-300 overflow-hidden"
      >
        <div class="card-body p-4">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-lg font-bold flex items-center gap-2">
              <i data-lucide="calculator" class="w-5 h-5"></i>
              Calculator
            </h2>
            <div class="flex gap-1">
              <button id="uc-calc-sci-toggle" class="btn btn-xs btn-ghost rounded-xl">SCI</button>
              <button id="uc-calc-close" class="btn btn-xs btn-ghost lg:hidden">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Calculator Display -->
          <div
            id="uc-calc-display"
            class="bg-base-100 rounded-2xl p-3 mb-3 font-mono text-right min-h-16 flex flex-col justify-end border border-base-300"
            aria-label="Calculator display"
          >
            <div id="uc-calc-last-op" class="text-xs text-base-content/50 min-h-4"></div>
            <div
              id="uc-calc-current"
              contenteditable="true"
              inputmode="decimal"
              class="text-xl font-bold truncate"
            >
              0
            </div>
          </div>

          <!-- Scientific Buttons (hidden by default) -->
          <div id="uc-calc-sci-buttons" class="hidden grid grid-cols-4 gap-2 mb-3">
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="sin(">sin(</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="cos(">cos(</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="tan(">tan(</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="log(">log</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="ln(">ln</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="sqrt(">√</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="^">xʸ</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="PI">π</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="E">e</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="abs(">|x|</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val="(">(</button>
            <button class="btn btn-xs btn-neutral rounded-xl" data-calc-val=")">)</button>
          </div>

          <!-- Calculator Buttons -->
          <div class="grid grid-cols-4 gap-2">
            <button
              class="btn btn-sm btn-error btn-outline rounded-2xl font-bold"
              id="uc-calc-clear"
            >
              AC
            </button>
            <button class="btn btn-sm btn-neutral rounded-2xl" id="uc-calc-backspace">
              <i data-lucide="delete" class="w-4 h-4"></i>
            </button>
            <button class="btn btn-sm btn-neutral rounded-2xl" id="uc-calc-bracket">( )</button>
            <button class="btn btn-sm btn-primary rounded-2xl font-bold" data-calc-val="÷">
              ÷
            </button>

            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="7">7</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="8">8</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="9">9</button>
            <button class="btn btn-sm btn-primary rounded-2xl font-bold" data-calc-val="×">
              ×
            </button>

            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="4">4</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="5">5</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="6">6</button>
            <button class="btn btn-sm btn-primary rounded-2xl font-bold" data-calc-val="-">
              −
            </button>

            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="1">1</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="2">2</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="3">3</button>
            <button class="btn btn-sm btn-primary rounded-2xl font-bold" data-calc-val="+">
              +
            </button>

            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val="0">0</button>
            <button class="btn btn-sm btn-base-300 rounded-2xl" data-calc-val=".">.</button>
            <button class="btn btn-sm btn-neutral rounded-2xl" id="uc-calc-copy">
              <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
            <button
              class="btn btn-sm btn-success text-success-content rounded-2xl font-bold"
              id="uc-calc-equals"
            >
              =
            </button>
          </div>

          <!-- Send to Converter -->
          <button id="uc-calc-send" class="btn btn-sm btn-outline rounded-2xl w-full mt-3 gap-2">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
            Send result to converter
          </button>
        </div>
      </div>
    </div>

    <!-- Custom Unit Creator Button -->
    <div class="mt-4 flex justify-center">
      <button id="uc-custom-unit-btn" class="btn btn-outline btn-sm gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        Create Custom Unit
      </button>
    </div>

    <!-- History Panel (slide-over on mobile, inline on desktop) -->
    <div
      id="uc-history-panel"
      class="fixed inset-y-0 right-0 z-40 w-full max-w-sm bg-base-100 shadow-xl transform translate-x-full transition-transform duration-300 lg:relative lg:transform-none lg:translate-x-0 lg:shadow-none lg:z-auto lg:max-w-none lg:mt-4"
    >
      <div class="card bg-base-200 shadow-sm h-full lg:h-auto">
        <div class="card-body p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold flex items-center gap-2">
              <i data-lucide="history" class="w-5 h-5"></i>
              History
            </h2>
            <div class="flex gap-1">
              <button id="uc-history-close" class="btn btn-xs btn-ghost lg:hidden">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- History Controls -->
          <div class="flex gap-2 mb-3">
            <input
              type="text"
              id="uc-history-search"
              placeholder="Search history..."
              class="input input-bordered input-sm flex-1"
            />
            <button id="uc-history-export-json" class="btn btn-sm btn-ghost" title="Export JSON">
              <i data-lucide="download" class="w-4 h-4"></i>
            </button>
            <button id="uc-history-export/csv" class="btn btn-sm btn-ghost" title="Export CSV">
              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            </button>
            <button
              id="uc-history-clear"
              class="btn btn-sm btn-ghost btn-error"
              title="Clear history"
            >
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- History List -->
          <div id="uc-history-list" class="space-y-2 max-h-64 lg:max-h-96 overflow-y-auto">
            <div class="text-center text-base-content/40 py-8">No conversions yet</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Unit Modal -->
    <dialog id="uc-custom-modal" class="modal">
      <div class="modal-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          Create Custom Unit
        </h3>
        <form id="uc-custom-form" class="space-y-3">
          <div class="form-control">
            <label class="label"><span class="label-text">Unit Name</span></label>
            <input
              type="text"
              id="uc-custom-name"
              class="input input-bordered"
              placeholder="e.g., My Unit"
              required
            />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text">Symbol</span></label>
            <input
              type="text"
              id="uc-custom-symbol"
              class="input input-bordered"
              placeholder="e.g., mu"
              required
            />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text">Category</span></label>
            <select id="uc-custom-category" class="select select-bordered" required>
              <!-- Categories injected here -->
            </select>
          </div>
          <div class="form-control">
            <label class="label"
              ><span class="label-text">Conversion Factor (to base unit)</span></label
            >
            <input
              type="number"
              id="uc-custom-factor"
              class="input input-bordered"
              placeholder="e.g., 1000"
              step="any"
              required
            />
            <label class="label"
              ><span class="label-text-alt">Value × this factor = base unit value</span></label
            >
          </div>
          <div class="modal-action">
            <button
              type="button"
              class="btn btn-ghost"
              onclick="document.getElementById('uc-custom-modal').close()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Create Unit</button>
          </div>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <dialog id="uc-currency-rates-modal" class="modal">
      <div class="modal-box max-w-2xl">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">x</button>
        </form>
        <h3 class="text-lg font-bold mb-2">Loaded Currency Rates</h3>
        <p id="uc-currency-rates-meta" class="text-sm text-base-content/70 mb-3"></p>
        <div class="overflow-x-auto max-h-96">
          <table class="table table-xs w-full">
            <thead>
              <tr>
                <th>Currency</th>
                <th class="text-right">1 Unit in USD</th>
              </tr>
            </thead>
            <tbody id="uc-currency-rates-body"></tbody>
          </table>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>
  </div>
</div>
