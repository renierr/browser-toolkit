<div id="unit-converter" class="min-h-screen bg-base-100 p-2 sm:p-4">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-base-content flex items-center gap-2">
        <i data-lucide="ruler" class="w-6 h-6"></i>
        Unit Converter Pro
      </h1>
      <div class="flex gap-2">
        <button
          id="uc-calc-toggle"
          class="btn btn-sm btn-ghost lg:hidden"
          aria-label="Toggle calculator"
        >
          <i data-lucide="calculator" class="w-4 h-4"></i>
        </button>
        <button id="uc-history-toggle" class="btn btn-sm btn-ghost" aria-label="Toggle history">
          <i data-lucide="history" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Converter Panel -->
      <div id="uc-converter-panel" class="card bg-base-200 shadow-sm">
        <div class="card-body p-4">
          <!-- Category Tabs -->
          <div class="relative">
            <div
              id="uc-category-scroll"
              class="flex gap-1 overflow-x-auto pb-2 scrollbar-hide"
              role="tablist"
            >
              <!-- Categories injected here -->
            </div>
          </div>

          <!-- From/To Section -->
          <div class="space-y-3 mt-2">
            <!-- From -->
            <div class="form-control">
              <label class="label py-1">
                <span class="label-text text-xs font-semibold uppercase tracking-wide">From</span>
              </label>
              <div class="flex gap-2">
                <div class="dropdown dropdown-end flex-1">
                  <label
                    tabindex="0"
                    class="btn btn-outline w-full justify-between text-left"
                    id="uc-from-unit-btn"
                  >
                    <span id="uc-from-unit-label" class="truncate">Select unit</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 ml-2 shrink-0"></i>
                  </label>
                  <div
                    tabindex="0"
                    class="dropdown-content z-30 mt-1 w-72 shadow-lg rounded-box bg-base-100 border border-base-300"
                  >
                    <div class="p-2">
                      <input
                        type="text"
                        id="uc-from-search"
                        placeholder="Search units..."
                        class="input input-bordered input-sm w-full mb-2"
                      />
                      <div id="uc-from-unit-list" class="max-h-60 overflow-y-auto space-y-0.5">
                        <!-- Units injected here -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Swap Button -->
            <div class="flex justify-center">
              <button
                id="uc-swap"
                class="btn btn-circle btn-sm btn-primary"
                aria-label="Swap units"
              >
                <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- To -->
            <div class="form-control">
              <label class="label py-1">
                <span class="label-text text-xs font-semibold uppercase tracking-wide">To</span>
              </label>
              <div class="flex gap-2">
                <div class="dropdown dropdown-end flex-1">
                  <label
                    tabindex="0"
                    class="btn btn-outline w-full justify-between text-left"
                    id="uc-to-unit-btn"
                  >
                    <span id="uc-to-unit-label" class="truncate">Select unit</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 ml-2 shrink-0"></i>
                  </label>
                  <div
                    tabindex="0"
                    class="dropdown-content z-30 mt-1 w-72 shadow-lg rounded-box bg-base-100 border border-base-300"
                  >
                    <div class="p-2">
                      <input
                        type="text"
                        id="uc-to-search"
                        placeholder="Search units..."
                        class="input input-bordered input-sm w-full mb-2"
                      />
                      <div id="uc-to-unit-list" class="max-h-60 overflow-y-auto space-y-0.5">
                        <!-- Units injected here -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Input Field -->
            <div class="form-control">
              <label class="label py-1">
                <span class="label-text text-xs font-semibold uppercase tracking-wide">Value</span>
              </label>
              <input
                type="text"
                id="uc-input"
                inputmode="decimal"
                placeholder="Enter value"
                class="input input-bordered input-lg w-full font-mono text-lg"
                aria-label="Conversion input value"
              />
            </div>

            <!-- Result -->
            <div class="card bg-base-100 border border-base-300">
              <div class="card-body p-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs text-base-content/60">Result</span>
                  <button
                    id="uc-favorite"
                    class="btn btn-ghost btn-xs btn-circle"
                    aria-label="Toggle favorite"
                  >
                    <i data-lucide="star" class="w-4 h-4 uc-fav-icon"></i>
                  </button>
                </div>
                <div
                  id="uc-result"
                  class="text-2xl font-mono font-bold text-primary truncate min-h-8"
                >
                  —
                </div>
                <div
                  id="uc-formula"
                  class="text-xs text-base-content/50 font-mono truncate min-h-4"
                >
                  Enter a value to convert
                </div>
                <div
                  id="uc-volatility-warning"
                  class="alert alert-warning py-2 px-3 mt-2 text-xs hidden"
                  role="status"
                  aria-live="polite"
                >
                  <i data-lucide="triangle-alert" class="w-3.5 h-3.5"></i>
                  <span id="uc-volatility-warning-text"></span>
                </div>
                <div id="uc-currency-live-controls" class="mt-2 hidden">
                  <div class="flex items-center gap-2">
                    <button
                      id="uc-currency-refresh"
                      class="btn btn-xs btn-outline gap-1"
                      type="button"
                    >
                      <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                      Refresh rates
                    </button>
                    <button id="uc-currency-rates-open" class="btn btn-xs btn-ghost" type="button">
                      View loaded rates
                    </button>
                    <span id="uc-currency-updated" class="text-xs text-base-content/60"></span>
                  </div>
                </div>
                <div class="flex gap-2 mt-2">
                  <button id="uc-copy-result" class="btn btn-ghost btn-xs gap-1">
                    <i data-lucide="copy" class="w-3 h-3"></i>
                    Copy
                  </button>
                  <button id="uc-use-calc" class="btn btn-ghost btn-xs gap-1 hidden">
                    <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    Use calculator result
                  </button>
                </div>
              </div>
            </div>

            <!-- Batch Conversion Table -->
            <div class="collapse collapse-arrow bg-base-100 border border-base-300">
              <input type="checkbox" />
              <div class="collapse-title text-sm font-medium">Batch Conversion Table</div>
              <div class="collapse-content">
                <div id="uc-batch-table" class="overflow-x-auto">
                  <table class="table table-xs w-full">
                    <thead>
                      <tr>
                        <th>Unit</th>
                        <th class="text-right">Value</th>
                      </tr>
                    </thead>
                    <tbody id="uc-batch-body">
                      <!-- Batch rows injected here -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Calculator Panel -->
      {{ include "calculator.html" }}
    </div>

    <!-- Custom Unit Creator Button -->
    <div class="mt-4 flex justify-center">
      <button id="uc-custom-unit-btn" class="btn btn-outline btn-sm gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        Create Custom Unit
      </button>
    </div>

    <!-- History Panel (slide-over on mobile, inline on desktop) -->
    {{ include "history.html" }} {{ include "modals.html" }}
  </div>
</div>
