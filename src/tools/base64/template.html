<div class="card bg-base-100 shadow-xl border">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">Base64 Encoder / Decoder</h2>
    <p class="text-base-content/70 mb-6">Encode text to Base64 or decode Base64 back to plain text.</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Input Section -->
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Input</span>
        </label>
        <textarea id="input-text" class="textarea textarea-bordered h-48 font-mono text-sm w-full"
                  placeholder="Type or paste content here..."></textarea>
        <div class="label">
          <span class="label-text-alt" id="input-stats">0 chars</span>
        </div>
      </div>

      <!-- Output Section -->
      <div class="form-control w-full">
        <label class="label">
          <span class="label-text font-semibold">Output</span>
        </label>
        <textarea id="output-text" class="textarea textarea-bordered h-48 font-mono text-sm bg-base-200 w-full" readonly
                  placeholder="Result will appear here..."></textarea>
        <div class="label">
          <span class="label-text-alt" id="output-stats">0 chars</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="card-actions justify-center mt-6 gap-2">
      <button id="btn-encode" class="btn btn-primary flex-1 sm:flex-none">
        Encode
        <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
      </button>
      <button id="btn-decode" class="btn btn-secondary flex-1 sm:flex-none">
        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
        Decode
      </button>
      <button id="btn-copy" class="btn btn-outline flex-1 sm:flex-none">
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy
      </button>
      <button id="btn-clear" class="btn btn-ghost flex-1 sm:flex-none">Clear</button>
    </div>
  </div>
</div>
