<div class="flex flex-col gap-6 max-w-4xl mx-auto">
  <div class="card bg-base-100 shadow-md p-6">
    <h2 class="text-xl font-bold mb-4">Signature Creator</h2>
    <p class="text-base-content/70 mb-6">
      Draw your signature in the canvas below.<br />
      Curve mode and DPI settings will also apply to saved signatures when downloading.
    </p>
    <div class="flex flex-wrap gap-4 mb-4 items-start">
      <div class="form-control">
        <label class="label py-0" for="stroke-width">
          <span class="label-text text-xs"
            >Width: <span id="width-value" class="inline-block w-3">2</span></span
          >
        </label>
        <input
          type="range"
          id="stroke-width"
          min="1"
          max="12"
          value="4"
          class="range range-xs range-primary"
        />
      </div>
      <div class="form-control">
        <label class="label py-0 block" for="stroke-color">
          <span class="label-text text-xs">Color</span>
        </label>
        <input
          type="color"
          id="stroke-color"
          class="input input-bordered p-1 w-12 h-10"
          value="#0B3D91"
        />
      </div>
      <div class="form-control">
        <label class="label py-0" for="export-dpi">
          <span class="label-text text-xs">PNG Export DPI</span>
        </label>
        <input type="number" id="export-dpi" value="72" class="input" />
      </div>
    </div>

    <!-- Advanced stroke settings (collapsible, initially closed) -->
    <include src="advanced-settings.html" />

    <div
      id="canvas-container"
      class="relative border-2 border-dashed border-base-300 rounded-lg w-full"
    >
      <canvas
        id="signature-canvas"
        class="cursor-crosshair w-full h-full checkerboard-bg"
        style="aspect-ratio: 16 / 6"
      ></canvas>
    </div>

    <div class="flex flex-wrap gap-2 mt-4">
      <button id="clear-btn" class="btn btn-outline btn-error btn-sm">
        <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> Clear
      </button>
      <button id="undo-btn" class="btn btn-ghost btn-sm" title="Undo (Ctrl+Z)">
        <i data-lucide="corner-left-down" class="w-4 h-4 mr-1"></i> Undo
      </button>
      <button id="redo-btn" class="btn btn-ghost btn-sm" title="Redo (Ctrl+Y)">
        <i data-lucide="corner-right-up" class="w-4 h-4 mr-1"></i> Redo
      </button>
      <div class="sm:grow"></div>

      <button id="copy-clipboard" class="btn btn-ghost btn-sm">
        <i data-lucide="copy" class="w-4 h-4 mr-2"></i>
        Copy to Clipboard
      </button>

      <!-- Direct download PNG -->
      <button id="download-current-png-btn" class="btn btn-ghost btn-sm" title="Download PNG">
        <i data-lucide="download" class="w-4 h-4 mr-1"></i> PNG
      </button>

      <!-- Direct download SVG -->
      <button id="download-current-svg-btn" class="btn btn-ghost btn-sm" title="Download SVG">
        <i data-lucide="file-code" class="w-4 h-4 mr-1"></i> SVG
      </button>

      <!-- Direct download Animated SVG -->
      <button
        id="download-current-animated-btn"
        class="btn btn-ghost btn-sm"
        title="Download Video (WebM)"
      >
        <i data-lucide="play" class="w-4 h-4 mr-1"></i> Video
      </button>

      <button id="save-btn" class="btn btn-primary btn-sm">
        <i data-lucide="save" class="w-4 h-4 mr-1"></i> Save Signature
      </button>
    </div>
  </div>

  <include src="saved-signatures.html" />
</div>
