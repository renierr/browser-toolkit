<div class="flex flex-col gap-6 max-w-4xl mx-auto">
    <div class="card bg-base-100 shadow-md p-6 border">
        <h2 class="text-xl font-bold mb-4">Signature Creator</h2>
        <p class="text-base-content/70 mb-6">
            Draw your signature in the canvas below.<br>
            Curve mode and DPI settings will also apply to saved signatures when downloading.
        </p>
        <div class="flex flex-wrap gap-4 mb-4 items-start">
            <div class="form-control">
                <label class="label py-0" for="stroke-color">
                    <span class="label-text text-xs">Color</span>
                </label>
                <input type="color" id="stroke-color" class="input input-bordered p-1 w-12 h-10" value="#0B3D91">
            </div>
            <div class="form-control">
                <label class="label py-0" for="stroke-width">
                    <span class="label-text text-xs">Width: <span id="width-value">2</span>px</span>
                </label>
                <input type="range" id="stroke-width" min="1" max="12" value="4" class="range range-xs range-primary">
            </div>
            <div class="form-control">
                <label class="label py-0" for="curve-mode">
                    <span class="label-text text-xs">Curve mode</span>
                </label>
                <div class="relative">
                    <select id="curve-mode" class="select select-bordered w-full">
                        <option value="natural" selected>Natural</option>
                        <option value="fast">Fast</option>
                        <option value="fast">Draft</option>
                        <option value="none">None (raw strokes)</option>
                    </select>
                </div>
            </div>
            <div class="form-control">
                <label class="label py-0" for="export-dpi">
                    <span class="label-text text-xs">PNG Export DPI</span>
                </label>
                <input type="number" id="export-dpi" value="72" class="input" />
            </div>
        </div>

        <div id="canvas-container" class="min-h-32 relative border-2 border-dashed border-base-300 rounded-lg bg-white w-full" >
            <canvas id="signature-canvas" class="cursor-crosshair bg-white w-full h-full"></canvas>
        </div>

        <div class="flex flex-wrap gap-2 mt-4">
            <button id="clear-btn" class="btn btn-outline btn-error btn-sm">
                <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> Clear
            </button>
            <div class="sm:grow"></div>

            <!-- Direct download PNG -->
            <button id="download-current-png-btn" class="btn btn-ghost btn-sm" title="Download PNG (no save)">
                <i data-lucide="download" class="w-4 h-4 mr-1"></i> PNG
            </button>

            <!-- Direct download SVG -->
            <button id="download-current-svg-btn" class="btn btn-ghost btn-sm" title="Download SVG (no save)">
                <i data-lucide="file-code" class="w-4 h-4 mr-1"></i> SVG
            </button>

            <button id="save-btn" class="btn btn-primary btn-sm">
                <i data-lucide="save" class="w-4 h-4 mr-1"></i> Save Signature
            </button>
        </div>
    </div>

    <div id="saved-signatures-container" class="card bg-base-100 shadow-md p-6 hidden">
        <h2 class="text-xl font-bold mb-4">Saved Signatures</h2>
        <div id="signatures-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Signatures will be injected here -->
        </div>
    </div>
</div>

<template id="signature-item-template">
    <div class="flex flex-col border border-base-300 rounded-lg p-4 bg-base-200/50">
        <div class="bg-white rounded border border-base-300 mb-2 flex items-center justify-center overflow-hidden" style="height: 100px;">
            <img class="signature-preview max-h-full max-w-full object-contain" src="" alt="Signature preview">
        </div>
        <div class="flex justify-between items-center">
            <span class="text-xs opacity-70 signature-date"></span>
            <div class="flex gap-1">
                <button class="btn btn-ghost btn-xs text-error delete-signature-btn" title="Delete">
                    <i data-lucide="trash" class="w-3 h-3"></i>
                </button>
                <button class="btn btn-ghost btn-xs load-signature-btn" title="Load">
                    <i data-lucide="corner-right-up" class="w-3 h-3"></i>
                </button>
                <button class="btn btn-ghost btn-xs download-svg-btn" title="Download SVG">
                    <i data-lucide="file-code" class="w-3 h-3"></i>
                </button>
                <button class="btn btn-ghost btn-xs download-png-btn" title="Download PNG">
                    <i data-lucide="download" class="w-3 h-3"></i>
                </button>
            </div>
        </div>
    </div>
</template>
