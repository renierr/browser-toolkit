<!--suppress CssUnusedSymbol -->
<div class="card bg-base-100">
  <div class="card-body">
    <h2 class="card-title text-2xl font-bold mb-4">HTML to PDF</h2>

    <div id="editor-container" class="border rounded-lg overflow-hidden mb-6 shadow-xl">
      <div
        id="editor-toolbar"
        class="flex flex-wrap items-center gap-1 p-2 bg-base-200 border-b border-base-300"
      >
        <select
          id="heading-select"
          class="select select-xs select-bordered w-fit"
          aria-label="Heading Level"
        >
          <option value="">Paragraph</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="h4">Heading 4</option>
          <option value="h5">Heading 5</option>
          <option value="h6">Heading 6</option>
        </select>
        <div class="divider divider-horizontal mx-0 h-6"></div>
        <button type="button" id="btn-bold" class="btn btn-xs btn-ghost" title="Bold">
          <i data-lucide="bold" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-italic" class="btn btn-xs btn-ghost" title="Italic">
          <i data-lucide="italic" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-underline" class="btn btn-xs btn-ghost" title="Underline">
          <i data-lucide="underline" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-strike" class="btn btn-xs btn-ghost" title="Strikethrough">
          <i data-lucide="strikethrough" class="w-4 h-4"></i>
        </button>
        <!-- Forecolor dropdown -->
        <div class="dropdown dropdown-bottom">
          <label tabindex="0" class="btn btn-xs btn-ghost relative" title="Text Color">
            <i data-lucide="palette" class="w-4 h-4"></i>
            <span
              class="color-indicator"
              id="forecolor-indicator"
              style="background-color: #000000"
            ></span>
          </label>
          <div
            tabindex="0"
            id="forecolor-dropdown"
            class="dropdown-content z-50 p-2 shadow bg-base-100 rounded-box w-48 border"
          >
            <div class="grid grid-cols-5 gap-1 mb-2">
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #000000"
                data-color="#000000"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ffffff; border: 1px solid #ccc"
                data-color="#FFFFFF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ff0000"
                data-color="#FF0000"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #00ff00"
                data-color="#00FF00"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #0000ff"
                data-color="#0000FF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ffff00"
                data-color="#FFFF00"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ff00ff"
                data-color="#FF00FF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #00ffff"
                data-color="#00FFFF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #808080"
                data-color="#808080"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #c0c0c0"
                data-color="#C0C0C0"
              ></button>
            </div>
            <div class="flex items-center gap-2">
              <input
                type="color"
                id="forecolor-picker"
                class="w-8 h-8 p-0 border-0 cursor-pointer"
              />
            </div>
          </div>
        </div>
        <!-- Hilitecolor dropdown -->
        <div class="dropdown dropdown-bottom">
          <label tabindex="0" class="btn btn-xs btn-ghost relative" title="Highlight Color">
            <i data-lucide="highlighter" class="w-4 h-4"></i>
            <span
              class="color-indicator"
              id="hilitecolor-indicator"
              style="background-color: transparent; border: 1px solid #ccc"
            ></span>
          </label>
          <div
            tabindex="0"
            id="hilitecolor-dropdown"
            class="dropdown-content z-50 p-2 shadow bg-base-100 rounded-box w-48 border"
          >
            <div class="grid grid-cols-5 gap-1 mb-2">
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: transparent; border: 1px solid #ccc"
                data-color="transparent"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ffff00"
                data-color="#FFFF00"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #00ff00"
                data-color="#00FF00"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #00ffff"
                data-color="#00FFFF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ff00ff"
                data-color="#FF00FF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ff9900"
                data-color="#FF9900"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #ff0000"
                data-color="#FF0000"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #0000ff"
                data-color="#0000FF"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #800080"
                data-color="#800080"
              ></button>
              <button
                class="color-swatch w-6 h-6 rounded"
                style="background-color: #008000"
                data-color="#008000"
              ></button>
            </div>
            <div class="flex items-center gap-2">
              <input
                type="color"
                id="hilitecolor-picker"
                class="w-8 h-8 p-0 border-0 cursor-pointer"
              />
            </div>
          </div>
        </div>
        <button type="button" id="btn-clear" class="btn btn-xs btn-ghost" title="Clear Formatting">
          <i data-lucide="eraser" class="w-4 h-4"></i>
        </button>
        <div class="divider divider-horizontal mx-0 h-6"></div>
        <button type="button" id="btn-ul" class="btn btn-xs btn-ghost" title="Bullet List">
          <i data-lucide="list" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-ol" class="btn btn-xs btn-ghost" title="Numbered List">
          <i data-lucide="list-ordered" class="w-4 h-4"></i>
        </button>
        <div class="divider divider-horizontal mx-0 h-6"></div>
        <button type="button" id="btn-align-left" class="btn btn-xs btn-ghost" title="Align Left">
          <i data-lucide="align-left" class="w-4 h-4"></i>
        </button>
        <button
          type="button"
          id="btn-align-center"
          class="btn btn-xs btn-ghost"
          title="Align Center"
        >
          <i data-lucide="align-center" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-align-right" class="btn btn-xs btn-ghost" title="Align Right">
          <i data-lucide="align-right" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-align-justify" class="btn btn-xs btn-ghost" title="Justify">
          <i data-lucide="align-justify" class="w-4 h-4"></i>
        </button>
        <div class="divider divider-horizontal mx-0 h-6"></div>
        <button type="button" id="btn-blockquote" class="btn btn-xs btn-ghost" title="Blockquote">
          <i data-lucide="quote" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-code" class="btn btn-xs btn-ghost" title="Code Block">
          <i data-lucide="code" class="w-4 h-4"></i>
        </button>
        <div class="divider divider-horizontal mx-0 h-6"></div>
        <button type="button" id="btn-link" class="btn btn-xs btn-ghost" title="Insert Link">
          <i data-lucide="link" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-image" class="btn btn-xs btn-ghost" title="Insert Image">
          <i data-lucide="image" class="w-4 h-4"></i>
        </button>
        <button type="button" id="btn-fullscreen" class="btn btn-xs btn-ghost" title="Fullscreen">
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>
        <button
          type="button"
          id="btn-generate-pdf"
          class="btn btn-xs btn-primary"
          title="Generate PDF"
        >
          <i data-lucide="file-text" class="w-4 h-4"></i>
        </button>
      </div>
      <div
        id="editor"
        class="bg-base-100 text-base-content min-h-60 p-4 prose max-w-none focus:outline-none"
        contenteditable="true"
        style="height: 400px; max-height: 50vh; overflow-y: auto"
      ></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
      <div class="form-control">
        <label class="label" for="font-family"
          ><span class="label-text font-semibold">Font Family</span></label
        >
        <select id="font-family" class="select select-bordered w-full" data-setting="fontFamily">
          <option value="sans-serif" selected>Sans-serif (default)</option>
          <option value="NotoSans, sans-serif">NotoSans</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="font-size"
          ><span class="label-text font-semibold">Font Size</span></label
        >
        <input
          type="number"
          id="font-size"
          value="12"
          min="6"
          max="72"
          class="input input-bordered w-full"
          data-setting="fontSize"
        />
      </div>
      <div class="form-control">
        <label class="label" for="page-size"
          ><span class="label-text font-semibold">Page Size</span></label
        >
        <select id="page-size" class="select select-bordered w-full" data-setting="pageSize">
          <optgroup label="ISO A Series">
            <option value="A4" selected>A4</option>
            <option value="A3">A3</option>
            <option value="A5">A5</option>
          </optgroup>
          <optgroup label="North American">
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
          </optgroup>
          <option value="Custom">Custom</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="page-orientation"
          ><span class="label-text font-semibold">Orientation</span></label
        >
        <select
          id="page-orientation"
          class="select select-bordered w-full"
          data-setting="orientation"
        >
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label" for="margin-size"
          ><span class="label-text font-semibold">Margin (pt)</span></label
        >
        <input
          type="number"
          id="margin-size"
          value="20"
          min="0"
          max="100"
          class="input input-bordered w-full"
          data-setting="pageMargin"
        />
      </div>
    </div>

    <div id="custom-size-container" class="hidden grid grid-cols-2 gap-4 mb-8">
      <div class="form-control">
        <label class="label" for="custom-width"
          ><span class="label-text font-semibold">Width (pt)</span></label
        >
        <input
          type="number"
          id="custom-width"
          value="595"
          min="1"
          class="input input-bordered w-full"
          data-setting="customWidth"
        />
      </div>
      <div class="form-control">
        <label class="label" for="custom-height"
          ><span class="label-text font-semibold">Height (pt)</span></label
        >
        <input
          type="number"
          id="custom-height"
          value="842"
          min="1"
          class="input input-bordered w-full"
          data-setting="customHeight"
        />
      </div>
    </div>

    <div class="card-actions justify-end gap-4">
      <button id="load-content" class="btn btn-secondary">
        <i data-lucide="file-code" class="w-4 h-4 mr-2"></i>
        Load HTML
      </button>
      <button id="save-content" class="btn btn-outline">
        <i data-lucide="save" class="w-4 h-4 mr-2"></i>
        Save HTML
      </button>
      <button id="generate-pdf" class="btn btn-primary">
        <i data-lucide="file-text" class="w-4 h-4 mr-2"></i>
        Generate PDF
      </button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".html,.htm,.txt" class="hidden" />
<input type="file" id="image-input" accept="image/*" class="hidden" />

<style>
  .editor-image-container {
    display: inline-block;
    position: relative;
    margin: 8px 0;
    max-width: 100%;
    user-select: none;
  }
  .editor-image-container--selected {
    outline: none;
  }
  .editor-image-container--selected::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid #3b82f6;
    border-radius: 4px;
    pointer-events: none;
  }
  .editor-image-container--dragging {
    opacity: 0.5;
  }
  .editor-image-container[contenteditable='false'] {
    cursor: move;
  }
  .editor-image-container img {
    display: block;
    max-width: 300px;
    height: auto;
    pointer-events: none;
  }
  .editor-image-container__handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 24px;
    height: 24px;
    background: linear-gradient(135deg, transparent 50%, #3b82f6 50%);
    cursor: se-resize;
    border-radius: 0 0 4px 0;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: auto;
    tabindex: -1;
  }
  .editor-image-container__handle::before {
    content: '';
    position: absolute;
    right: 4px;
    bottom: 4px;
    width: 6px;
    height: 6px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
  }
  .editor-image-container__handle::after {
    content: '';
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 6px;
    height: 6px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
  }
  .editor-image-container--selected .editor-image-container__handle {
    opacity: 1;
  }
  .editor-image-container__handle * {
    pointer-events: none;
  }
  .editor-image-container,
  .editor-image-container__handle {
    -webkit-user-select: text;
    user-select: text;
    outline: none;
  }
  .editor-image-container:focus,
  .editor-image-container__handle:focus {
    outline: none;
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 6px;
    height: 6px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
  }
  .editor-image-container.selected .editor-image-container__handle {
    opacity: 1;
  }
  .editor-image-container .resize-handle * {
    pointer-events: none;
  }

  #editor h1 {
    font-size: 2em;
    margin: 0.67em 0;
  }
  #editor h2 {
    font-size: 1.5em;
    margin: 0.83em 0;
  }
  #editor h3 {
    font-size: 1.17em;
    margin: 1em 0;
  }
  #editor h4 {
    font-size: 1em;
    margin: 1.33em 0;
  }
  #editor h5 {
    font-size: 0.83em;
    margin: 1.67em 0;
  }
  #editor h6 {
    font-size: 0.67em;
    margin: 2.33em 0;
  }

  #editor blockquote,
  #editor blockquote p {
    margin: 1em 0;
    padding: 0.75em 1em 0.75em 0.75em;
    border-left: 4px solid #3b82f6;
    background: #f3f4f6;
    font-style: italic;
    color: #374151;
  }

  #editor blockquote:empty::before {
    content: 'Quote...';
    color: #9ca3af;
    font-style: italic;
  }

  [data-theme='dark'] #editor blockquote,
  [data-theme='dark'] #editor blockquote p {
    background: #1f2937;
    border-left-color: #60a5fa;
    color: #d1d5db;
  }

  [data-theme='dark'] #editor blockquote:empty::before {
    color: #6b7280;
  }

  #editor a {
    color: #3b82f6;
    text-decoration: underline;
    cursor: pointer;
  }

  #editor pre,
  #editor pre code,
  #editor code {
    font-family: 'Courier New', Courier, monospace;
    background: #f3f4f6;
    border-radius: 4px;
    color: #374151;
  }
  #editor pre {
    margin: 1em 0;
    padding: 1em;
    overflow-x: auto;
    border: 1px solid #d1d5db;
  }
  #editor pre:empty::before {
    content: 'Code block...';
    color: #9ca3af;
  }
  #editor code {
    padding: 0.2em 0.4em;
    font-size: 0.9em;
  }

  [data-theme='dark'] #editor pre,
  [data-theme='dark'] #editor pre code,
  [data-theme='dark'] #editor code {
    background: #1f2937;
    color: #d1d5db;
    border-color: #374151;
  }

  [data-theme='dark'] #editor a {
    color: #60a5fa;
  }

  #editor ul,
  #editor ol {
    margin: 0.5em 0;
    padding-left: 2em;
    display: block;
  }
  #editor ul {
    list-style-type: disc;
  }
  #editor ul ul {
    list-style-type: circle;
  }
  #editor ol {
    list-style-type: decimal;
  }
  #editor li {
    margin: 0.25em 0;
    display: list-item;
  }

  #editor .btn-ghost {
    opacity: 0.7;
  }
  #editor .btn-ghost:hover {
    opacity: 1;
  }

  [data-theme='dark'] .card #editor-toolbar .btn-ghost {
    background: transparent;
    color: oklch(var(--bc));
    border: 1px solid oklch(var(--bc) / 0.2);
  }

  [data-theme='dark'] .card #editor-toolbar .btn-ghost:hover {
    background: oklch(var(--b2));
    border-color: oklch(var(--bc) / 0.4);
  }

  [data-theme='dark'] .card #editor-toolbar .btn-active {
    background: oklch(var(--p));
    color: oklch(var(--pc));
    border-color: oklch(var(--p));
  }
  #editor-container.fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    height: 100dvh !important;
    max-height: none !important;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    margin-bottom: 1rem;

    #editor {
      max-height: none !important;
      height: 100% !important;
    }
  }
  .color-indicator {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 3px;
    border-radius: 1px;
  }
  .dropdown-content {
    margin-top: 4px;
  }
  .color-swatch {
    border: 1px solid transparent;
    transition: transform 0.1s;
  }
  .color-swatch:hover {
    transform: scale(1.2);
  }
</style>
