<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
      html, body {
          overscroll-behavior: none;
      }

      body {
          margin: 0;
          padding: 0;
      }

      #pdf-viewer {
          height: 100dvh;
      }

  </style>

</head>
<body>

<!-- Global progress overlay -->
<div
  id="ui-progress"
  class="invisible fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"
  aria-hidden="true"
>
  <div class="relative w-full max-w-md rounded-2xl border border-card bg-card shadow-xl p-6">
    <button
      id="ui-progress-close"
      type="button"
      class="hidden absolute top-3 right-3 h-9 w-9 items-center justify-center rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 transition text-heading"
      aria-label="Close progress"
      title="Close"
    >
      &#10005;
    </button>

    <div class="flex items-center gap-4">
      <svg
        class="h-6 w-6 animate-spin text-heading"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
        ></path>
      </svg>

      <div class="flex-1">
        <div class="text-sm text-card-desc">Progress</div>
        <div id="ui-progress-text" class="text-lg font-semibold text-heading">Working…</div>
      </div>
    </div>
  </div>
</div>

<!-- Global message stack (toasts) -->
<div id="ui-messages" class="toast z-50" aria-live="polite" aria-relevant="additions"></div>

<div id="pdf-viewer" class=""></div>
<script type="module" src="./src/pdf-viewer.ts"></script>
</body>
</html>
